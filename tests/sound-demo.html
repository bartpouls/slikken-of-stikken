<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geluidstest</title>
<style>
  body { margin: 0; padding: 16px; font: 16px/1.4 system-ui, sans-serif; background: #111; color: #eee; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  button { min-height: 48px; min-width: 48px; font: inherit; border: 1px solid #555; border-radius: 8px; background: #222; color: #eee; padding: 8px; text-align: left; }
  button small { display: block; color: #aaa; font-size: 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  #status { color: #aaa; font-size: 14px; }
</style>
</head>
<body>
<h1>Slikken of Stikken: geluidstest</h1>
<div class="bar">
  <button id="mute" type="button"></button>
  <button id="gates" type="button">Poortjes elke 3 s: uit</button>
  <button id="spam" type="button">20× snel 'slik'</button>
</div>
<div class="grid" id="grid"></div>
<p id="status"></p>
<script src="../src/sound.js"></script>
<script>
(function () {
  var S = window.SoS.sound;
  var info = {
    tik: 'knop-tik', poort: 'poortje komt eraan', slik: 'tablet slikken',
    zetpil: 'zetpil', spuit: 'spuit (direct)', overslaan: 'niets / overslaan',
    au: 'fout / onder de zone', alarm: 'te hoog / giftig / lever',
    wending: 'plotwending', bonk: 'lithium-spuitgrap', klaar: 'race klaar'
  };
  var grid = document.getElementById('grid');
  var status = document.getElementById('status');
  function show(t) { status.textContent = t + ' · stemmen: ' + S.voices() + ' · Web Audio: ' + (S.available ? 'ja' : 'nee'); }
  S.names.forEach(function (n) {
    var b = document.createElement('button');
    b.type = 'button';
    b.id = 'snd-' + n;
    b.innerHTML = n + '<small>' + (info[n] || '') + '</small>';
    b.addEventListener('click', function () { S.unlock(); show(n + ': ' + (S.play(n) ? 'gespeeld' : 'niet gespeeld')); });
    grid.appendChild(b);
  });
  var mute = document.getElementById('mute');
  function label(m) { mute.textContent = m ? 'Geluid: uit' : 'Geluid: aan'; mute.setAttribute('aria-pressed', String(m)); }
  label(S.muted);
  S.onMuteChange(label);
  mute.addEventListener('click', function () { S.unlock(); S.toggle(); });
  var timer = null, gates = document.getElementById('gates');
  gates.addEventListener('click', function () {
    S.unlock();
    if (timer) { clearInterval(timer); timer = null; gates.textContent = 'Poortjes elke 3 s: uit'; return; }
    timer = setInterval(function () { S.play('poort'); }, 3000);
    gates.textContent = 'Poortjes elke 3 s: aan';
  });
  document.getElementById('spam').addEventListener('click', function () {
    S.unlock();
    var i = 0, t = setInterval(function () { S.play('slik'); if (++i >= 20) { clearInterval(t); show('spam klaar'); } }, 20);
  });
  show('klaar om te testen');
})();
</script>
</body>
</html>
