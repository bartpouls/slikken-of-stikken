/*
 * Slikken of Stikken — src/style.css (gedeelde stijl + start, introkaartje, race)
 *
 * EÉN STIJL VOOR ALLE SCHERMEN (§6D): zwart met gekleurde sterretjes, platte figuurtjes, paarse
 * tijdmarkering met een lijn ervoor en erachter, korte witte tekst in het midden.
 *
 * GEDEELD (einde.css hergebruikt dit, niet opnieuw definiëren):
 *   Kleuren:  --zwart --wit --zacht (grijswit voor bijzaken) --paars (tijdmarkering, poortjes)
 *             --groen (zone) --koraal (te laag/fout) --geel --blauw (pet opa Jan) --rood (hoed mevrouw De Vries)
 *   Schermen: <section class="scherm"> vult het hele scherm, doorzichtig boven de sterren (#app);
 *             alleen het scherm met .actief is zichtbaar (app.js regelt dat).
 *   .kaart      gecentreerde kolom (start, introkaartje)
 *   .markering  paarse kop met een lijn ervoor en erachter
 *   .tekst      korte witte tekst in het midden (.groot = verhaalzin)
 *   Knoppen:    .knop-paars (hoofdknop, pil), .knop-lijn (tweede keus), .knop-stil (tekstknop);
 *               .groot = breed. Alle knoppen ≥ 48×48 px.
 *   Figuren:    .fig met een SVG van SoS.ui.figuur(); .fig.wiebel = korte reactie bij aanraken.
 */
:root {
  --zwart: #000;
  --wit: #fff;
  --zacht: rgba(255, 255, 255, .74);
  --lijn: rgba(255, 255, 255, .2);
  --vlak: #101017;
  --paars: #b07cff;
  --paars-diep: #8a55f0;
  --groen: #3ddc97;
  --koraal: #ff6f61;
  --geel: #ffd166;
  --blauw: #4f8dff;
  --rood: #ff4d6d;
  --roze: #ff8fb8;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --veilig-boven: env(safe-area-inset-top, 0px);
  --veilig-onder: env(safe-area-inset-bottom, 0px);
  --veilig-links: env(safe-area-inset-left, 0px);
  --veilig-rechts: env(safe-area-inset-right, 0px);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  background: var(--zwart);
  color: var(--wit);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}
body { position: fixed; inset: 0; }
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer; }
input { font: inherit; }
[hidden] { display: none !important; }

/* de sterren (app.js tekent ze één keer en zet --sterren) */
#app { position: absolute; inset: 0; overflow: hidden; background: var(--zwart) var(--sterren, none) center top / 420px 900px repeat; }

/* ---------- schermen ---------- */
.scherm {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  padding: calc(var(--veilig-boven) + 12px) calc(var(--veilig-rechts) + 20px) calc(var(--veilig-onder) + 12px) calc(var(--veilig-links) + 20px);
  color: var(--wit);
  opacity: 0; visibility: hidden;
  transition: opacity .35s ease, visibility 0s linear .35s;
  overflow-x: hidden; overflow-y: auto;
}
.scherm.actief { opacity: 1; visibility: visible; transition: opacity .35s ease, visibility 0s; }

.kaart {
  margin: auto; width: 100%; max-width: 400px;
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: 8px 0;
}

/* paarse tijdmarkering: lijn — tekst — lijn */
.markering {
  display: flex; align-items: center; gap: 12px; width: 100%; margin: 0;
  color: var(--paars); font-size: 17px; font-weight: 700; line-height: 1.2; white-space: nowrap;
}
.markering::before, .markering::after { content: ""; flex: 1 1 0; min-width: 16px; height: 1.5px; background: currentColor; opacity: .85; }

.tekst { margin: 0; max-width: 330px; font-size: 18px; line-height: 1.4; font-weight: 600; color: var(--wit); }
.tekst.groot { font-size: 20px; }

/* ---------- knoppen ---------- */
.knop-paars, .knop-lijn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 56px; min-width: 160px; padding: 10px 28px;
  border-radius: 999px; font-size: 20px; font-weight: 700;
  transition: transform .1s ease;
}
.knop-paars {
  background: var(--paars-diep); color: var(--wit); border: 0;
  box-shadow: 0 0 0 4px rgba(176, 124, 255, .25), 0 8px 30px rgba(138, 85, 240, .45);
}
.knop-lijn { background: transparent; color: var(--wit); border: 2px solid rgba(255, 255, 255, .45); }
.knop-paars:active, .knop-lijn:active { transform: scale(.96); }
.knop-paars.groot { width: 100%; max-width: 320px; min-height: 60px; font-size: 22px; }
.knop-stil {
  min-height: 48px; min-width: 48px; padding: 8px 16px; border: 0; background: transparent;
  color: var(--zacht); font-size: 16px; font-weight: 600; text-decoration: underline; text-underline-offset: 4px;
}
.knop-paars:focus-visible, .knop-lijn:focus-visible, .knop-stil:focus-visible, .actie:focus-visible { outline: 3px solid var(--wit); outline-offset: 3px; }

/* ---------- dempknop (altijd bereikbaar) ---------- */
.demp {
  position: fixed; z-index: 50;
  top: calc(var(--veilig-boven) + 6px); right: calc(var(--veilig-rechts) + 6px);
  width: 48px; height: 48px; padding: 0;
  display: grid; place-items: center;
  border: 0; border-radius: 50%;
  background: transparent; color: var(--zacht);
}
.demp svg { width: 26px; height: 26px; }
.demp[aria-pressed="true"] { color: var(--koraal); }

/* ---------- figuurtjes ---------- */
.fig { display: inline-block; line-height: 0; transform-origin: 50% 100%; }
.fig svg { display: block; width: 100%; height: auto; overflow: visible; }
.fig.wiebel { animation: wiebel .45s ease; }
@keyframes wiebel { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg) translateY(-4px); } 60% { transform: rotate(5deg); } }

/* ---------- start ---------- */
.start-figuren { display: flex; gap: 26px; align-items: flex-end; justify-content: center; margin-bottom: 10px; }
.start-figuren .fig { width: 96px; }
.titel { margin: 6px 0 10px; font-size: clamp(36px, 11.5vw, 48px); line-height: 1.02; font-weight: 800; letter-spacing: -.01em; }
.titel span { font-weight: 500; font-size: .6em; color: var(--paars); }
.start-form { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 30px; }
#naam {
  width: 100%; max-width: 320px; min-height: 56px;
  padding: 12px 16px; text-align: center;
  font-size: 20px; /* ≥ 16px: geen zoom in iOS */
  color: var(--wit); background: rgba(255, 255, 255, .06);
  border: 2px solid rgba(255, 255, 255, .4); border-radius: 999px; outline: none;
}
#naam::placeholder { color: rgba(255, 255, 255, .55); }
#naam:focus { border-color: var(--paars); box-shadow: 0 0 0 4px rgba(176, 124, 255, .25); }
.start-form .knop-stil { margin-top: -6px; }
.kleintje { margin: 14px 0 0; font-size: 13px; color: var(--zacht); }

/* ---------- intro-kaartje ---------- */
.intro-fig { height: 132px; margin: 22px 0 18px; display: flex; align-items: flex-end; justify-content: center; }
.intro-fig .fig { width: 100px; cursor: pointer; }
.intro-regel { list-style: none; margin: 20px 0 0; padding: 0; max-width: 330px; font-size: 16.5px; line-height: 1.38; color: var(--zacht); }
.intro-regel li { margin: 0 0 9px; }
.intro-qaly { margin: 8px 0 0; max-width: 330px; font-size: 14.5px; line-height: 1.4; color: var(--zacht); }
.intro-qaly:empty { display: none; }
#scherm-intro .knop-paars { margin-top: 22px; flex: none; }
@media (max-height: 700px) {
  .start-figuren .fig { width: 78px; }
  .start-form { margin-top: 20px; gap: 12px; }
  .intro-fig { height: 92px; margin: 12px 0 10px; }
  .intro-fig .fig { width: 70px; }
  .tekst.groot { font-size: 18px; }
  .intro-regel { margin-top: 12px; font-size: 15.5px; }
  .intro-regel li { margin-bottom: 6px; }
  .intro-qaly { font-size: 14px; }
  #scherm-intro .knop-paars { margin-top: 14px; }
}

/* ---------- race ---------- */
#scherm-race { padding: 0; overflow: hidden; }
.race-kop {
  flex: none;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(var(--veilig-boven) + 8px) calc(var(--veilig-rechts) + 62px) 2px calc(var(--veilig-links) + 16px);
  min-height: calc(var(--veilig-boven) + 56px);
}
.klok { font-size: 26px; font-weight: 800; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.klok small { font-size: 17px; font-weight: 600; color: rgba(255, 255, 255, .65); margin-left: 4px; }
.qaly { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
.qaly-label { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: rgba(255, 255, 255, .55); }
.qaly-getal { font-size: 26px; font-weight: 800; min-width: 3ch; text-align: right; transition: color .3s; }
.qaly.negatief .qaly-getal { color: var(--koraal); }
.qaly-trend { width: 14px; font-size: 14px; line-height: 1; align-self: center; }
.qaly.plus .qaly-trend { color: var(--groen); }
.qaly.min .qaly-trend { color: var(--koraal); }

.race-rij {
  flex: none; min-height: 34px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 0 calc(var(--veilig-rechts) + 16px) 4px calc(var(--veilig-links) + 16px);
  font-size: 14px; color: rgba(255, 255, 255, .78);
}
.lever { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.lever-icoon { width: 22px; height: 17px; color: #c9785b; flex: none; }
.lever-tekst { font-variant-numeric: tabular-nums; }
.lever-meter { position: relative; width: 70px; height: 10px; border-radius: 6px; background: rgba(255, 255, 255, .14); overflow: hidden; flex: none; }
.lever-vul { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--geel); border-radius: 6px; transition: width .3s ease, background .3s; }
.lever-max { position: absolute; top: 0; bottom: 0; left: 80%; width: 2px; background: rgba(255, 255, 255, .7); }
.lever.vol .lever-vul { background: var(--koraal); }
.lever.vol { color: var(--koraal); } /* tekst blijft vol zichtbaar (≥ 4,5:1); alleen meter en icoon knipperen */
.lever.vol .lever-meter, .lever.vol .lever-icoon { animation: knipper 1s ease 3; }
.lever.vol .lever-icoon { color: var(--koraal); }
@keyframes knipper { 50% { opacity: .35; } }
.lever.tel .lever-tekst { animation: tel .5s ease; }
@keyframes tel { 40% { transform: scale(1.18); color: var(--geel); } }
.lever-tekst { display: inline-block; transform-origin: 0 50%; }
.patient { display: flex; align-items: center; gap: 8px; margin-left: auto; white-space: nowrap; }
.patient-kop { width: 30px; height: 30px; flex: none; }
.patient-kop svg { height: 100%; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
  font-size: 12.5px; font-weight: 700; background: rgba(255, 159, 67, .18); color: #ff9f43;
  animation: inploppen .4s ease;
}
@keyframes inploppen { from { transform: scale(.5); opacity: 0; } }

.podium { position: relative; flex: 1 1 auto; min-height: 0; }
#doek { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.melding {
  position: absolute; left: 50%; top: 80px; /* boven in het podium (verleden), los van de nu-lijn en de keuzeregel */
  width: min(92%, 380px); transform: translate(-50%, -8px);
  text-align: center; font-size: 19px; line-height: 1.35; font-weight: 600;
  color: var(--wit); text-shadow: 0 1px 12px #000, 0 0 3px #000;
  opacity: 0; transition: opacity .25s ease, transform .25s ease;
  pointer-events: none;
  padding: 10px 12px; border-radius: 16px;
  background: radial-gradient(ellipse at center, rgba(0, 0, 0, .92) 45%, rgba(0, 0, 0, 0) 72%);
}
.melding.zicht { opacity: 1; transform: translate(-50%, 0); }
.melding.wending { font-size: 21px; }
.melding.met-fig { display: flex; align-items: center; gap: 10px; text-align: left; }
.melding .m-fig { width: 48px; flex: none; }
.melding .m-fig svg { width: 100%; height: auto; }
.melding.au { color: #ffd2cc; }
.melding.alarm { color: #ffc2b8; }
.melding.grap { color: #e5d4ff; }

.finish {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  background: rgba(0, 0, 0, .7); padding: 0 28px;
  animation: infaden .5s ease;
  text-align: center;
}
@keyframes infaden { from { opacity: 0; } }
.finish-kop { margin: 0 0 14px; max-width: 320px; font-size: 20px; }
.finish-label { margin: 0; font-size: 15px; color: var(--zacht); }
.finish .knop-paars { margin-top: 8px; }
.finish-getal { margin: 0 0 22px; font-size: 64px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }

/* keuze-terugkoppeling boven de knoppen */
.knoppen-blok { position: relative; flex: none; }
.keuze-info {
  position: absolute; left: 0; right: 0; bottom: 100%; z-index: 2;
  padding: 0 16px 4px; text-align: center;
  font-size: 17px; font-weight: 700; line-height: 1.25; color: #fff; text-shadow: 0 0 6px #000, 0 0 2px #000;
  opacity: 0; transform: translateY(4px); transition: opacity .2s, transform .2s; pointer-events: none;
}
.keuze-info.zicht { opacity: 1; transform: none; }
.keuze-info.gekozen { color: #e6d4ff; }
.keuze-info.laat { color: #ffc2b8; }

/* toast (terug-knop) en draai-hint */
.toast {
  position: fixed; z-index: 60; left: 50%; top: calc(var(--veilig-boven) + 64px);
  transform: translate(-50%, -8px); width: max-content; max-width: calc(100% - 32px);
  padding: 12px 18px; border-radius: 14px; background: #1b1b22; border: 1px solid var(--lijn); color: #fff;
  font-size: 16px; font-weight: 600; text-align: center; box-shadow: 0 8px 30px rgba(0, 0, 0, .35);
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
.toast.zicht { opacity: 1; transform: translate(-50%, 0); }
.draai { display: none; }
@media (orientation: landscape) and (max-height: 500px) and (pointer: coarse) {
  .draai {
    display: block; position: fixed; z-index: 55; left: 50%; top: calc(var(--veilig-boven) + 6px); transform: translateX(-50%);
    padding: 6px 14px; border-radius: 999px; background: rgba(27, 27, 31, .92); color: #fff;
    font-size: 14px; font-weight: 600; pointer-events: none; white-space: nowrap;
    animation: draaiweg .5s ease 5s forwards;
  }
  @keyframes draaiweg { to { opacity: 0; visibility: hidden; } }
}

/* knoppen onderin */
.knoppen {
  display: flex; gap: 8px;
  padding: 8px calc(var(--veilig-rechts) + 12px) calc(var(--veilig-onder) + 12px) calc(var(--veilig-links) + 12px);
  background: linear-gradient(to bottom, rgba(0, 0, 0, 0), #000 30%);
}
.actie {
  position: relative; flex: 1 1 0; min-width: 48px; min-height: 76px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  padding: 6px 2px;
  background: #121219; color: var(--wit);
  border: 2px solid rgba(255, 255, 255, .16); border-radius: 18px;
  font-size: 14px; font-weight: 600;
  transition: transform .09s ease, background .15s, border-color .15s, opacity .2s;
}
.actie svg { width: 34px; height: 34px; pointer-events: none; }
.actie span { pointer-events: none; }
.actie:active, .actie.tik { transform: scale(.92); }
.actie.gekozen {
  background: rgba(176, 124, 255, .26); border-color: var(--paars);
  box-shadow: 0 0 0 3px rgba(176, 124, 255, .22), 0 0 22px rgba(176, 124, 255, .45);
}
.actie.gekozen::after {
  content: attr(data-badge);
  position: absolute; top: -9px; right: -4px;
  min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px;
  display: grid; place-items: center;
  background: var(--paars); color: #120a20; font-size: 12.5px; font-weight: 800;
}
.actie.geblokkeerd { opacity: .55; border-style: dashed; border-color: rgba(255, 255, 255, .3); background: #0b0b10; }
.actie.geblokkeerd svg { filter: grayscale(1); opacity: .6; }
.actie.geblokkeerd::before {
  content: ""; position: absolute; left: 14%; right: 14%; top: 50%; height: 3px; margin-top: -14px;
  background: var(--koraal); transform: rotate(-24deg); border-radius: 2px;
}
/* oefenronde: markering van de knop die je nu moet gebruiken */
.actie.wijs { border-color: var(--wit); animation: wijs 1.1s ease-in-out infinite; }
@keyframes wijs { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, .55); } 50% { box-shadow: 0 0 0 9px rgba(255, 255, 255, 0); } }
.actie.schud { animation: schud .35s ease; }
@keyframes schud { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

@media (min-height: 760px) {
  .actie { min-height: 84px; font-size: 15px; }
  .melding { font-size: 20px; }
}
@media (min-width: 700px) {
  #scherm-race .race-kop, #scherm-race .race-rij, #scherm-race .knoppen { padding-left: max(16px, calc(50% - 260px)); padding-right: max(62px, calc(50% - 260px)); }
}
@media (prefers-reduced-motion: reduce) {
  .scherm, .melding, .lever-vul { transition: none; }
  .fig.wiebel, .actie.schud, .lever.vol .lever-meter, .lever.vol .lever-icoon, .lever.tel .lever-tekst { animation: none; }
  .actie.wijs { animation: none; box-shadow: 0 0 0 4px rgba(255, 255, 255, .5); }
}

</style>
<style data-bron="src/einde.css">
/*
 * Slikken of Stikken — src/einde.css  (eindscherm + toedienverslag). Prefix .eind- ; gedeelde stijl in style.css.
 * Zelfde stijl als de rest van het spel: zwart met sterren, witte tekst in het midden, paarse markering met een
 * lijn ervoor en erachter. Tegels en curve gebruiken precies de lijnkleuren van de race. Ibuprofen is oranje
 * (zoals in de race); paars blijft voor poortjes en tijdmarkering. Tekstkleuren halen WCAG AA op zwart.
 */
#scherm-einde { padding-bottom: 0; scroll-behavior: auto; }
.eind-binnen { position: relative; }

.eind-binnen {
  width: 100%; max-width: 440px; margin: 0 auto;
  display: flex; flex-direction: column;
}

/* ---------- 1. eindscherm ---------- */
.eind-held { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 2px; }
.eind-naam {
  margin: 0; width: 100%;
  font-size: 36px; font-weight: 800; line-height: 1.08; letter-spacing: -.01em;
  overflow-wrap: normal; word-break: normal; hyphens: none; /* einde.js past de maat aan (≥ 32 px) */
}
.eind-label { margin: 6px 0 0; font-size: 15px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--zacht); }
.eind-totaal {
  margin: -2px 0 0; font-size: 72px; font-weight: 800; line-height: 1; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
  animation: eind-plop .5s cubic-bezier(.3, 1.6, .5, 1) both;
}
@keyframes eind-plop { from { transform: scale(.6); opacity: 0; } }

.eind-kaarten { width: 100%; display: flex; flex-direction: column; gap: 10px; }
.eind-kaart {
  display: block; width: 100%; min-height: 48px; padding: 10px 12px 8px;
  text-align: left; background: var(--vlak); color: var(--wit);
  border: 1.5px solid var(--lijn); border-radius: 18px;
  font-family: var(--font);
  transition: transform .08s ease;
}
.eind-kaart:active { transform: scale(.98); }
.eind-kaart:focus-visible { outline: 3px solid var(--wit); outline-offset: 3px; }
.eind-kaart-kop { display: flex; align-items: center; gap: 10px; }
.eind-kaart-fig { width: 34px; flex: none; margin: -4px 0 -2px; }
.eind-kaart-titel { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; font-size: 19px; font-weight: 800; line-height: 1.1; }
.eind-kaart-titel small { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--zacht); }
.eind-kaart-score { flex: none; font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.eind-kaart-rechts { flex: none; display: flex; flex-direction: column; align-items: flex-end; }
.eind-kaart-meer { margin-top: 2px; font-size: 15px; font-weight: 700; color: var(--paars); }

/* tegels: één per poortje, twee rijen */
.eind-tegels { display: flex; flex-direction: column; gap: 6px; margin-top: 9px; }
.eind-tegelrij { display: grid; grid-template-columns: 50px 1fr; align-items: center; gap: 4px; }
.eind-rijlabel { font-size: 14px; font-weight: 700; color: var(--zacht); white-space: nowrap; }
.eind-tegelvak { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 3px; padding: 0; }
.eind-tegel {
  position: relative;
  display: block; height: 22px; border-radius: 4px; background: #2c2c33;
  animation: eind-tegel .32s ease both; animation-delay: calc(var(--i, 0) * 14ms + 150ms);
}
@keyframes eind-tegel { from { transform: scale(.4) rotateX(80deg); opacity: .2; } }
.eind-tegel.m::after { /* misselijk: limoen streepje in de tegel (zoals de misselijk-strook in de race) */
  content: ""; position: absolute; left: 3px; right: 3px; bottom: 3px; height: 4px; background: #c8eb78; border-radius: 2px;
  box-shadow: 0 0 0 1.5px #000;
}
.eind-tegel.ibu::before { /* ibuprofen: oranje streep vóór de tegel */
  content: ""; position: absolute; left: -3px; top: -3px; bottom: -3px; width: 3px; background: #ff9f43; border-radius: 2px;
}
/* = LIJNKLEUR in app.js (de kleur van de spiegel in de race) */
.t-zone { background: #7ef0c4; }
.t-onder { background: #7cc4ff; }
.t-boven { background: #ffe14d; }
.t-giftig { background: #ff4d5e; }

.eind-legenda {
  list-style: none; margin: 10px 0 0; padding: 0;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 14px;
  font-size: 16px; font-weight: 600; color: var(--zacht);
}
.eind-legenda li { display: inline-flex; align-items: center; gap: 6px; }
.eind-legenda .eind-tegel { width: 16px; height: 16px; border-radius: 4px; animation: none; }
.eind-leg-m { width: 18px; height: 6px; border-radius: 2px; background: #c8eb78; }
.eind-leg-ibu { width: 5px; height: 18px; border-radius: 2px; background: #ff9f43; }

.eind-vraag {
  width: 100%; margin: 22px 0 0;
}
.eind-vraag p { margin: 10px 0 0; font-size: 22px; font-weight: 800; line-height: 1.25; }
.eind-acties { width: 100%; display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.eind-acties .knop-paars.groot { flex: 1 1 auto; max-width: none; }
/* dempknop van app.js: dezelfde plek als op de andere schermen (rechtsboven), maar hij scrolt mee */
#scherm-einde > .demp { position: absolute; top: calc(var(--veilig-boven) + 6px); right: calc(var(--veilig-rechts) + 6px); }
.eind-naam-vrij { float: left; width: 46px; height: 1em; }
.eind-naam-vrij.r { float: right; }
.eind-scorebord { margin: 12px 0 0; font-size: 16px; line-height: 1.4; color: var(--zacht); max-width: 340px; }
.eind-spelpunten { margin: 4px 0 0; font-size: 15px; color: var(--zacht); }

/* ---------- 2. toedienverslag ---------- */
.eind-verslag { margin-top: 34px; }
.eind-verslag > .markering { margin-bottom: 18px; }
.eind-v-kop { display: flex; align-items: center; gap: 12px; }
.eind-v-fig { width: 54px; flex: none; cursor: pointer; }
.eind-v-kop > div { flex: 1 1 auto; min-width: 0; }
.eind-v-kop h2 { margin: 2px 0 0; font-size: 28px; font-weight: 800; line-height: 1.05; }
.eind-v-wie { font-size: 15px; font-weight: 600; color: var(--zacht); white-space: nowrap; }
.eind-v-score { margin: 4px 0 0; font-size: 15px; font-weight: 700; color: var(--zacht); }
.eind-v-score b { font-size: 30px; font-weight: 800; line-height: 1; color: var(--wit); font-variant-numeric: tabular-nums; }

.eind-curve { margin: 14px 0 0; }
.eind-curve svg { display: block; width: 100%; height: auto; border: 1.5px solid var(--lijn); border-radius: 14px; }
.eind-curve figcaption { margin-top: 6px; font-size: 14px; color: var(--zacht); }
.eind-svg-label, .eind-svg-as, .eind-svg-gebeurtenis, .eind-svg-ibu { font-family: var(--font); font-size: 11.5px; font-weight: 600; }
.eind-svg-label { fill: rgba(255, 255, 255, .8); }
.eind-svg-label.tox { fill: #ff9a9a; }
.eind-svg-as { fill: rgba(255, 255, 255, .72); }
.eind-svg-gebeurtenis { fill: #d6ef9a; }
.eind-svg-ibu { fill: #ff9f43; }

.eind-opbouw { width: 100%; margin: 16px 0 0; border-collapse: collapse; font-size: 18px; font-variant-numeric: tabular-nums; }
.eind-opbouw caption { text-align: left; font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--zacht); padding-bottom: 4px; }
.eind-opbouw th { text-align: left; font-weight: 600; padding: 7px 0; border-bottom: 1.5px solid var(--lijn); }
.eind-opbouw td { text-align: right; font-weight: 800; padding: 7px 0; border-bottom: 1.5px solid var(--lijn); white-space: nowrap; }
.eind-opbouw td.plus { color: #7ef0c4; }
.eind-opbouw td.min { color: #ff9d92; }
.eind-opbouw td.nul { color: var(--zacht); }
.eind-opbouw-totaal th, .eind-opbouw-totaal td { border-bottom: 0; border-top: 2px solid var(--wit); font-size: 21px; font-weight: 800; padding-top: 8px; }

.eind-h3 { margin: 22px 0 6px; font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--zacht); }
.eind-echt { margin: 0 0 10px; font-size: 15.5px; line-height: 1.45; color: var(--zacht); }
.eind-echt b { font-size: 17px; color: var(--wit); }
.eind-echt-kop {
  display: inline-block; padding: 0 8px; border: 2px dashed var(--paars); border-radius: 8px;
  font-size: 13px; font-weight: 800; color: var(--paars); letter-spacing: .04em;
}

/* rooster per poortje */
.eind-rooster { list-style: none; margin: 0; padding: 0; }
.eind-rooster-uur { display: grid; grid-template-columns: repeat(var(--k, 6), 1fr); gap: 5px; }
.eind-cel {
  position: relative; min-height: 52px; padding: 14px 2px 4px;
  display: flex; align-items: center; justify-content: center; gap: 0;
  background: var(--vlak); border: 1.5px solid var(--lijn); border-radius: 10px;
}
.eind-cel.misselijk { background: rgba(190, 230, 90, .16); }
.eind-cel.echt { border: 2px dashed var(--paars); }
.eind-cel-uur { position: absolute; top: 2px; left: 6px; font-size: 11.5px; font-weight: 700; color: var(--zacht); }
.eind-cel-echt {
  position: absolute; top: 1px; right: 4px; font-size: 11px; font-weight: 800; color: var(--paars);
}
.eind-cel-anders { /* neutraal: alleen "anders dan schema", geen oordeel */
  position: absolute; bottom: 2px; right: 3px;
  color: var(--zacht); font-size: 15px; font-weight: 800; line-height: 1;
}
.eind-cel-ic { position: relative; display: inline-flex; align-items: center; }
.eind-cel-ic svg { width: 28px; height: 28px; }
.eind-cel-ic + .eind-cel-ic { margin-left: -6px; }
.eind-cel-ic b { font-size: 12px; font-weight: 800; margin-left: -2px; }
.eind-cel-leeg { font-size: 20px; font-weight: 700; color: var(--zacht); line-height: 1; }
.s-overgeslagen .eind-cel-leeg { color: var(--zacht); }

/* lithium: dagen × poortjes */
.eind-rooster-dag { display: flex; flex-direction: column; gap: 4px; }
.eind-dagrij { display: grid; grid-template-columns: 54px 1fr; align-items: center; gap: 6px; }
.eind-dagrij ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(var(--k, 3), 1fr); gap: 5px; }
.eind-dagrij .eind-cel { min-height: 46px; padding: 12px 2px 3px; }
.eind-dagkop { font-size: 12.5px; font-weight: 700; color: var(--zacht); text-align: center; grid-template-columns: 54px repeat(var(--k, 3), 1fr); gap: 5px 6px; }
.eind-dagkop span:first-child { visibility: hidden; }
.eind-dag { font-size: 15px; font-weight: 700; color: var(--zacht); }
.eind-markering { display: flex; align-items: center; gap: 10px; margin: 6px 0 4px; color: #ff9f43; font-size: 15px; font-weight: 800; }
.eind-markering::before, .eind-markering::after { content: ""; flex: 1 1 auto; height: 1.5px; background: #ff9f43; }

.eind-leg {
  list-style: none; margin: 10px 0 0; padding: 0;
  display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--zacht);
}
.eind-leg li { display: inline-flex; align-items: center; gap: 6px; }
.eind-leg-ic { display: inline-flex; width: 22px; height: 22px; align-items: center; justify-content: center; }
.eind-leg-ic svg { width: 22px; height: 22px; }
.eind-leg-leeg { font-weight: 700; color: var(--zacht); font-size: 17px; }
.eind-leg-echt { padding: 0 5px; border: 2px dashed var(--paars); border-radius: 6px; font-size: 11.5px; font-weight: 800; color: var(--paars); }
.eind-leg-anders { width: 20px; display: grid; place-items: center; color: var(--zacht); font-weight: 800; font-size: 17px; }
.eind-leg-misselijk { width: 18px; height: 18px; border-radius: 5px; background: rgba(190, 230, 90, .16); border: 1.5px solid var(--lijn); }

.eind-telling { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
.eind-telling > [data-tel="dagteller"] { grid-column: 1 / -1; }
.eind-telling > div {
  display: flex; flex-direction: column; gap: 2px; padding: 10px 10px 9px;
  background: var(--vlak); border: 1.5px solid var(--lijn); border-radius: 14px;
}
.eind-telling span { font-size: 13px; font-weight: 700; color: var(--zacht); line-height: 1.2; hyphens: manual; }
.eind-telling b { font-size: 26px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.eind-telling small { font-size: 13px; color: var(--zacht); }
.eind-telling .over { border-color: var(--koraal); background: rgba(255, 111, 97, .12); }
.eind-telling .over b, .eind-telling .over small { color: #ff9d92; }

.eind-praktijk {
  position: relative; margin: 22px 0 0; padding: 0; text-align: center;
  font-size: 19px; font-weight: 600; line-height: 1.42;
}
.eind-praktijk::before {
  content: "In de praktijk"; display: block; margin-bottom: 4px;
  font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--paars);
}
.eind-nabespreking {
  margin: 14px 0 0; text-align: center; color: var(--zacht);
  font-size: 17px; font-weight: 600; line-height: 1.4;
}

/* ---------- 3. onderaan: terug naar boven ---------- */
.eind-voet { display: flex; justify-content: center; margin-top: 26px; padding: 0 0 calc(var(--veilig-onder) + 18px); }

@media (min-height: 800px) {
  .eind-totaal { font-size: 80px; }
  .eind-tegel { height: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  .eind-totaal, .eind-tegel { animation: none; }
}
/* lage schermen (375×667): vraag en knop samen boven de vouw */
@media (max-height: 700px) {
  .eind-totaal { font-size: 58px; }
  .eind-kaart { padding: 7px 12px 7px; }
  .eind-kaart-score { font-size: 30px; }
  .eind-tegels { margin-top: 7px; gap: 3px; }
  .eind-tegel { height: 17px; }
  .eind-legenda { margin-top: 8px; }
  .eind-vraag { margin-top: 14px; }
  .eind-vraag p { font-size: 21px; }
}

</style>
</head>
<body>
<div id="app">

  <!-- 1. Start: speelnaam + Start -->
  <section id="scherm-start" class="scherm" data-scherm="start" aria-labelledby="titel">
    <div class="kaart">
      <div class="start-figuren" aria-hidden="true">
        <div class="fig" data-fig="opa"></div>
        <div class="fig" data-fig="vries"></div>
      </div>
      <h1 id="titel" class="titel">Slikken <span>of</span> Stikken</h1>
      <p class="tekst">Houd de spiegel van een geneesmiddel in het groene vlak.</p>
      <form id="start-form" class="start-form" autocomplete="off" novalidate>
        <label for="naam" class="markering">Jouw speelnaam</label>
        <input id="naam" name="naam" data-veld="naam" type="text" maxlength="16" placeholder="bv. Pilpiraat" enterkeyhint="go" autocapitalize="words" spellcheck="false">
        <button type="submit" class="knop-paars groot" data-actie="start">Start</button>
        <button type="button" class="knop-stil" data-actie="start-over">Oefenronde overslaan</button>
      </form>
      <p class="kleintje">Vereenvoudigd model voor onderwijs. Geen doseeradvies.</p>
    </div>
  </section>

  <!-- 2. De oefenronde (tutorial) draait op het racescherm hieronder: er is geen apart tutorialscherm. -->

  <!-- 3. Intro-kaartje per race -->
  <section id="scherm-intro" class="scherm" data-scherm="intro">
    <div class="kaart">
      <p class="markering" id="intro-kop">Race 1</p>
      <div class="intro-fig" id="intro-fig" aria-hidden="true"></div>
      <p class="tekst groot" id="intro-verhaal"></p>
      <ul class="intro-regel" id="intro-regel"></ul>
      <p class="intro-qaly" id="intro-qaly"></p>
      <button type="button" class="knop-paars groot" data-actie="start-race">Start race</button>
    </div>
  </section>

  <!-- 4. Race (en oefenronde: zelfde scherm, zelfde code) -->
  <section id="scherm-race" class="scherm" data-scherm="race">
    <header class="race-kop">
      <div class="klok" id="klok" aria-live="off">Uur 0</div>
      <div class="qaly" id="qaly"><span class="qaly-label">QALY</span><span class="qaly-getal" id="qaly-getal">0</span><span class="qaly-trend" id="qaly-trend" aria-hidden="true"></span></div>
    </header>
    <div class="race-rij" id="race-rij">
      <div class="lever" id="lever" hidden>
        <svg class="lever-icoon" viewBox="0 0 32 24" aria-hidden="true"><path d="M3 9c0-5 6-7 13-7 7 0 13 2 13 5 0 6-8 15-16 15C7 22 3 15 3 9z" fill="currentColor"/></svg>
        <span class="lever-tekst" id="lever-tekst">0 g van max. 4 g</span>
        <span class="lever-meter" aria-hidden="true"><span class="lever-vul" id="lever-vul"></span><span class="lever-max"></span></span>
      </div>
      <div class="patient" id="patient"><span class="fig patient-kop" id="patient-kop" aria-hidden="true"></span><span id="patient-naam"></span></div>
    </div>
    <div class="podium" id="podium">
      <canvas id="doek" aria-label="Tijdlijn met de spiegel"></canvas>
      <div class="melding" id="melding" role="status" aria-live="polite"></div>
      <div class="finish" id="finish" hidden>
        <p class="markering finish-kop" id="finish-kop">Race klaar</p>
        <p class="finish-label" id="finish-label">QALY-punten</p>
        <p class="finish-getal" id="finish-getal">0</p>
        <button type="button" class="knop-paars" data-actie="verder">Verder</button>
      </div>
    </div>
    <div class="knoppen-blok">
      <div class="keuze-info" id="keuze-info" role="status" aria-live="polite"></div>
      <nav class="knoppen" id="knoppen" aria-label="Kies vóór het poortje"></nav>
    </div>
  </section>

  <!-- 5. Einde (module src/einde.js vult dit) -->
  <section id="scherm-einde" class="scherm" data-scherm="einde"></section>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="draai" aria-hidden="true">Draai je telefoon rechtop: dan zie je meer poortjes.</div>
<button type="button" id="demp" class="demp" data-actie="demp" aria-label="Geluid uit" aria-pressed="false"></button>

<script data-bron="src/model.js">
/*
 * Slikken of Stikken — src/model.js  (rekenmodel §4 + casusdata §5 uit docs/bouwopdracht.md)
 * Puur JS, geen DOM. Browser: <script src="model.js"> zet alleen window.SoS.model.
 * Node: const M = require('./src/model.js').
 *
 * PUBLIEKE API (voor UI- en scorebouwers)
 * ---------------------------------------
 * M.CASUSSEN.paracetamol / M.CASUSSEN.lithium   Casusdata, letterlijk uit het casusblad (zie onder).
 * M.casus(id)                       -> casusobject (id 'paracetamol' | 'lithium', of een object zelf).
 * M.venster(casus, t)               -> {laag, hoog}: therapeutisch venster op tijdstip t (uur).
 *                                      Komt uit casus.venster (reeks [{vanaf, laag, hoog}], stapsgewijs);
 *                                      nu constant, later schuivend (opiaten). hoog = Infinity = geen bovengrens.
 * M.poortjes(casus)                 -> [tijden in uur] van de doseermomenten.
 * M.ZETPIL_REEKS                    -> vaste reeks [{F, ka}] (24 stuks, voor iedereen gelijk).
 * M.zetpil(i)                       -> {F, ka} voor poortje-index i (i modulo 24). Het spel gebruikt
 *                                      i = index van het poortje in de race (paracetamol: i = uur 0..23),
 *                                      dus dezelfde keuze op hetzelfde moment geeft iedereen hetzelfde.
 * M.k(casus, t)                     -> eliminatieconstante (/u) op tijdstip t, inclusief klaringgebeurtenissen.
 * M.steadyState(casus)              -> {C, depot, min, max, tau}: begintoestand lithium (dalspiegel vlak
 *                                      vóór een dosis), uit de modelkern berekend (vaste-puntoplossing).
 * M.geblokkeerd(casus, route, t)    -> null of de gebeurtenis die deze route op t blokkeert (van ≤ t < tot,
 *                                      met tolerantie 1e-9 u tegen zwevendekommaruis; ook in M.venster).
 *
 * (a) Incrementeel, voor de UI:
 *   const sim = M.maakSim('paracetamol', {blokkades: true});
 *   sim.geef('slik' | 'zetpil' | 'spuit', {aantal, F, ka, index})  -> {ok, reden?, tekst?, dosis, F, ka}
 *       slik/zetpil: dosis*F naar een eigen opnamedepot (eerste orde, ka); spuit: C += dosis/Vd.
 *       zetpil zonder F/ka: M.zetpil(index ?? huidig poortje-index).  aantal = aantal tabletten (dubbel = 2).
 *       Weigering (ok:false): reden 'geblokkeerd' (misselijkheid: slikken uur 10–16) of 'geenPrik'
 *       (lithium-spuitknop: casus.routes.spuit.tekst tonen, géén effect, geen strafpunten).
 *   sim.stap(dt)  (exact), sim.naar(t), sim.t, sim.C, sim.depot (som depots), sim.kNu,
 *   sim.venster() -> {laag,hoog} nu, sim.dagteller(t?) -> dosis in (t-24, t], sim.log (alle toedieningen).
 * (b) Batch:
 *   M.simuleer(casus, schema, {dt=0.005, blokkades=true, duur=casus.raceDuur})
 *       schema: [{t, route:'slik'|'zetpil'|'spuit', aantal?, F?, ka?}] (toedieningen op t; overslaan = weglaten)
 *       -> {t:[], C:[], log:[], samenvatting:{fractieInZone, fractieOnder, fractieBoven, fractieToxisch,
 *            urenInZone, urenOnder, urenBoven, urenToxisch, piek, tPiek, totaleDosis, aantalToedieningen,
 *            aantalTabletten, max24u, lever (bool, max24u > bovengrens), laatsteDag:{min,max}}}
 *   Beide ingangen delen dezelfde kern (stapExact): exacte exponentiële oplossing per depot, gesplitst
 *   op klaringsmomenten, dus geen integratiefout; dt bepaalt alleen de meetpunten.
 * M.analytisch.iv(D, Vd, k, t), M.analytisch.oraal(F, D, ka, Vd, k, t)  — formules §4 (voor tests).
 *
 * Eenheden: tijd in uur. Paracetamol: dosis mg, C mg/L. Lithium: dosis mmol Li⁺, C mmol/L.
 *
 * INTERPRETATIE VAN DE TABEL "VERWACHTE UITKOMSTEN" (gereproduceerd in tests/model.test.mjs):
 *  - Tijdfracties: meetpunten t = 0, dt, ..., duur−dt (dt = 0,005 u), elk punt telt voor dt; toediening op t
 *    telt al mee in het meetpunt t. Paracetamol "in zone" = C ≥ 5. Lithium "in zone" = 0,6 ≤ C ≤ 1,0;
 *    "> 1,0" = C > 1,0; "> 1,5" = C > 1,5 (de > 1,5-tijd zit ook in > 1,0).
 *  - Poortje op t = 0 telt als doseermoment (paracetamol 0,6,12,18; lithium 0,8,...,232).
 *  - Lithium start in steady state als dalspiegel VLAK VÓÓR de dosis van t = 0 (die dosis kiest de speler).
 *  - "Elke 3e dosis overslaan na de ibuprofen": poortjes vanaf t = 120 genummerd 1,2,3,...; nummer 3,6,9,...
 *    (t = 136, 160, 184, 208, 232) wordt overgeslagen.
 *  - "Laatste dag" = min–max van C over [duur−24, duur].
 *  - De tabel gaat uit van het schema zónder blokkade door misselijkheid (slik om 12 u telt gewoon);
 *    reproduceer met {blokkades:false}. In het spel (blokkades:true) wordt slikken uur 10–16 geweigerd.
 *  - Totale dosis = som van de nominale doses (zetpil en spuit tellen voor 1 g, ook bij lage F); de dagteller
 *    (max24u) gebruikt hetzelfde.
 */
(function (root, factory) {
  var api = factory();
  if (typeof module === 'object' && module && module.exports) module.exports = api;
  if (typeof window !== 'undefined') {
    window.SoS = window.SoS || {};
    window.SoS.model = api;
  }
})(this, function () {
  'use strict';

  var LN2 = Math.log(2);
  // Tolerantie (uur) voor tijdvergelijkingen met poortjes/blokkades/venster: een UI die met stap(0.1) of
  // stap(1/30) oploopt komt op t = 9,99999999999998 uit; dat telt als uur 10.
  var EPS_T = 1e-9;

  // ---------------------------------------------------------------------------------------------
  // Zetpilreeks: vaste, met de hand gekozen reeks (F in 0,3–0,9; ka in 0,3–1,0 /u). Eén waarde per
  // poortje-index (paracetamol: uur 0..23). Wisselt bewust tussen "goed" (F ≥ 0,7) en "nauwelijks"
  // (F ≤ 0,4), met ook middenwaarden; beide grenzen van beide bereiken komen voor. In het
  // misselijkheidsvenster (uur 10–15): 10 goed, 11 nauwelijks, 12 middel (0,6/0,6, = tabelregel),
  // 13 nauwelijks (0,35/0,3), 14 goed, 15 matig.
  // ---------------------------------------------------------------------------------------------
  var ZETPIL_REEKS = Object.freeze([
    { F: 0.80, ka: 0.90 }, //  0
    { F: 0.35, ka: 0.40 }, //  1
    { F: 0.65, ka: 0.55 }, //  2
    { F: 0.90, ka: 1.00 }, //  3
    { F: 0.30, ka: 0.30 }, //  4
    { F: 0.55, ka: 0.80 }, //  5
    { F: 0.75, ka: 0.45 }, //  6
    { F: 0.40, ka: 0.95 }, //  7
    { F: 0.85, ka: 0.65 }, //  8
    { F: 0.45, ka: 0.35 }, //  9
    { F: 0.70, ka: 0.85 }, // 10
    { F: 0.30, ka: 0.50 }, // 11
    { F: 0.60, ka: 0.60 }, // 12
    { F: 0.35, ka: 0.30 }, // 13
    { F: 0.90, ka: 0.75 }, // 14
    { F: 0.50, ka: 0.40 }, // 15
    { F: 0.80, ka: 0.55 }, // 16
    { F: 0.30, ka: 0.70 }, // 17
    { F: 0.65, ka: 1.00 }, // 18
    { F: 0.40, ka: 0.45 }, // 19
    { F: 0.85, ka: 0.35 }, // 20
    { F: 0.55, ka: 0.90 }, // 21
    { F: 0.75, ka: 0.30 }, // 22
    { F: 0.35, ka: 0.60 }  // 23
  ].map(Object.freeze));

  function zetpil(i) {
    var n = ZETPIL_REEKS.length;
    var j = ((Math.round(i || 0) % n) + n) % n;
    return { F: ZETPIL_REEKS[j].F, ka: ZETPIL_REEKS[j].ka };
  }

  function reeks(van, stap, aantal) {
    var r = [];
    for (var i = 0; i < aantal; i++) r.push(van + i * stap);
    return r;
  }

  // ---------------------------------------------------------------------------------------------
  // Casusdata (§5). Teksten woordelijk uit het casusblad.
  // ---------------------------------------------------------------------------------------------
  var paracetamol = {
    id: 'paracetamol',
    naam: 'Paracetamol',
    patient: 'Opa Jan',
    gewichtKg: 70,
    verhaal: 'Opa Jan (70 kg) heeft net een nieuwe heup. De pijn moet weg, zijn lever moet heel blijven.',
    eenheid: { dosis: 'mg', concentratie: 'mg/L', tijd: 'uur' },
    VdPerKg: 0.9,          // L/kg
    Vd: 63,                // L ("0,9 L/kg → 63 L")
    VdTekst: '0,9 L/kg → 63 L',
    Thalf: 2.5,            // uur
    ThalfTekst: '2,5 uur',
    routes: {
      slik: {
        dosis: 1000, F: 0.85, ka: 1.5,
        tekst: '1 g per keer, F = 0,85, ka = 1,5 /u (piek ±9,2 mg/L na ±1,4 u)'
      },
      zetpil: {
        dosis: 1000, Fbereik: [0.3, 0.9], kaBereik: [0.3, 1.0], reeks: ZETPIL_REEKS,
        tekst: '1 g per keer. Per zetpil F uit 0,3–0,9 en ka uit 0,3–1,0 /u, uit een vaste reeks (voor iedereen gelijk)'
      },
      spuit: {
        dosis: 1000, F: 1, directePiek: 15.9, telMeeVoorDagteller: true, inTutorial: true, inRace: true,
        tekst: '1 g iv, directe piek 1000/63 = 15,9 mg/L. In tutorial en race 1. Telt mee voor de dagteller.'
      }
    },
    zone: { laag: 5, hoog: Infinity, label: 'pijnstilling (vereenvoudigd)', tekst: '≥ 5 mg/L = "pijnstilling (vereenvoudigd)"' },
    // Therapeutisch venster als reeks in de tijd: vanaf t geldt {laag, hoog} (tot de volgende regel).
    venster: [{ vanaf: 0, laag: 5, hoog: Infinity }],
    toxisch: null, // geen concentratiegrens; de bovengrens is de dagteller
    bovengrens: {
      type: 'dagteller', maxPer24u: 4000, venster: 24,
      tekst: 'Dagteller: maximaal 4 g per 24 uur. Daarboven: levermeter vol.'
    },
    poortjes: { interval: 1, tijden: reeks(0, 1, 24), aantal: 24, tekst: 'elk uur (24 poortjes)', keuzes: ['slik', 'zetpil', 'spuit', 'niets'] },
    raceDuur: 24,
    raceDuurTekst: '24 uur patiënttijd (±10 T½)',
    gebeurtenissen: [{
      type: 'blokkade', van: 10, tot: 16, routes: ['slik'],
      tijdTekst: 'Uur 10 tot 16',
      tekst: 'Opa is misselijk na de narcose.',
      gevolg: 'Slikken geblokkeerd; zetpil, spuit of niets.'
    }],
    echtSchema: {
      tekst: '1 g 4dd',
      schema: [{ t: 0, route: 'slik' }, { t: 6, route: 'slik' }, { t: 12, route: 'slik' }, { t: 18, route: 'slik' }]
    },
    lekentaal: {
      onder: 'Au. De pijn komt terug.',          // onder de zone
      boven: 'Te veel paracetamol beschadigt de lever.' // boven 4 g (dagteller)
    },
    nabespreking: null // het casusblad geeft voor paracetamol geen nabesprekingstekst
  };

  var lithium = {
    id: 'lithium',
    naam: 'Lithium',
    patient: 'Mevrouw De Vries',
    gewichtKg: 70,
    verhaal: 'Mevrouw De Vries (70 kg) gebruikt al jaren lithium tegen stemmingsschommelingen. Halverwege heeft ze rugpijn en koopt ze ibuprofen bij de drogist.',
    eenheid: { dosis: 'mmol', concentratie: 'mmol/L', tijd: 'uur' },
    dosis: { mg: 400, stof: 'lithiumcarbonaat', mmol: 10.8, tekst: '400 mg lithiumcarbonaat = 10,8 mmol Li⁺ per poortje' },
    VdPerKg: 0.8,
    Vd: 56,
    VdTekst: '0,8 L/kg → 56 L',
    Thalf: 24,
    ThalfTekst: '24 uur',
    routes: {
      slik: { dosis: 10.8, F: 1.0, ka: 1.0, tekst: 'F = 1,0; ka = 1,0 /u (piek ±3,5 u na inname)' },
      spuit: {
        doetNiets: true, strafpunten: false,
        tekst: 'Lithium bestaat niet als prik. Slikken of stikken!',
        regel: 'Zichtbaar, maar doet niets aan de spiegel. Bij tikken: "Lithium bestaat niet als prik. Slikken of stikken!" Geen strafpunten.'
      }
    },
    zone: { laag: 0.6, hoog: 1.0, tekst: '0,6–1,0 mmol/L' },
    venster: [{ vanaf: 0, laag: 0.6, hoog: 1.0 }],
    toxisch: 1.5, // > 1,5 mmol/L
    toxischTekst: '> 1,5 mmol/L',
    bovengrens: { type: 'concentratie', waarde: 1.5, tekst: '> 1,5 mmol/L' },
    poortjes: {
      interval: 8, tijden: reeks(0, 8, 30), aantal: 30, keuzes: ['slik', 'overslaan'],
      tekst: '3× per dag, om 0, 8 en 16 uur (30 poortjes); keuze slikken of overslaan'
    },
    start: {
      type: 'steadyState', interval: 8, dosis: 10.8, schema: '3dd 400 mg', bereik: [0.76, 0.87],
      tekst: 'Al in steady state op 3dd 400 mg: spiegel ±0,76–0,87'
    },
    raceDuur: 240,
    raceDuurTekst: '10 dagen patiënttijd (±10 T½)',
    gebeurtenissen: [{
      type: 'klaring', t: 120, tot: null, factor: 0.7, tegenactie: false,
      tijdTekst: 'Dag 5 (t = 120 u)',
      tekst: 'Mevrouw De Vries koopt ibuprofen bij de drogist.',
      gevolg: 'Klaring × 0,7 tot het einde. Geen tegenactie mogelijk.'
    }],
    echtSchema: {
      tekst: '3dd 400 mg; na een NSAID spiegel controleren',
      schema: reeks(0, 8, 30).map(function (t) { return { t: t, route: 'slik' }; })
    },
    lekentaal: {
      onder: 'Kans op terugval: somber of juist ontremd.',
      boven: 'Trillen, misselijk, diarree. Nog hoger: verward, nieren in gevaar.'
    },
    nabespreking: 'In het echt: bij lithium liever paracetamol dan ibuprofen, en de spiegel laten prikken.'
  };

  var CASUSSEN = { paracetamol: paracetamol, lithium: lithium };

  function casus(c) {
    if (c && typeof c === 'object') return c;
    var r = CASUSSEN[c];
    if (!r) throw new Error('Onbekende casus: ' + c);
    return r;
  }

  function venster(c, t) {
    c = casus(c);
    var v = c.venster[0];
    for (var i = 1; i < c.venster.length; i++) if (t >= c.venster[i].vanaf - EPS_T) v = c.venster[i];
    return { laag: v.laag, hoog: v.hoog };
  }

  function poortjes(c) { return casus(c).poortjes.tijden.slice(); }

  function poortjeIndex(c, t) {
    var tij = casus(c).poortjes.tijden, best = 0;
    for (var i = 1; i < tij.length; i++) if (Math.abs(tij[i] - t) < Math.abs(tij[best] - t)) best = i;
    return best;
  }

  function k0(c) { return LN2 / casus(c).Thalf; }

  // Eliminatieconstante op t: k × product van de klaringsfactoren die op t gelden.
  function kOp(c, t) {
    c = casus(c);
    var k = k0(c);
    for (var i = 0; i < c.gebeurtenissen.length; i++) {
      var g = c.gebeurtenissen[i];
      if (g.type === 'klaring' && t >= g.t && (g.tot == null || t < g.tot)) k *= g.factor;
    }
    return k;
  }

  // Tijdstippen waarop k verandert (voor het splitsen van stappen).
  function kGrenzen(c) {
    var r = [];
    casus(c).gebeurtenissen.forEach(function (g) {
      if (g.type === 'klaring') { r.push(g.t); if (g.tot != null) r.push(g.tot); }
    });
    return r.sort(function (a, b) { return a - b; });
  }

  function geblokkeerd(c, route, t) {
    var gs = casus(c).gebeurtenissen;
    for (var i = 0; i < gs.length; i++) {
      var g = gs[i];
      if (g.type === 'blokkade' && g.routes.indexOf(route) >= 0 && t >= g.van - EPS_T && t < g.tot - EPS_T) return g;
    }
    return null;
  }

  // ---------------------------------------------------------------------------------------------
  // Kern: exacte oplossing over een interval h met constante k.
  //   A(h) = A·e^(−ka·h)
  //   C(h) = C·e^(−k·h) + A·ka/(Vd·(ka−k))·(e^(−k·h) − e^(−ka·h))       (ka ≠ k)
  //   C(h) = C·e^(−k·h) + A·k·h·e^(−k·h)/Vd                               (ka = k, limiet)
  // depots: [{A, ka}] (A = reeds met F vermenigvuldigde hoeveelheid). Muteert de depots, geeft C terug.
  // ---------------------------------------------------------------------------------------------
  function stapExact(C, depots, Vd, k, h) {
    if (h <= 0) return C;
    var ek = Math.exp(-k * h);
    var Cn = C * ek;
    for (var i = 0; i < depots.length; i++) {
      var d = depots[i];
      if (d.A === 0) continue;
      var eka = Math.exp(-d.ka * h);
      var diff = d.ka - k;
      if (Math.abs(diff) < 1e-9 * Math.max(d.ka, k)) Cn += d.A * k * h * ek / Vd;
      else Cn += d.A * d.ka / (Vd * diff) * (ek - eka);
      d.A *= eka;
    }
    return Cn;
  }

  // Steady state bij herhaald slikken (dosis D elke tau), dalspiegel vlak vóór een dosis.
  // Volledig uit de kern: de afbeelding over één interval is lineair,
  //   A_volgend = (A + F·D)·a ;  C_volgend = C·b + (A + F·D)·g
  // met a, b, g bepaald door stapExact op eenheidstoestanden. Vast punt:
  //   A* = F·D·a/(1−a) ;  C* = (A* + F·D)·g/(1−b).
  function steadyState(c, opties) {
    c = casus(c);
    opties = opties || {};
    var r = c.routes.slik, tau = opties.tau || c.start.interval, D = opties.dosis || c.start.dosis;
    var k = k0(c), FD = r.F * D;
    var d1 = [{ A: 1, ka: r.ka }];
    var g = stapExact(0, d1, c.Vd, k, tau), a = d1[0].A;
    var b = stapExact(1, [], c.Vd, k, tau);
    var A = FD * a / (1 - a);
    var C = (A + FD) * g / (1 - b);
    // min/max over één interval in steady state (fijn bemonsterd met dezelfde kern)
    var Cc = C, dep = [{ A: A + FD, ka: r.ka }], mn = C, mx = C, n = 1600, h = tau / n;
    for (var i = 0; i < n; i++) {
      Cc = stapExact(Cc, dep, c.Vd, k, h);
      if (Cc < mn) mn = Cc;
      if (Cc > mx) mx = Cc;
    }
    return { C: C, depot: A, ka: r.ka, tau: tau, min: mn, max: mx, naInterval: Cc };
  }

  // ---------------------------------------------------------------------------------------------
  // (a) Incrementele simulatie voor de UI.
  // ---------------------------------------------------------------------------------------------
  function maakSim(c, opties) {
    c = casus(c);
    opties = opties || {};
    var blokkades = opties.blokkades !== false;
    var grenzen = kGrenzen(c);
    var sim = {
      casus: c,
      t: opties.t0 || 0,
      C: 0,
      depots: [],
      log: [],
      get depot() { var s = 0; for (var i = 0; i < this.depots.length; i++) s += this.depots[i].A; return s; },
      get kNu() { return kOp(c, this.t); }
    };
    if (c.start && c.start.type === 'steadyState' && opties.steadyState !== false) {
      var ss = steadyState(c);
      sim.C = ss.C;
      sim.depots.push({ A: ss.depot, ka: ss.ka });
    }

    sim.stap = function (dt) {
      var eind = sim.t + dt;
      while (sim.t < eind - 1e-12) {
        var tot = eind;
        for (var i = 0; i < grenzen.length; i++) if (grenzen[i] > sim.t + 1e-12 && grenzen[i] < tot) tot = grenzen[i];
        sim.C = stapExact(sim.C, sim.depots, c.Vd, kOp(c, sim.t + 1e-12), tot - sim.t);
        sim.t = tot;
      }
      sim.t = eind;
      return sim.C;
    };
    sim.naar = function (t) { if (t > sim.t) sim.stap(t - sim.t); return sim.C; };
    sim.venster = function () { return venster(c, sim.t); };

    sim.geef = function (route, o) {
      o = o || {};
      var aantal = o.aantal == null ? 1 : o.aantal;
      var r = c.routes[route];
      var res = { ok: false, route: route, t: sim.t, aantal: aantal };
      if (!r) { res.reden = 'onbekend'; return res; }
      if (r.doetNiets) { res.reden = 'geenPrik'; res.tekst = r.tekst; sim.log.push(res); return res; }
      var b = blokkades && geblokkeerd(c, route, sim.t);
      if (b) { res.reden = 'geblokkeerd'; res.tekst = b.tekst; res.gebeurtenis = b; sim.log.push(res); return res; }
      var D = r.dosis * aantal, F, ka;
      if (route === 'spuit') {
        F = 1; ka = null;
        sim.C += D / c.Vd;
      } else {
        if (route === 'zetpil') {
          var z = (o.F != null && o.ka != null) ? { F: o.F, ka: o.ka }
            : zetpil(o.index != null ? o.index : poortjeIndex(c, sim.t));
          F = z.F; ka = z.ka;
        } else { F = o.F != null ? o.F : r.F; ka = o.ka != null ? o.ka : r.ka; }
        var dep = null;
        for (var i = 0; i < sim.depots.length; i++) if (sim.depots[i].ka === ka) dep = sim.depots[i];
        if (!dep) { dep = { A: 0, ka: ka }; sim.depots.push(dep); }
        dep.A += F * D;
      }
      res.ok = true; res.dosis = D; res.F = F; res.ka = ka;
      sim.log.push(res);
      return res;
    };

    // Som van de nominale doses in (t−24, t].
    sim.dagteller = function (t) {
      if (t == null) t = sim.t;
      var s = 0;
      for (var i = 0; i < sim.log.length; i++) {
        var l = sim.log[i];
        if (l.ok && l.t > t - 24 - 1e-9 && l.t <= t + 1e-9) s += l.dosis;
      }
      return s;
    };
    return sim;
  }

  // ---------------------------------------------------------------------------------------------
  // (b) Batch: volledig schema over de racelengte.
  // ---------------------------------------------------------------------------------------------
  function simuleer(c, schema, opties) {
    c = casus(c);
    opties = opties || {};
    var dt = opties.dt || 0.005;
    var duur = opties.duur != null ? opties.duur : c.raceDuur;
    var sim = maakSim(c, opties);
    var lijst = (schema || []).slice().sort(function (a, b) { return a.t - b.t; });
    var n = Math.round(duur / dt);
    var ts = new Array(n + 1), Cs = new Array(n + 1);
    var j = 0, tox = c.toxisch;
    var uIn = 0, uOnder = 0, uBoven = 0, uTox = 0, piek = -Infinity, tPiek = 0;
    var ldMin = Infinity, ldMax = -Infinity;
    for (var i = 0; i <= n; i++) {
      var t = i * dt;
      sim.naar(t);
      while (j < lijst.length && lijst[j].t <= t + 1e-9) {
        var s = lijst[j++];
        sim.geef(s.route, s);
      }
      var C = sim.C;
      ts[i] = t; Cs[i] = C;
      if (C > piek) { piek = C; tPiek = t; }
      if (t >= duur - 24 - 1e-9) { if (C < ldMin) ldMin = C; if (C > ldMax) ldMax = C; }
      if (i < n) {
        var v = venster(c, t);
        if (C < v.laag) uOnder += dt;
        else if (C > v.hoog) uBoven += dt;
        else uIn += dt;
        if (tox != null && C > tox) uTox += dt;
      }
    }
    var tot = 0, aantal = 0, tabletten = 0, max24 = 0;
    sim.log.forEach(function (l) {
      if (!l.ok) return;
      tot += l.dosis; aantal++; tabletten += l.aantal;
      var d = sim.dagteller(l.t);
      if (d > max24) max24 = d;
    });
    var bg = c.bovengrens;
    return {
      t: ts, C: Cs, log: sim.log,
      samenvatting: {
        duur: duur,
        urenInZone: uIn, urenOnder: uOnder, urenBoven: uBoven, urenToxisch: uTox,
        fractieInZone: uIn / duur, fractieOnder: uOnder / duur, fractieBoven: uBoven / duur, fractieToxisch: uTox / duur,
        piek: piek, tPiek: tPiek,
        totaleDosis: tot, aantalToedieningen: aantal, aantalTabletten: tabletten,
        max24u: max24,
        lever: bg && bg.type === 'dagteller' ? max24 > bg.maxPer24u : false,
        laatsteDag: { min: ldMin, max: ldMax }
      }
    };
  }

  var analytisch = {
    iv: function (D, Vd, k, t) { return D / Vd * Math.exp(-k * t); },
    oraal: function (F, D, ka, Vd, k, t) {
      return F * D * ka / (Vd * (ka - k)) * (Math.exp(-k * t) - Math.exp(-ka * t));
    }
  };

  return {
    versie: '1.0',
    CASUSSEN: CASUSSEN,
    ZETPIL_REEKS: ZETPIL_REEKS,
    casus: casus,
    venster: venster,
    poortjes: poortjes,
    poortjeIndex: poortjeIndex,
    zetpil: zetpil,
    k: kOp,
    geblokkeerd: geblokkeerd,
    steadyState: steadyState,
    stapExact: stapExact,
    maakSim: maakSim,
    simuleer: simuleer,
    analytisch: analytisch
  };
});

</script>
<script data-bron="src/score.js">
/*
 * Slikken of Stikken — src/score.js  (QALY-punten + eindverslaggegevens, §3 van docs/bouwopdracht.md)
 * Puur JS, geen DOM. Browser: laad ná model.js; <script src="score.js"> zet alleen window.SoS.score.
 * Node: const S = require('./src/score.js')  (haalt zelf ./model.js op).
 *
 * DE FORMULE (spelpunten, geen echte QALY's)
 * ------------------------------------------
 * Per modeltijdstap dt (vast raster t_i = i·dt, dt = 0,005 u; nooit per frame) met C = spiegel op t_i
 * (ná een toediening op t_i), venster [laag, hoog] op t_i en racelengte T (uur):
 *   in de zone (laag ≤ C ≤ hoog):  +ZONE / T · dt                       ZONE   = 1000
 *   te laag    (C < laag):         −LAAG / T · d² · dt,  d = (laag − C) / laag     LAAG = 1000
 *   te hoog    (C > hoog):         −HOOG / T · d² · dt,  d = (C − hoog) / hoog     HOOG = 1000
 *   giftig     (C > casus.toxisch, alleen lithium > 1,5): extra −GIFTIG / T · dt   GIFTIG = 2000
 *   lever      (paracetamol, dagteller boven 4 g per 24 uur): eenmalig −LEVER_SCHADE (1000) op het moment dat
 *              de dagteller voor het eerst boven 4 g komt ("levermeter vol"), plus −LEVER_PER_GRAM (250) voor elke
 *              gram boven 4 g, meteen bij die toediening; in de opbouwregel "lever / giftig".
 *              Waarom zo zwaar: de beste denkbare >4 g-race haalt hooguit +1000 (hele race in de zone) en krijgt
 *              minstens −1250, dus ≤ −250: altijd lager dan "gemiste dosis" (418). Leverschade kost in één klap
 *              een hele race aan punten. De race gaat door (geen einde race): de speler ziet de misselijkheid en
 *              zijn curve nog, en elke extra gram blijft even duur (geen "nu maakt het niet meer uit").
 * Dus: hele race in de zone = +1000 per race, ongeacht of de race 24 uur of 10 dagen duurt. Afstand buiten
 * de zone is relatief t.o.v. de zonegrens, zodat paracetamol (mg/L) en lithium (mmol/L) dezelfde schaal
 * hebben. Paracetamol heeft geen concentratie-bovengrens (hoog = ∞): "te hoog" blijft 0, de lever loopt via

        zin: 'Jij gaf ' + getal(telling.dagteller.hoogste) + ' g in 24 uur, meer dan de ' + getal(telling.dagteller.max) +

            'Een vast schema op vaste tijden houdt de spiegel boven de streep.' };

          'geen goed idee.' };
      return { regel: 'naIbuTeHoog',
        zin: 'Jij gaf na de ibuprofen gewoon alle doses en de spiegel kroop boven de 1,0, want de nieren ruimden ' +

    versie: '1.0',
    PUNTEN: PUNTEN,
    UITLEG: UITLEG,
    REGELS: REGELS,
    tempo: tempo,
    maakTeller: maakTeller,
    maakRace: maakRace,
    scoreSchema: scoreSchema,
    verslag: verslag
  };
});

      tone(E, { type: 'sine', f0: 1480, f1: 1250, dur: 0.05, gain: 0.08, a: 0.001 });
      noise(E, { dur: 0.015, gain: 0.16, a: 0.001, filter: ['bandpass', 2000, 1.5] });
    },
    klaar: function (E) {
      var f = [523.25, 659.25, 783.99, 1046.5];
      for (var i = 0; i < 4; i++) {
        var last = i === 3;
        tone(E, { type: 'triangle', f0: f[i], at: i * 0.075, dur: last ? 0.16 : 0.07, gain: 0.19 });
        tone(E, { type: 'sine', f0: f[i] / 2, at: i * 0.075, dur: last ? 0.16 : 0.07, gain: 0.06 });
      }
    }

  var NAMES = Object.keys(SOUNDS);

  // ---------- context en ontgrendeling ----------
  function resume() {

        var p = ctx.resume();
        if (p && p.then) p.then(null, function () {});
      }
    } catch (e) { /* stil */ }
  }

  function unlock() {
    if (!Ctor) return false;
    // Zonder activerend gebaar (veeg, Shift, Escape) niets aanmaken of
    // hervatten: Chromium zou dan in de console waarschuwen.
    if (!canActivate()) return !!ctx;
    try {
      if (!ctx) {
        try { ctx = new Ctor({ latencyHint: 'interactive' }); }
        catch (e1) { ctx = new Ctor(); }
        master = makeMaster(ctx, muted ? 0 : MASTER);
        noiseBuf = makeNoise(ctx);
        // stille buffer: ontgrendelt oudere iOS Safari
        var s = ctx.createBufferSource();
        s.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
        s.connect(ctx.destination);
        s.start(0);
      }
      resume();
      return true;
    } catch (e) {
      ctx = null; master = null;
      return false;
    }
  }

  function gesture(ev) {
    if (ev && ev.type === 'keydown' && !activatingKey(ev)) return;
    unlock();

  }
  // Toetsen die geen gebruikersactivering geven (HTML-spec: Escape, modifiers).
  var DEAD_KEYS = { Escape: 1, Shift: 1, Control: 1, Alt: 1, Meta: 1, AltGraph: 1,
    CapsLock: 1, Fn: 1, FnLock: 1, Hyper: 1, NumLock: 1, ScrollLock: 1, Super: 1, Symbol: 1, SymbolLock: 1 };
  function activatingKey(ev) {
    return !DEAD_KEYS[ev.key] && !ev.ctrlKey && !ev.metaKey && !ev.altKey;
  }
  // Geen pointerdown: een aanraking die een veeg wordt, activeert niets.
  var EVENTS = ['click', 'touchend', 'pointerup', 'keydown'];
  function attach() {
    try {
      for (var i = 0; i < EVENTS.length; i++) {
        root.addEventListener(EVENTS[i], gesture, { capture: true, passive: true });

    } catch (e) { /* stil */ }
  }
  function detach() {
    try {
      for (var i = 0; i < EVENTS.length; i++) {
        root.removeEventListener(EVENTS[i], gesture, { capture: true });
      }
    } catch (e) { /* stil */ }
    // na een onderbreking (iOS: telefoon, ander tabblad) opnieuw ontgrendelen
    if (!attach.vis) {
      attach.vis = true;
      try {
        root.document.addEventListener('visibilitychange', function () {
          if (!root.document.hidden && ctx && ctx.state !== 'running') attach();
        });
      } catch (e) { /* stil */ }
    }
  }
  if (Ctor) attach();

  // true = zeker binnen een activerend gebaar
  function inGesture() {
    try {
      var ua = root.navigator && root.navigator.userActivation;
      return !!(ua && ua.isActive);
    } catch (e) { return false; }
  }
  // false alleen als de browser zeker weet dat er geen activering is;
  // zonder userActivation-API (oudere Safari) proberen we het gewoon.
  function canActivate() {
    try {
      var ua = root.navigator && root.navigator.userActivation;
      return ua ? !!ua.isActive : true;
    } catch (e) { return true; }
  }

  // ---------- stemmen beperken ----------
  function prune(now) {
    for (var i = voices.length - 1; i >= 0; i--) {
      if (voices[i].end <= now) {
        try { voices[i].g.disconnect(); } catch (e) { /* al los */ }
        voices.splice(i, 1);
      }
    }
  }
  function steal(v, now) {
    try {
      v.g.gain.cancelScheduledValues(now);
      v.g.gain.setValueAtTime(v.g.gain.value, now);
      v.g.gain.linearRampToValueAtTime(0, now + 0.01);
      for (var i = 0; i < v.src.length; i++) {
        try { v.src[i].stop(now + 0.015); } catch (e) { /* al gestopt */ }
      }

    v.end = now + 0.02;
  }

  function play(name) {
    try {
      var build = Object.prototype.hasOwnProperty.call(SOUNDS, name) && SOUNDS[name];
      if (!build || muted || !Ctor) return false;
      if (!ctx) {
        if (!inGesture()) return false; // nooit een context buiten een tik
        if (!unlock()) return false;
      }
      if (ctx.state !== 'running') {
        // gepauzeerde context: alleen hervatten binnen een gebaar, anders
        // stil overslaan (geen waarschuwing, geen opgestapelde wachtrij)
        if (!canActivate()) return false;
        resume();
