/*
 * Slikken of Stikken — src/style.css (gedeelde stijl + start/intro/race)
 *
 * GEDEELD (voor tutorial.css / einde.css hergebruiken, niet opnieuw definiëren):
 *   Kleuren:  --zwart --wit --inkt (zwarte schetslijn) --grijs --paars (tijdmarkering)
 *             --groen (zone) --koraal (te laag/fout) --geel --blauw (hoedje opa Jan)
 *             --rood (hoedje mevrouw De Vries) --roze
 *   Letters:  --font (systeemletter), --font-rond (afgerond, EoT-gevoel)
 *   Schermen: <section class="scherm wit|zwart"> vult het hele scherm, met safe-area-padding;
 *             alleen het scherm met .actief is zichtbaar (app.js regelt dat).
 *   Knoppen:  .knop-wit (EoT: wit, dikke zwarte rand, "drukbaar"), .knop-paars (race-stijl),
 *             .groot = breed en hoog. Alle knoppen ≥ 48×48 px.
 *   Figuren:  .fig met een SVG van SoS.ui.figuur(); .fig.wiebel = korte reactie bij aanraken.
 */
:root {
  --zwart: #000;
  --wit: #fff;
  --inkt: #1b1b1f;
  --grijs: #8a8a93;
  --papier: #fbfaf7;
  --paars: #b07cff;
  --paars-diep: #8a55f0;
  --groen: #3ddc97;
  --koraal: #ff6f61;
  --geel: #ffd166;
  --blauw: #3d7fe0;
  --rood: #e0405f;
  --roze: #ff8fb8;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-rond: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --veilig-boven: env(safe-area-inset-top, 0px);
  --veilig-onder: env(safe-area-inset-bottom, 0px);
  --veilig-links: env(safe-area-inset-left, 0px);
  --veilig-rechts: env(safe-area-inset-right, 0px);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  background: var(--zwart);
  color: var(--wit);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}
body { position: fixed; inset: 0; }
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer; }
input { font: inherit; }
[hidden] { display: none !important; }

#app { position: absolute; inset: 0; overflow: hidden; }

/* ---------- schermen ---------- */
.scherm {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  padding: calc(var(--veilig-boven) + 12px) calc(var(--veilig-rechts) + 16px) calc(var(--veilig-onder) + 12px) calc(var(--veilig-links) + 16px);
  opacity: 0; visibility: hidden;
  transition: opacity .35s ease, visibility 0s linear .35s;
  overflow-x: hidden; overflow-y: auto;
}
.scherm.actief { opacity: 1; visibility: visible; transition: opacity .35s ease, visibility 0s; }
.scherm.wit { background: var(--papier); color: var(--inkt); font-family: var(--font-rond); }
.scherm.zwart { background: var(--zwart); color: var(--wit); }

/* ---------- knoppen ---------- */
.knop-wit {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 56px; min-width: 48px; padding: 10px 26px;
  background: var(--wit); color: var(--inkt);
  border: 3px solid var(--inkt); border-radius: 18px;
  box-shadow: 0 5px 0 var(--inkt);
  font-family: var(--font-rond); font-size: 21px; font-weight: 700; letter-spacing: .01em;
  transition: transform .08s ease, box-shadow .08s ease, background .15s;
}
.knop-wit:active, .knop-wit.ingedrukt { transform: translateY(4px); box-shadow: 0 1px 0 var(--inkt); }
.knop-wit:focus-visible, .knop-paars:focus-visible, .actie:focus-visible { outline: 3px solid var(--paars); outline-offset: 3px; }
.knop-wit.groot { width: 100%; max-width: 340px; min-height: 60px; font-size: 22px; }

.knop-paars {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 56px; min-width: 160px; padding: 10px 28px;
  background: var(--paars-diep); color: var(--wit);
  border: 0; border-radius: 999px;
  font-size: 20px; font-weight: 700;
  box-shadow: 0 0 0 4px rgba(176, 124, 255, .25), 0 8px 30px rgba(138, 85, 240, .45);
  transition: transform .1s ease;
}
.knop-paars:active { transform: scale(.96); }

/* ---------- dempknop (altijd bereikbaar) ---------- */
.demp {
  position: fixed; z-index: 50;
  top: calc(var(--veilig-boven) + 6px); right: calc(var(--veilig-rechts) + 6px);
  width: 48px; height: 48px; padding: 0;
  display: grid; place-items: center;
  border: 0; border-radius: 50%;
  background: transparent; color: var(--grijs);
}
.demp svg { width: 26px; height: 26px; }
body.licht .demp { color: #6b6b73; }
body.donker .demp { color: rgba(255, 255, 255, .7); }
.demp[aria-pressed="true"] { color: var(--koraal) !important; }

/* ---------- figuurtjes ---------- */
.fig { display: inline-block; line-height: 0; transform-origin: 50% 100%; }
.fig svg { display: block; width: 100%; height: auto; overflow: visible; }
.fig.wiebel { animation: wiebel .45s ease; }
@keyframes wiebel { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg) translateY(-4px); } 60% { transform: rotate(5deg); } }

/* ---------- start ---------- */
.start-binnen {
  margin: auto; width: 100%; max-width: 420px;
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: 8px 0;
}
.start-figuren { display: flex; gap: 22px; align-items: flex-end; justify-content: center; margin-bottom: 4px; }
.start-figuren .fig { width: 92px; }
.titel { margin: 6px 0 4px; font-size: clamp(34px, 11vw, 46px); line-height: 1.02; font-weight: 800; letter-spacing: -.01em; }
.titel span { font-weight: 500; font-size: .62em; color: var(--grijs); }
.ondertitel { margin: 6px 0 22px; font-size: 18px; line-height: 1.35; color: #45454c; max-width: 300px; }
.start-form { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.label { font-size: 15px; color: #55555c; }
#naam {
  width: 100%; max-width: 340px; min-height: 56px;
  padding: 12px 16px; text-align: center;
  font-size: 20px; /* ≥ 16px: geen zoom in iOS */
  color: var(--inkt); background: var(--wit);
  border: 3px solid var(--inkt); border-radius: 16px; outline: none;
}
#naam:focus { border-color: var(--paars-diep); box-shadow: 0 0 0 4px rgba(176, 124, 255, .25); }
.kleintje { margin: 22px 0 0; font-size: 13px; color: #85858c; }

/* ---------- intro-kaartje ---------- */
.intro-binnen {
  margin: auto; width: 100%; max-width: 420px;
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: 6px 0;
}
.intro-kop { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--grijs); }
.intro-podium {
  position: relative; width: 100%; max-width: 320px; height: 168px; margin: 10px 0 4px;
  display: flex; align-items: flex-end; justify-content: center;
  border-bottom: 3px solid var(--inkt);
}
.intro-podium .fig { width: 112px; margin-bottom: -3px; cursor: pointer; }
.intro-podium .wolk {
  position: absolute; left: 50%; top: 4px; transform: translateX(10px);
  font-size: 14px; color: #77777e; font-style: italic;
}
.intro-verhaal { margin: 14px 0 8px; font-size: 19px; line-height: 1.4; font-weight: 600; max-width: 360px; }
.intro-regel { margin: 0 0 10px; font-size: 16px; line-height: 1.4; color: #3c3c43; max-width: 340px; }
.intro-qaly { margin: 0 0 18px; font-size: 14.5px; line-height: 1.4; color: #6a6a72; max-width: 340px; }
.intro-qaly:empty { display: none; }

/* ---------- race ---------- */
#scherm-race { padding: 0; overflow: hidden; font-family: var(--font); }
.race-kop {
  flex: none;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(var(--veilig-boven) + 8px) calc(var(--veilig-rechts) + 62px) 2px calc(var(--veilig-links) + 16px);
  min-height: calc(var(--veilig-boven) + 56px);
}
.klok { font-size: 26px; font-weight: 800; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.klok small { font-size: 17px; font-weight: 600; color: rgba(255, 255, 255, .65); margin-left: 4px; }
.qaly { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
.qaly-label { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: rgba(255, 255, 255, .55); }
.qaly-getal { font-size: 26px; font-weight: 800; min-width: 3ch; text-align: right; transition: color .3s; }
.qaly.negatief .qaly-getal { color: var(--koraal); }
.qaly-trend { width: 14px; font-size: 14px; line-height: 1; align-self: center; }
.qaly.plus .qaly-trend { color: var(--groen); }
.qaly.min .qaly-trend { color: var(--koraal); }

.race-rij {
  flex: none; min-height: 34px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 0 calc(var(--veilig-rechts) + 16px) 4px calc(var(--veilig-links) + 16px);
  font-size: 14px; color: rgba(255, 255, 255, .78);
}
.lever { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.lever-icoon { width: 22px; height: 17px; color: #c9785b; flex: none; }
.lever-tekst { font-variant-numeric: tabular-nums; }
.lever-meter { position: relative; width: 70px; height: 10px; border-radius: 6px; background: rgba(255, 255, 255, .14); overflow: hidden; flex: none; }
.lever-vul { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--geel); border-radius: 6px; transition: width .3s ease, background .3s; }
.lever-max { position: absolute; top: 0; bottom: 0; left: 80%; width: 2px; background: rgba(255, 255, 255, .7); }
.lever.vol .lever-vul { background: var(--koraal); }
.lever.vol { color: var(--koraal); animation: knipper 1s ease 3; }
.lever.vol .lever-icoon { color: var(--koraal); }
@keyframes knipper { 50% { opacity: .35; } }
.patient { display: flex; align-items: center; gap: 8px; margin-left: auto; white-space: nowrap; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
  font-size: 12.5px; font-weight: 700; background: rgba(255, 159, 67, .18); color: #ffb067;
  animation: inploppen .4s ease;
}
@keyframes inploppen { from { transform: scale(.5); opacity: 0; } }

.podium { position: relative; flex: 1 1 auto; min-height: 0; }
#doek { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.melding {
  position: absolute; left: 50%; bottom: 7%;
  width: min(92%, 380px); transform: translate(-50%, 8px);
  text-align: center; font-size: 19px; line-height: 1.35; font-weight: 600;
  color: var(--wit); text-shadow: 0 1px 12px #000, 0 0 3px #000;
  opacity: 0; transition: opacity .25s ease, transform .25s ease;
  pointer-events: none;
  padding: 10px 12px; border-radius: 16px;
  background: radial-gradient(ellipse at center, rgba(0, 0, 0, .92) 45%, rgba(0, 0, 0, 0) 72%);
}
.melding.zicht { opacity: 1; transform: translate(-50%, 0); }
.melding.wending { font-size: 21px; }
.melding .m-fig { width: 64px; margin: 0 auto 6px; }
.melding .m-fig svg { width: 100%; height: auto; }
.melding.au { color: #ffd2cc; }
.melding.alarm { color: #ffc2b8; }
.melding.grap { color: #e5d4ff; }

.finish {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  background: rgba(0, 0, 0, .62);
  animation: infaden .5s ease;
  text-align: center;
}
@keyframes infaden { from { opacity: 0; } }
.finish-kop { margin: 0 0 8px; font-size: 16px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--paars); }
.finish-label { margin: 0; font-size: 15px; color: rgba(255, 255, 255, .7); }
.finish-getal { margin: 0 0 22px; font-size: 64px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }

/* knoppen onderin */
.knoppen {
  flex: none;
  display: flex; gap: 8px;
  padding: 8px calc(var(--veilig-rechts) + 12px) calc(var(--veilig-onder) + 12px) calc(var(--veilig-links) + 12px);
  background: linear-gradient(to bottom, rgba(0, 0, 0, 0), #000 30%);
}
.actie {
  position: relative; flex: 1 1 0; min-width: 48px; min-height: 76px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  padding: 6px 2px;
  background: #121219; color: var(--wit);
  border: 2px solid rgba(255, 255, 255, .16); border-radius: 18px;
  font-size: 14px; font-weight: 600;
  transition: transform .09s ease, background .15s, border-color .15s, opacity .2s;
}
.actie svg { width: 34px; height: 34px; pointer-events: none; }
.actie span { pointer-events: none; }
.actie:active, .actie.tik { transform: scale(.92); }
.actie.gekozen {
  background: rgba(176, 124, 255, .26); border-color: var(--paars);
  box-shadow: 0 0 0 3px rgba(176, 124, 255, .22), 0 0 22px rgba(176, 124, 255, .45);
}
.actie.gekozen::after {
  content: attr(data-badge);
  position: absolute; top: -9px; right: -4px;
  min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px;
  display: grid; place-items: center;
  background: var(--paars); color: #120a20; font-size: 12.5px; font-weight: 800;
}
.actie.geblokkeerd { opacity: .55; border-style: dashed; border-color: rgba(255, 255, 255, .3); background: #0b0b10; }
.actie.geblokkeerd svg { filter: grayscale(1); opacity: .6; }
.actie.geblokkeerd::before {
  content: ""; position: absolute; left: 14%; right: 14%; top: 50%; height: 3px; margin-top: -14px;
  background: var(--koraal); transform: rotate(-24deg); border-radius: 2px;
}
.actie.schud { animation: schud .35s ease; }
@keyframes schud { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

@media (min-height: 760px) {
  .actie { min-height: 84px; font-size: 15px; }
  .melding { font-size: 20px; }
}
@media (min-width: 700px) {
  #scherm-race .race-kop, #scherm-race .race-rij, #scherm-race .knoppen { padding-left: max(16px, calc(50% - 260px)); padding-right: max(62px, calc(50% - 260px)); }
}
@media (prefers-reduced-motion: reduce) {
  .scherm, .melding, .lever-vul { transition: none; }
  .fig.wiebel, .actie.schud, .lever.vol { animation: none; }
}

</style>
<style data-bron="src/tutorial.css">
/* Slikken of Stikken — src/tutorial.css. Prefix .tut- ; gedeelde stijl (kleuren, .knop-wit, .actie, .fig) staat in style.css. */
.tut-binnen {
  width: 100%; max-width: 440px; min-height: 100%; margin: 0 auto;
  display: flex; flex-direction: column; align-items: stretch; text-align: center;
}

/* bovenrand: overslaan · stippen · (ruimte voor dempknop) */
.tut-top { flex: none; display: grid; grid-template-columns: 96px 1fr 96px; align-items: center; min-height: 44px; margin-top: -6px; }
.tut-over {
  justify-self: start; min-height: 48px; min-width: 48px; padding: 0 8px 0 0;
  background: none; border: 0; color: #8a8a93; font-family: var(--font-rond); font-size: 15px;
  text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px;
}
.tut-stippen { display: flex; justify-content: center; gap: 8px; }
.tut-stippen span { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--inkt); background: transparent; transition: background .2s, transform .2s; }
.tut-stippen span.af { background: var(--inkt); }
.tut-stippen span.nu { background: var(--paars); transform: scale(1.25); }

/* podium: opa Jan (en levertje) op een getekende grondlijn */
.tut-podium {
  position: relative; flex: none; height: 138px; width: 100%; max-width: 320px; margin: 2px auto 0;
  display: flex; align-items: flex-end; justify-content: center; gap: 34px;
  border-bottom: 3px solid var(--inkt);
}
.tut-opa { position: relative; width: 84px; margin-bottom: -3px; }
.tut-opa .fig { width: 100%; cursor: pointer; touch-action: manipulation; }
.tut-maag {
  position: absolute; left: 50%; top: 75%; width: 30px; height: 30px; pointer-events: none;
  transform: translate(-50%, -50%) scale(.35); opacity: 0; transition: opacity .25s;
  filter: drop-shadow(0 0 1.5px rgba(0, 0, 0, .55));
}
.tut-maag svg { width: 100%; height: 100%; display: block; }
.tut-naamje {
  position: absolute; right: calc(100% + 2px); top: 34px; white-space: nowrap;
  font-size: 13px; color: #8a8a93; pointer-events: none;
}
.tut-naamje::after { content: "↘"; margin-left: 2px; }
.tut-ballon {
  position: absolute; left: 78%; top: -4px; padding: 3px 10px; white-space: nowrap;
  background: #fff; border: 2.5px solid var(--inkt); border-radius: 14px 14px 14px 3px;
  font-size: 16px; font-weight: 800; color: var(--inkt);
  opacity: 0; transform: translateY(6px) scale(.8); transform-origin: 0 100%;
  transition: opacity .18s ease, transform .18s ease; pointer-events: none;
}
.tut-ballon.zicht { opacity: 1; transform: none; }

.tut-lever { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 8px; }
.tut-lever .fig { width: 70px; cursor: pointer; touch-action: manipulation; }
.tut-meter { position: relative; width: 92px; height: 11px; border-radius: 6px; background: #e8e5de; border: 2px solid var(--inkt); overflow: hidden; }
.tut-meter-vul { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--geel); transition: width .3s ease, background .3s; }
.tut-meter-max { position: absolute; top: 0; bottom: 0; left: 80%; width: 2px; background: var(--inkt); }
.tut-meter-tekst { font-size: 13px; font-weight: 700; color: #45454c; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tut-lever.vol .tut-meter-vul { background: var(--koraal); }
.tut-lever.vol .tut-meter-tekst { color: #d2453a; }
.tut-lever.vol .tut-meter { animation: tut-knipper .5s ease 3; }
@keyframes tut-knipper { 50% { opacity: .35; } }

/* één zin */
.tut-tekst {
  flex: none; margin: 12px auto 4px; max-width: 360px; min-height: 3.9em;
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(18px, 5.2vw, 21px); line-height: 1.3; font-weight: 700; color: var(--inkt);
}
.tut-tekst.nieuw { animation: tut-in .35s ease; }
@keyframes tut-in { from { opacity: 0; transform: translateY(6px); } }

/* grafiek (SVG, uit het model) */
.tut-grafiek { flex: 1 1 190px; width: 100%; min-height: 176px; max-height: 270px; }
.tut-grafiek > svg { display: block; width: 100%; height: 100%; overflow: visible; font-family: var(--font); }
.tut-as { font-size: 12px; font-weight: 600; fill: #6a6a72; }
.tut-as-zone { fill: #1f9e68; font-weight: 800; }
.tut-zone { font-size: 11.5px; font-weight: 700; fill: #1f9e68; letter-spacing: .03em; }
.tut-eenheid { font-size: 11px; font-weight: 600; fill: #8a8a93; }
.tut-half { font-size: 17px; font-weight: 800; fill: #3d7fe0; }
.tut-klok { font-size: 13px; font-weight: 800; fill: var(--paars-diep); font-variant-numeric: tabular-nums; }
.tut-label { font-size: 12px; font-weight: 800; }

/* bediening: raceknop(pen) links, Verder rechts */
.tut-bediening {
  flex: none; margin-top: auto; padding-top: 12px; min-height: 96px;
  display: flex; align-items: center; justify-content: center; gap: 16px;
}
.tut-acties { display: flex; gap: 10px; }
.tut-actie { flex: none; width: 96px; min-height: 76px; }
.tut-actie:disabled { opacity: .35; cursor: default; }
.tut-actie.tut-wijs::before {
  content: ""; position: absolute; inset: -9px; border: 3px dashed var(--inkt); border-radius: 26px;
  animation: tut-puls 1.1s ease-in-out infinite; pointer-events: none;
}
@keyframes tut-puls { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.06); opacity: .45; } }
.tut-volgende {
  flex: 1 1 auto; max-width: 210px; min-height: 60px;
  visibility: hidden; opacity: 0; transform: translateY(6px);
  transition: opacity .2s ease, transform .2s ease, visibility 0s linear .2s;
}
.tut-volgende.zicht { visibility: visible; opacity: 1; transform: none; transition: opacity .2s ease, transform .2s ease, visibility 0s; }
.tut-volgende.zicht:active { transform: translateY(4px); }

/* slot: Klaar? Race! */
.tut-podium.slot { height: 190px; gap: 30px; margin-top: auto; }
.tut-podium.slot .tut-opa { width: 120px; }

<style data-bron="src/einde.css">

<div id="app">

  <!-- 1. Start: speelnaam + Start (EoT-stijl, wit) -->

    <div class="start-binnen">
      <div class="start-figuren" aria-hidden="true">
        <div class="fig" data-fig="opa"></div>

      <form id="start-form" class="start-form" autocomplete="off" novalidate>

  <!-- 3. Intro-kaartje per race (EoT-stijl) -->
  <section id="scherm-intro" class="scherm wit" data-scherm="intro">
    <div class="intro-binnen">

  <section id="scherm-race" class="scherm zwart" data-scherm="race">

<script data-bron="src/model.js">
/*
 * Slikken of Stikken — src/model.js  (rekenmodel §4 + casusdata §5 uit docs/bouwopdracht.md)
 * Puur JS, geen DOM. Browser: <script src="model.js"> zet alleen window.SoS.model.
 * Node: const M = require('./src/model.js').
 *
 * PUBLIEKE API (voor UI- en scorebouwers)
 * ---------------------------------------
 * M.CASUSSEN.paracetamol / M.CASUSSEN.lithium   Casusdata, letterlijk uit het casusblad (zie onder).
 * M.casus(id)                       -> casusobject (id 'paracetamol' | 'lithium', of een object zelf).
 * M.venster(casus, t)               -> {laag, hoog}: therapeutisch venster op tijdstip t (uur).
 *                                      Komt uit casus.venster (reeks [{vanaf, laag, hoog}], stapsgewijs);
 *                                      nu constant, later schuivend (opiaten). hoog = Infinity = geen bovengrens.
 * M.poortjes(casus)                 -> [tijden in uur] van de doseermomenten.
 * M.ZETPIL_REEKS                    -> vaste reeks [{F, ka}] (24 stuks, voor iedereen gelijk).
 * M.zetpil(i)                       -> {F, ka} voor poortje-index i (i modulo 24). Het spel gebruikt
 *                                      i = index van het poortje in de race (paracetamol: i = uur 0..23),
 *                                      dus dezelfde keuze op hetzelfde moment geeft iedereen hetzelfde.
 * M.k(casus, t)                     -> eliminatieconstante (/u) op tijdstip t, inclusief klaringgebeurtenissen.
 * M.steadyState(casus)              -> {C, depot, min, max, tau}: begintoestand lithium (dalspiegel vlak
 *                                      vóór een dosis), uit de modelkern berekend (vaste-puntoplossing).
 * M.geblokkeerd(casus, route, t)    -> null of de gebeurtenis die deze route op t blokkeert (van ≤ t < tot,
 *                                      met tolerantie 1e-9 u tegen zwevendekommaruis; ook in M.venster).
 *
 * (a) Incrementeel, voor de UI:
 *   const sim = M.maakSim('paracetamol', {blokkades: true});
 *   sim.geef('slik' | 'zetpil' | 'spuit', {aantal, F, ka, index})  -> {ok, reden?, tekst?, dosis, F, ka}
 *       slik/zetpil: dosis*F naar een eigen opnamedepot (eerste orde, ka); spuit: C += dosis/Vd.
 *       zetpil zonder F/ka: M.zetpil(index ?? huidig poortje-index).  aantal = aantal tabletten (dubbel = 2).
 *       Weigering (ok:false): reden 'geblokkeerd' (misselijkheid: slikken uur 10–16) of 'geenPrik'
 *       (lithium-spuitknop: casus.routes.spuit.tekst tonen, géén effect, geen strafpunten).
 *   sim.stap(dt)  (exact), sim.naar(t), sim.t, sim.C, sim.depot (som depots), sim.kNu,
 *   sim.venster() -> {laag,hoog} nu, sim.dagteller(t?) -> dosis in (t-24, t], sim.log (alle toedieningen).
 * (b) Batch:
 *   M.simuleer(casus, schema, {dt=0.005, blokkades=true, duur=casus.raceDuur})
 *       schema: [{t, route:'slik'|'zetpil'|'spuit', aantal?, F?, ka?}] (toedieningen op t; overslaan = weglaten)
 *       -> {t:[], C:[], log:[], samenvatting:{fractieInZone, fractieOnder, fractieBoven, fractieToxisch,
 *            urenInZone, urenOnder, urenBoven, urenToxisch, piek, tPiek, totaleDosis, aantalToedieningen,
 *            aantalTabletten, max24u, lever (bool, max24u > bovengrens), laatsteDag:{min,max}}}
 *   Beide ingangen delen dezelfde kern (stapExact): exacte exponentiële oplossing per depot, gesplitst
 *   op klaringsmomenten, dus geen integratiefout; dt bepaalt alleen de meetpunten.
 * M.analytisch.iv(D, Vd, k, t), M.analytisch.oraal(F, D, ka, Vd, k, t)  — formules §4 (voor tests).
 *
 * Eenheden: tijd in uur. Paracetamol: dosis mg, C mg/L. Lithium: dosis mmol Li⁺, C mmol/L.

    REGELS: REGELS,

    verslag: verslag

});

      s += '<text x="' + (Lp + pw - 4) + '" y="' + (Tp + 11) + '" text-anchor="end" class="tut-zone">pijnstilling</text>';
      // y-as
      s += '<text x="' + (Lp - 6) + '" y="' + (Tp - 9) + '" text-anchor="start" class="tut-eenheid">mg/L</text>';
      g.ticksY.forEach(function (c) {
        s += '<text x="' + (Lp - 7) + '" y="' + (Y(c) + 4.5) + '" text-anchor="end" class="' + (c === ZONE ? 'tut-as tut-as-zone' : 'tut-as') + '">' + tekenGetal(c) + '</text>';
        if (c !== ZONE) s += '<path d="M' + Lp + ' ' + Y(c) + 'h-4" stroke="' + INKT + '" stroke-width="2"/>';
      });
      // assen (schetslijn)
      s += '<path d="M' + Lp + ' ' + (Tp - 6) + 'V' + y0 + 'H' + (Lp + pw + 4) + '" stroke="' + INKT + '" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
      g.ticksX.forEach(function (t, i) {
        var lab = tekenGetal(t) + (i === g.ticksX.length - 1 ? ' u' : '');
        s += '<path d="M' + X(t) + ' ' + y0 + 'v5" stroke="' + INKT + '" stroke-width="2"/>';
        s += '<text x="' + X(t) + '" y="' + (H - 5) + '" text-anchor="middle" class="tut-as">' + lab + '</text>';
      });
      // ½-staafjes
      staven.forEach(function (b) {
        var x = Math.max(Lp + 7, X(b.t)), yb = Y(b.C);
        s += '<rect x="' + (x - 6) + '" y="' + yb + '" width="12" height="' + Math.max(0, y0 - yb) + '" rx="2" fill="#3d7fe0" fill-opacity=".3" stroke="#3d7fe0" stroke-width="2"/>';
        if (b.vorige) {
          var xv = Math.max(Lp + 7, X(b.vorige.t)), yh = Y(b.vorige.C / 2);
          s += '<path d="M' + (xv - 6) + ' ' + yh + 'H' + (x + 9) + '" stroke="#3d7fe0" stroke-width="2" stroke-dasharray="3 4"/>';
          s += '<text x="' + (x + 11) + '" y="' + (yh - 4) + '" class="tut-half">½</text>';
        }
      });
      // curves
      curves.forEach(function (c) {
        if (c.p.length < 2) return;
        var d = '';
        for (var i = 0; i < c.p.length; i++) {
          if (c.p[i][0] > g.T + 1e-9) break;
          d += (i ? 'L' : 'M') + X(c.p[i][0]).toFixed(1) + ' ' + Y(c.p[i][1]).toFixed(1);
        }
        var stijl = c.stijl === 'spook' ? 'stroke="#a9a9b2" stroke-width="3" stroke-dasharray="2 7"'
          : c.stijl === 'twee' ? 'stroke="#ff6f61" stroke-width="4"'
          : 'stroke="' + INKT + '" stroke-width="4"';
        s += '<path d="' + d + '" ' + stijl + ' fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
        if (c.label) {
          var piek = c.p[0];
          for (var j = 0; j < c.p.length; j++) if (c.p[j][1] > piek[1] && c.p[j][0] <= g.T) piek = c.p[j];
          var kleur = c.stijl === 'twee' ? '#ff6f61' : c.stijl === 'spook' ? '#8a8a93' : INKT;
          var lx = Math.min(Lp + pw - 12, X(piek[0]) + 4), ly = Y(piek[1]) - 9;
          s += '<circle cx="' + lx + '" cy="' + (ly - 4) + '" r="9" fill="#fff" stroke="' + kleur + '" stroke-width="2"/>';
          s += '<text x="' + lx + '" y="' + ly + '" text-anchor="middle" class="tut-label" fill="' + kleur + '">' + c.label + '</text>';
        }
      });
      // nu: lijn, stip en klok
      if (actief) {
        var tn = actief.sim.t, xn = X(Math.min(tn, g.T)), yn = Y(actief.sim.C);
        s += '<path d="M' + xn + ' ' + (Tp - 4) + 'V' + y0 + '" stroke="#b07cff" stroke-width="2"/>';
        s += '<circle cx="' + xn + '" cy="' + yn + '" r="5.5" fill="' + (actief.sim.C >= ZONE - 1e-9 ? '#3ddc97' : '#ff6f61') + '" stroke="' + INKT + '" stroke-width="2.5"/>';
        var kx = Math.max(Lp + 46, Math.min(Lp + pw - 22, xn));
        s += '<text x="' + kx + '" y="' + (Tp - 9) + '" text-anchor="middle" class="tut-klok">' + ui.getal(Math.floor(tn * 10 + 1e-6) / 10, (Math.floor(tn * 10 + 1e-6) % 10) ? 1 : 0) + ' u</text>';
      }
      // toedieningen onder de as
      var gezien = {};
      curves.forEach(function (c) {
        if (c.stijl === 'spook') return;
        c.doses.forEach(function (d) {
          var k = d.t.toFixed(2), n = gezien[k] = (gezien[k] || 0) + 1;
          var x = X(d.t) + (n - 1) * 24, y = y0 + 19;
          s += '<circle cx="' + x + '" cy="' + y + '" r="11" fill="' + (c.stijl === 'twee' ? '#ff6f61' : INKT) + '"/>';
          s += ui.icoon(d.route === 'slik' ? 'tablet' : d.route).replace('<svg ', '<svg x="' + (x - 9) + '" y="' + (y - 9) + '" width="18" height="18" ');
        });
      });
      s += '</svg>';
      graf.innerHTML = s;
    }

    // ------------------------------------------------------------------ knoppen
    function actieKnop(soort, label, icoonHtml) {
      var b = el('button', { type: 'button', class: 'actie tut-actie', 'data-tut': soort, 'aria-label': label });
      b.innerHTML = icoonHtml + '<span>' + label + '</span>';
      acties.appendChild(b);
      return b;
    }
    function wijs(b, aan) { b.classList.toggle('tut-wijs', !!aan); }
    function uit(b) { b.disabled = true; b.classList.remove('tut-wijs'); }
    function toonVolgende(aan) {
      volgende.classList.toggle('zicht', !!aan);
      volgende.disabled = !aan;
      if (aan) zetFase('klaar');
    }
    // Navigatie alleen op click (einde van de tik): anders landt de click van dezelfde tik op de
    // nieuwe knop die op die plek verschijnt.
    volgende.addEventListener('click', function () {
      if (volgende.disabled || gestopt) return;
      ui.speel('tik');
      naarStap(stap + 1);
    });
    over.addEventListener('click', function () { if (!gestopt) { ui.speel('tik'); meldGereed(); } });

    function meldGereed() {
      if (klaarGemeld) return;
      klaarGemeld = true;
      gereed();
    }

    // ------------------------------------------------------------------ stappen
    function nieuweGrafiek(o) {
      grafiek = o; curves = []; staven = []; actief = null;
    }
    function zetTekst(t) {
      tekst.textContent = t;
      flits(tekst, 'nieuw');
    }

    function naarStap(n) {
      stap = n;
      root.cancelAnimationFrame(raf); raf = 0;
      binnen.setAttribute('data-stap', String(n));
      var st = stippen.children;
      for (var i = 0; i < st.length; i++) st[i].className = i < n - 1 ? 'af' : i === n - 1 ? 'nu' : '';
      acties.innerHTML = '';
      toonVolgende(false);
      zetFase('wacht');
      leverWrap.hidden = !(n === 4 || n === 6);
      podium.classList.toggle('met-lever', !leverWrap.hidden);
      maag.style.opacity = '0';
      ({ 1: stap1, 2: stap2, 3: stap3, 4: stap4, 5: stap5, 6: stap6 })[n]();
      teken();
    }

    var tabletCurve = null;

    // 1. Opa Jan heeft pijn → tablet → curve stijgt pas na even.
    function stap1() {
      nieuweGrafiek({ T: 10, ymax: 12, ticksX: [0, 2.5, 5, 7.5, 10], ticksY: [5, 10], maag: true });
      tabletCurve = new Curve({ stijl: 'nu', dt: 0.02 });
      curves.push(tabletCurve); actief = tabletCurve;
      zetStemming('pijn', false);
      zetTekst('Opa Jan heeft pijn.');
      var b = actieKnop('slik', 'Tablet', ui.icoon('tablet'));
      wijs(b, true);
      bijTik(b, function () {
        if (b.disabled) return;
        uit(b); flits(b, 'tik');
        ui.speel('slik');
        tabletCurve.geef('slik');
        zetTekst('Een pil moet eerst door je maag.');
        bijwerken(false);
        loop(tabletCurve, 2, 0.85, function () { toonVolgende(true); });
      });
    }

    // 2. Curve zakt → elke 2,5 uur is de helft weg (½-staafjes op 5; 7,5; 10 u).
    function stap2() {
      grafiek.maag = true;
      actief = tabletCurve;
      zetTekst('Je lichaam ruimt het op: elke 2,5 uur is de helft weg.');
      tabletCurve.metingen = [2 * THALF];
      var b = actieKnop('klok', ui.getal(THALF, 1) + ' uur', KLOK_ICOON);
      b.disabled = true;
      var keer = 0;
      loop(tabletCurve, 2 * THALF, 1.5, function () { b.disabled = false; wijs(b, true); zetFase('wacht'); });
      bijTik(b, function () {
        if (b.disabled || fase === 'loopt') return;
        keer++;
        flits(b, 'tik'); ui.speel('tik');
        wijs(b, false);
        var doel = (2 + keer) * THALF;
        tabletCurve.metingen = [doel];
        if (keer >= 2) uit(b);
        loop(tabletCurve, doel, 1.6, function () { toonVolgende(true); });
      });
    }

    // 3. Spuit → meteen hoog, zakt net zo hard (½ per 2,5 uur); tabletcurve als schaduw.
    function stap3() {
      var schaduw = { sim: tabletCurve.sim, p: tabletCurve.p, stijl: 'spook', doses: [] };
      nieuweGrafiek({ T: 3 * THALF, ymax: 18, ticksX: [0, 2.5, 5, 7.5], ticksY: [5, 10, 15] });
      curves.push(schaduw);
      var c = new Curve({ stijl: 'nu', dt: 0.02, metingen: [THALF, 2 * THALF, 3 * THALF] });
      curves.push(c); actief = c;
      zetStemming('pijn', false);
      zetTekst('Een prik werkt meteen, maar zakt net zo hard.');
      var b = actieKnop('spuit', 'Spuit', ui.icoon('spuit'));
      wijs(b, true);
      bijTik(b, function () {
        if (b.disabled) return;
        uit(b); flits(b, 'tik');
        ui.speel('spuit');
        c.geef('spuit');
        c.meet();
        bijwerken(true);
        loop(c, 3 * THALF, 2.5, function () { toonVolgende(true); });
      });
    }

    // 4. Dagteller: na 4 × 1 g (0, 6, 12, 18 u) duwt een 5e gram (20 u) de teller over 4 g.
    function stap4() {
      nieuweGrafiek({ T: 24, ymax: 20, ticksX: [0, 6, 12, 18, 24], ticksY: [5, 10, 15], maag: true, lever: true });
      laatsteDag = -1;
      zetLever(false, false);
      var gepland = C.echtSchema.schema.map(function (d) { return { t: d.t, route: d.route, geluid: 'tik' }; });
      var c = new Curve({ stijl: 'nu', dt: 0.04, gepland: gepland });
      curves.push(c); actief = c;
      zetStemming('pijn', false);
      werkLeverBij(0);
      zetTekst('Meer is niet beter: boven 4 gram per dag raakt de lever beschadigd.');
      var b = actieKnop('slik', 'Tablet', ui.icoon('tablet'));
      b.disabled = true;
      loop(c, 20, 10, function () { b.disabled = false; wijs(b, true); zetFase('wacht'); });
      bijTik(b, function () {
        if (b.disabled || fase === 'loopt') return;
        uit(b); flits(b, 'tik');
        ui.speel('slik');
        c.geef('slik');
        bijwerken(false);
        loop(c, 24, 2, function () { toonVolgende(true); });
      });
    }

    // 5. Zetpil: twee zetpillen uit de vaste reeks van het model, met zichtbaar ander effect.
    function stap5() {
      nieuweGrafiek({ T: 3 * THALF, ymax: 12, ticksX: [0, 2.5, 5, 7.5], ticksY: [5, 10] });
      zetStemming('pijn', false);
      zetTekst('Een zetpil: soms goed, soms nauwelijks. Daar kun je niet van op aan.');
      var b = actieKnop('zetpil', 'Zetpil', ui.icoon('zetpil'));
      wijs(b, true);
      var keer = 0;
      bijTik(b, function () {
        if (b.disabled || fase === 'loopt') return;
        keer++;
        flits(b, 'tik');
        ui.speel('zetpil');
        wijs(b, false);
        if (keer >= 2) uit(b);
        var c = new Curve({ stijl: keer === 1 ? 'nu' : 'twee', dt: 0.02, label: String(keer) });
        c.geef('zetpil', { index: keer === 1 ? Z_GOED : Z_SLECHT });
        curves.push(c); actief = c;
        zetStemming('pijn', false);
        bijwerken(false);
        loop(c, 3 * THALF, 3, function () {
          if (keer < 2) { wijs(b, true); zetFase('wacht'); } else toonVolgende(true);
        });
      });
    }

    // 6. Klaar? Race!
    function stap6() {
      grafiek = null; curves = []; staven = []; actief = null;
      over.hidden = true;
      zetStemming('blij', false);
      zetLever(false, false);
      leverTekst.textContent = '';
      leverMeter.hidden = true;
      podium.classList.add('slot');
      tekst.textContent = '';
      graf.innerHTML = '';
      volgende.hidden = true;
      var b = el('button', { type: 'button', class: 'knop-wit groot tut-race', 'data-actie': 'verder', text: 'Klaar? Race!' });
      acties.appendChild(b);
      bediening.classList.add('slot');
      zetFase('klaar');
      ui.speel('klaar');
      var sinds = Date.now();
      b.addEventListener('click', function () {
        if (gestopt || Date.now() - sinds < 350) return;
        ui.speel('tik');
        meldGereed();
      });
    }

    function opResize() { teken(); }
    root.addEventListener('resize', opResize);

    naarStap(1);

    return {
      stop: function () {
        if (gestopt) return;
        gestopt = true;
        klaarGemeld = true;
        root.cancelAnimationFrame(raf);
        root.clearTimeout(ballonTimer);
        root.removeEventListener('resize', opResize);
        var v = binnen.querySelectorAll('[data-actie]');
        for (var i = 0; i < v.length; i++) v[i].removeAttribute('data-actie');
        root.setTimeout(function () {
          if (binnen.parentNode === container) container.removeChild(binnen);
        }, 450);
      }
    };
  }

  SoS.tutorial = { start: start };
})(typeof window !== 'undefined' ? window : null);

</script>
<script data-bron="src/einde.js">
/*
 * Slikken of Stikken — src/einde.js  (eindscherm + toedienverslag per race; §2, §3, §6B5, §6C)
 *
 * INTERFACE (houd deze vast; app.js roept alleen dit aan)
 * ----------------------------------------------------------
 *   SoS.einde.toon(container, data, opnieuw) -> {stop()}
 *     container  <section id="scherm-einde" class="scherm wit">: leeg en zichtbaar. Vul hem zelf.
 *     data = {
 *       naam:    speelnaam (string),
 *       races:   [verslag1, verslag2]  — precies race.verslag() uit src/score.js (zie de API daar:
 *                casus, opbouw.regels/totaal, tijdlijn, echtSchema, telling, uren, praktijk.zin),
 *                volgorde paracetamol, lithium,
 *       totaal:  som van races[i].opbouw.totaal (QALY-punten),
 *       curves:  [[{t, C}, ...], [{t, C}, ...]] — de gespeelde spiegel per race, uitgedund
 *                (paracetamol elke 0,1 u, lithium elke 1 u; t in uur), voor een mini-grafiekje,
 *       casussen: [SoS.model.casus('paracetamol'), SoS.model.casus('lithium')]
 *     }
 *     opnieuw()  Roep aan bij "Nog een keer" (één tik; knop data-actie="opnieuw"). app.js start dan
 *                meteen race 1 opnieuw, met dezelfde naam (tutorial en intro worden overgeslagen).
 *     stop()     Opruimen als het scherm weggaat.
 *   Eisen (§6B): naam en totaalscore ≥ 32 px; nabespreekvraag "Wat deed je toen je onder de streep zakte?".
 *
 * OPBOUW (één scrollend scherm, wit = Evolution-of-Trust-stijl zoals start en intro; de mini-curves
 * zijn zwarte racepaneeltjes, zodat ze er net zo uitzien als tijdens de race):
 *   1. Eindscherm (boven de vouw): speelnaam (36 px), totaal QALY-punten (72 px), per race een kaart met
 *      de QALY-punten en een tegelrij (één tegel per poortje, kleur = waar de spiegel tot het volgende
 *      poortje het meest zat: in de zone / te laag / te hoog / giftig; uit data.curves), de
 *      nabespreekvraag, een regel over het scorebord, "spelpunten, geen echte QALY's".
 *   2. Toedienverslag per race (data-verslag="0|1"): mini-curve, QALY-opbouw in vier regels + totaal,
 *      rooster met je toedieningen per poortje naast het echte schema, telling (toedienmomenten,
 *      totale dosis, dagteller), de praktijkzin en (lithium) de nabesprekingszin uit het casusblad.
 *   3. "Nog een keer" (data-actie="opnieuw") plakt onderaan in beeld; één tik.
 *   Alle getallen komen uit data (verslag/score) of het casusblad; dit bestand rekent niets nieuws uit,
 *   behalve de tegelkleur (welke toestand de meeste meetpunten van de eigen curve had).
 * Stabiele haken voor tests: [data-eind="naam"|"totaal"|"race-0"|"race-1"], [data-verslag="i"] met
 *   [data-regel="zone|laag|hoog|giftig|totaal"], [data-poortje="index"][data-soort], [data-tel="..."],
 *   [data-zin="praktijk"|"nabespreking"], knoppen data-actie="opnieuw" en "naar-verslag" (data-race).
 */
(function (root) {
  'use strict';
  if (!root) return;
  var SoS = root.SoS = root.SoS || {};

  var VRAAG = 'Wat deed je toen je onder de streep zakte?';
  var TOESTAND_LABEL = { zone: 'in de zone', onder: 'te laag', boven: 'te hoog', giftig: 'giftig' };
  var SOORT_LABEL = { tablet: 'tablet', zetpil: 'zetpil', spuit: 'spuit', overgeslagen: 'overgeslagen', geblokkeerd: 'geblokkeerd' };
  var LIJN = { zone: '#7ef0c4', onder: '#ff8f80', boven: '#ffb067', giftig: '#ff5a5a' }; // zoals in de race

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function getal(x, dec) { return SoS.ui.getal(x, dec || 0); }
  function metTeken(x) { return x > 0 ? '+' + getal(x) : getal(x); } // getal() zet zelf "−"
  function lijst(xs) { // "0, 6, 12 en 18"
    return xs.length < 2 ? xs.join('') : xs.slice(0, -1).join(', ') + ' en ' + xs[xs.length - 1];
  }

  function toestand(c, C, t) {
    var M = SoS.model, v = M.venster(c, t);
    if (c.toxisch != null && C > c.toxisch) return 'giftig';
    return C < v.laag ? 'onder' : (C > v.hoog ? 'boven' : 'zone');
  }

  // Per poortje: de toestand waarin de eigen spiegel tot het volgende poortje het vaakst zat.
  function tegelStaten(c, curve) {
    var tijden = SoS.model.poortjes(c), uit = [];
    var ernst = { zone: 0, onder: 1, boven: 2, giftig: 3 };
    for (var i = 0; i < tijden.length; i++) {
      var a = tijden[i], b = i + 1 < tijden.length ? tijden[i + 1] : c.raceDuur, n = {}, best = null;
      for (var j = 0; j < curve.length; j++) {
        var p = curve[j];
        if (p.t >= a - 1e-6 && p.t < b - 1e-6) { var s = toestand(c, p.C, p.t); n[s] = (n[s] || 0) + 1; }
      }
      Object.keys(n).forEach(function (s) {
        if (best == null || n[s] > n[best] || (n[s] === n[best] && ernst[s] > ernst[best])) best = s;
      });
      uit.push(best);
    }
    return uit;
  }

  // Paracetamol: poortjes waarop een toediening de dagteller (som in het 24-uursvenster) boven het max. bracht.
  function leverPoortjes(c, v) {
    var bg = c.bovengrens, uit = {};
    if (!bg || bg.type !== 'dagteller') return uit;
    var doses = [];
    v.tijdlijn.forEach(function (r) { r.jij.toedieningen.forEach(function (d) { doses.push({ t: r.t, dosis: d.dosis, i: r.index }); }); });
    doses.forEach(function (d, k) {
      var som = 0;
      for (var j = 0; j <= k; j++) if (doses[j].t > d.t - bg.venster - 1e-9) som += doses[j].dosis;
      if (som > bg.maxPer24u + 1e-9) uit[d.i] = true;
    });
    return uit;
  }

  function stemming(c, v) {
    if (c.toxisch != null && v.uren && v.uren.toxisch > 0) return 'misselijk';
    if (v.lever && v.lever.beschadigd) return 'misselijk';
    return v.opbouw.totaal >= 500 ? 'blij' : (v.opbouw.totaal >= 0 ? 'neutraal' : 'pijn');
  }
  function figuurHtml(c, v, klasse) {
    return '<div class="fig ' + (klasse || '') + '" aria-hidden="true">' +
      SoS.ui.figuur({ wie: c.id === 'lithium' ? 'vries' : 'opa', stemming: stemming(c, v),
        prop: c.id === 'lithium' ? null : 'stok' }) + '</div>';
  }

  // ------------------------------------------------------------------------------------------
  // 1. Eindscherm
  // ------------------------------------------------------------------------------------------
  function kaartHtml(i, c, v, curve) {
    var staten = curve && curve.length ? tegelStaten(c, curve) : null;
    if (staten) {
      var lp = leverPoortjes(c, v);
      Object.keys(lp).forEach(function (k) { staten[k] = 'giftig'; });
    }
    var tegels = '';
    if (staten) {
      // twee rijen: paracetamol uur 0–11 | 12–23; lithium dag 0–4 | dag 5–9 (vanaf de ibuprofen)
      var helft = Math.ceil(staten.length / 2);
      var rij = function (van, tot) {
        var s = '<span class="eind-tegelrij" style="--n:' + (tot - van) + '">';
        for (var k = van; k < tot; k++) {
          s += '<span class="eind-tegel t-' + (staten[k] || 'leeg') + '" style="--i:' + k + '"></span>';
        }
        return s + '</span>';
      };
      tegels = '<span class="eind-tegels" role="img" aria-label="Per poortje: waar de spiegel zat">' +
        rij(0, helft) + rij(helft, staten.length) + '</span>';
    }
    return '<button type="button" class="eind-kaart" data-actie="naar-verslag" data-race="' + i + '">' +
      '<span class="eind-kaart-kop">' + figuurHtml(c, v, 'eind-kaart-fig') +
        '<span class="eind-kaart-titel"><small>Race ' + (i + 1) + '</small>' + esc(c.naam) + '</span>' +
        '<span class="eind-kaart-rechts"><span class="eind-kaart-score" data-eind="race-' + i + '">' + getal(v.opbouw.totaal) + '</span>' +
        '<span class="eind-kaart-meer">verslag <span aria-hidden="true">↓</span></span></span>' +
      '</span>' + tegels +
    '</button>';
  }

  function legendaHtml(cs) {
    var heeft = { zone: true, onder: true, boven: false, giftig: false };
    cs.forEach(function (c) {
      if (!c) return;
      if (c.venster.some(function (v) { return v.hoog !== Infinity; })) heeft.boven = true;
      if (c.toxisch != null || (c.bovengrens && c.bovengrens.type === 'dagteller')) heeft.giftig = true;
    });
    return '<ul class="eind-legenda" aria-label="Kleuren van de tegels">' +
      ['zone', 'onder', 'boven', 'giftig'].filter(function (s) { return heeft[s]; }).map(function (s) {
        return '<li><span class="eind-tegel t-' + s + '"></span>' + (s === 'giftig' ? 'lever / giftig' : TOESTAND_LABEL[s]) + '</li>';
      }).join('') + '</ul>';
  }

  // ------------------------------------------------------------------------------------------
  // 2. Toedienverslag
  // ------------------------------------------------------------------------------------------
  function curveSvg(c, curve) {
    if (!curve || curve.length < 2) return '';
    var W = 340, H = 132, L = 8, R = 30, T = 18, B = 22, pw = W - L - R, ph = H - T - B;
    var maxC = 0;
    curve.forEach(function (p) { if (p.C > maxC) maxC = p.C; });
    var vast = c.id === 'lithium' ? 2 : 20;
    var ymax = Math.max(vast, maxC * 1.08);
    var x = function (t) { return L + pw * t / c.raceDuur; };
    var y = function (C) { return T + ph * (1 - Math.min(C, ymax) / ymax); };
    var f = function (n) { return Math.round(n * 10) / 10; };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" ' +
      'aria-label="Jouw spiegel tijdens de race, met de zone">';
    s += '<rect x="0" y="0" width="' + W + '" height="' + H + '" rx="14" fill="#000"/>';
    // gebeurtenissen
    c.gebeurtenissen.forEach(function (g) {
      if (g.type === 'blokkade') {
        s += '<rect x="' + f(x(g.van)) + '" y="' + T + '" width="' + f(x(g.tot) - x(g.van)) + '" height="' + ph +
          '" fill="rgba(190,230,90,0.13)"/>';
        s += '<text x="' + f((x(g.van) + x(g.tot)) / 2) + '" y="' + (T - 5) + '" text-anchor="middle" class="eind-svg-gebeurtenis">misselijk</text>';
      } else if (g.type === 'klaring') {
        s += '<line x1="' + f(x(g.t)) + '" y1="' + T + '" x2="' + f(x(g.t)) + '" y2="' + (T + ph) +
          '" stroke="#b07cff" stroke-width="2"/>';
        s += '<text x="' + f(x(g.t) + 4) + '" y="' + (T - 5) + '" class="eind-svg-paars">ibuprofen</text>';
      }
    });
    // zone(s)
    var v0 = c.venster[0];
    var yHoog = v0.hoog === Infinity ? T : y(v0.hoog), yLaag = y(v0.laag);
    s += '<rect x="' + L + '" y="' + f(yHoog) + '" width="' + pw + '" height="' + f(yLaag - yHoog) + '" fill="rgba(61,220,151,0.16)"/>';
    s += '<line x1="' + L + '" y1="' + f(yLaag) + '" x2="' + (L + pw) + '" y2="' + f(yLaag) + '" stroke="rgba(61,220,151,0.85)" stroke-width="1.5"/>';
    if (v0.hoog !== Infinity) {
      s += '<line x1="' + L + '" y1="' + f(yHoog) + '" x2="' + (L + pw) + '" y2="' + f(yHoog) + '" stroke="rgba(61,220,151,0.5)" stroke-width="1"/>';
    }
    if (c.toxisch != null && c.toxisch < ymax) {
      s += '<line x1="' + L + '" y1="' + f(y(c.toxisch)) + '" x2="' + (L + pw) + '" y2="' + f(y(c.toxisch)) +
        '" stroke="rgba(255,90,90,0.7)" stroke-width="1.2" stroke-dasharray="4 4"/>';
    }
    // curve, gekleurd per toestand
    var stuk = null, paden = [];
    for (var i = 0; i < curve.length; i++) {
      var p = curve[i], st = toestand(c, p.C, p.t), pt = f(x(p.t)) + ' ' + f(y(p.C));
      if (!stuk || stuk.st !== st) {
        if (stuk) stuk.d += ' L' + pt;
        stuk = { st: st, d: 'M' + pt };
        paden.push(stuk);
      } else stuk.d += ' L' + pt;
    }
    paden.forEach(function (pd) {
      s += '<path d="' + pd.d + '" fill="none" stroke="' + LIJN[pd.st] + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
    });
    // labels: drempels (casusblad) en tijdas
    var labels = c.id === 'lithium'
      ? [[v0.laag, getal(v0.laag, 1), 5], [v0.hoog, getal(v0.hoog, 1), -1], [c.toxisch, getal(c.toxisch, 1), 4]]
      : [[v0.laag, getal(v0.laag), 4]];
    labels.forEach(function (lb) {
      if (lb[0] == null || lb[0] >= ymax) return;
      s += '<text x="' + (W - 3) + '" y="' + f(y(lb[0]) + lb[2]) + '" text-anchor="end" class="eind-svg-label' +
        (lb[0] === c.toxisch ? ' tox' : '') + '">' + esc(lb[1]) + '</text>';
    });
    var asTekst = c.id === 'lithium'
      ? [[0, 'dag 0'], [c.raceDuur / 2, 'dag ' + c.raceDuur / 48], [c.raceDuur, 'dag ' + c.raceDuur / 24]]
      : [[0, 'uur 0'], [c.raceDuur / 2, 'uur ' + c.raceDuur / 2], [c.raceDuur, 'uur ' + c.raceDuur]];
    asTekst.forEach(function (a, k) {
      var anker = k === 0 ? 'start' : (k === 2 ? 'end' : 'middle');
      s += '<text x="' + f(x(a[0])) + '" y="' + (H - 6) + '" text-anchor="' + anker + '" class="eind-svg-as">' + a[1] + '</text>';
    });
    return s + '</svg>';
  }

  function opbouwHtml(v) {
    var rijen = v.opbouw.regels.map(function (r) {
      var kl = r.punten > 0 ? 'plus' : (r.punten < 0 ? 'min' : 'nul');
      return '<tr data-regel="' + r.id + '"><th scope="row">' + esc(r.label) + '</th>' +
        '<td class="' + kl + '">' + metTeken(r.punten) + '</td></tr>';
    }).join('');
    return '<table class="eind-opbouw"><caption>QALY-opbouw</caption><tbody>' + rijen +
      '<tr class="eind-opbouw-totaal" data-regel="totaal"><th scope="row">totaal</th><td>' + getal(v.opbouw.totaal) +
      '</td></tr></tbody></table>';
  }

  function celInhoud(rij) {
    var j = rij.jij, ic = SoS.ui.icoon;
    if (j.soorten.length) {
      return j.soorten.map(function (so) {
        return '<span class="eind-cel-ic">' + ic(so.soort) + (so.aantal > 1 ? '<b>' + so.aantal + '×</b>' : '') + '</span>';
      }).join('');
    }
    if (j.soort === 'geblokkeerd') return '<span class="eind-cel-ic">' + ic('kruis') + '</span>';
    return '<span class="eind-cel-leeg" aria-hidden="true">–</span>';
  }

  function roosterHtml(c, v) {
    var M = SoS.model, rijen = v.tijdlijn;
    var allesEcht = rijen.every(function (r) { return r.echt; });
    var blok = null;
    c.gebeurtenissen.forEach(function (g) { if (g.type === 'blokkade') blok = g; });
    var klaring = null;
    c.gebeurtenissen.forEach(function (g) { if (g.type === 'klaring') klaring = g; });
    var cel = function (r, metTijd) {
      var j = r.jij, misselijk = blok && r.t >= blok.van - 1e-9 && r.t < blok.tot - 1e-9;
      var echt = r.echt && !allesEcht;
      var label = r.tijdTekst + ': ' + j.tekst + (r.echt ? '; echt schema ' + r.echt : '');
      return '<li class="eind-cel' + (echt ? ' echt' : '') + (misselijk ? ' misselijk' : '') + ' s-' + j.soort + '"' +
        ' data-poortje="' + r.index + '" data-soort="' + j.soort + '" data-tekst="' + esc(j.tekst) + '"' +
        ' aria-label="' + esc(label) + '">' +
        (metTijd ? '<span class="eind-cel-uur" aria-hidden="true">' + r.t + '</span>' : '') +
        celInhoud(r) +
        (echt ? '<span class="eind-cel-echt" aria-hidden="true">' + esc(r.echt) + '</span>' : '') + '</li>';
    };
    var s = '';
    if (c.id === 'lithium') {
      // rijen = dagen, kolommen = de poortjes van die dag
      var perDag = Math.round(24 / c.poortjes.interval), dagen = Math.ceil(rijen.length / perDag);
      var kop = rijen.slice(0, perDag).map(function (r) { return '<span>' + r.t + ' u</span>'; }).join('');
      s += '<div class="eind-rooster eind-rooster-dag" style="--k:' + perDag + '">';
      s += '<div class="eind-dagrij eind-dagkop" aria-hidden="true"><span></span>' + kop + '</div>';
      for (var d = 0; d < dagen; d++) {
        var r0 = rijen[d * perDag];
        if (klaring && Math.abs(r0.t - klaring.t) < 1e-9) {
          s += '<div class="eind-markering"><span>dag ' + (klaring.t / 24) + ': ibuprofen</span></div>';
        }
        s += '<div class="eind-dagrij"><span class="eind-dag">dag ' + d + '</span><ul>' +
          rijen.slice(d * perDag, (d + 1) * perDag).map(function (r) { return cel(r, false); }).join('') + '</ul></div>';
      }
      s += '</div>';
    } else {
      // rijen van 6 uur: het echte schema (om de 6 uur) valt steeds in de eerste kolom
      var stap = c.echtSchema.schema.length > 1 ? Math.round((c.echtSchema.schema[1].t - c.echtSchema.schema[0].t) / c.poortjes.interval) : 6;
      s += '<ul class="eind-rooster eind-rooster-uur" style="--k:' + stap + '">' + rijen.map(function (r) { return cel(r, true); }).join('') + '</ul>';
    }
    // legenda: alleen wat voorkomt (+ altijd overgeslagen), en het echte schema
    var komtVoor = {};
    rijen.forEach(function (r) {
      r.jij.soorten.forEach(function (so) { komtVoor[so.soort] = true; });
      if (r.jij.soort === 'geblokkeerd') komtVoor.geblokkeerd = true;
    });
    var ic = SoS.ui.icoon;
    var leg = ['tablet', 'zetpil', 'spuit'].filter(function (k) { return komtVoor[k]; }).map(function (k) {
      return '<li><span class="eind-leg-ic">' + ic(k) + '</span>' + SOORT_LABEL[k] + '</li>';
    });
    if (komtVoor.geblokkeerd) leg.push('<li><span class="eind-leg-ic">' + ic('kruis') + '</span>geblokkeerd (wilde slikken, maar misselijk)</li>');
    leg.push('<li><span class="eind-leg-ic eind-leg-leeg">–</span>overgeslagen</li>');
    if (!allesEcht) leg.push('<li><span class="eind-leg-echt">' + esc(rijen.filter(function (r) { return r.echt; })[0].echt) + '</span>echt schema</li>');
    if (blok) leg.push('<li><span class="eind-leg-misselijk"></span>misselijk (' + esc(blok.tijdTekst.toLowerCase()) + ')</li>');
    return s + '<ul class="eind-leg">' + leg.join('') + '</ul>';
  }

  function echtTekstHtml(c, v) {
    var sch = c.echtSchema.schema, perDag = sch.filter(function (e) { return e.t < 24; });
    var dosis = (v.tijdlijn.filter(function (r) { return r.echt; })[0] || {}).echt || '';
    var tijden = perDag.map(function (e) { return e.t; });
    var lek = c.id === 'lithium'
      ? perDag.length + '× per dag ' + dosis + ' (om ' + lijst(tijden) + ' uur). Na een pijnstiller als ibuprofen (een NSAID): de spiegel laten prikken.'
      : perDag.length + '× per dag ' + dosis + ' (om uur ' + lijst(tijden) + ').';
    return '<p class="eind-echt"><span class="eind-echt-kop">Echt schema</span> <b>' + esc(v.echtSchema.tekst) + '</b><br>' +
      'Dat is: ' + esc(lek) + (c.id === 'lithium' ? ' In het rooster: elk vakje 1 tablet.' : '') + '</p>';
  }

  function tellingHtml(v) {
    var t = v.telling, s = '<div class="eind-telling">';
    s += '<div data-tel="momenten"><span>Toedien&shy;momenten</span><b>' + getal(t.toedienmomenten) + '</b>' +
      '<small>echt schema: ' + getal(v.echtSchema.aantal) + '</small></div>';
    s += '<div data-tel="dosis"><span>Totale dosis</span><b>' + esc(t.totaleDosis.tekst) + '</b></div>';
    if (t.dagteller) {
      s += '<div data-tel="dagteller" class="' + (t.dagteller.over ? 'over' : '') + '"><span>Dagteller</span>' +
        '<b>' + getal(t.dagteller.hoogste, t.dagteller.hoogste % 1 ? 1 : 0) + ' g</b>' +
        '<small>max. ' + getal(t.dagteller.max) + ' g per 24 uur' + (t.dagteller.over ? '. Lever beschadigd.' : '') + '</small></div>';
    }
    return s + '</div>';
  }

  function verslagHtml(i, c, v, curve) {
    var s = '<section class="eind-verslag" data-verslag="' + i + '" id="eind-verslag-' + i + '" aria-labelledby="eind-v-kop-' + i + '">';
    s += '<header class="eind-v-kop">' + figuurHtml(c, v, 'eind-v-fig') +
      '<div><p class="eind-kicker">Race ' + (i + 1) + ' · verslag</p>' +
      '<h2 id="eind-v-kop-' + i + '">' + esc(c.naam) + ' <span class="eind-v-wie">' + esc(c.patient) + '</span></h2>' +
      '<p class="eind-v-score"><b>' + getal(v.opbouw.totaal) + '</b> QALY-punten</p></div></header>';
    if (curve && curve.length > 1) {
      s += '<figure class="eind-curve">' + curveSvg(c, curve) +
        '<figcaption>Jouw spiegel. Groene baan: in de zone (' + esc(c.zone.tekst.split(' = ')[0]) + ').' +
        (c.toxisch != null ? ' Rode stippellijn: giftig (' + esc(c.toxischTekst || getal(c.toxisch, 1)) + ').' : '') +
        '</figcaption></figure>';
    }
    s += opbouwHtml(v);
    s += '<h3 class="eind-h3">Jouw toedieningen per poortje</h3>';
    s += echtTekstHtml(c, v);
    s += roosterHtml(c, v);
    s += tellingHtml(v);
    s += '<blockquote class="eind-praktijk" data-zin="praktijk">' + esc(v.praktijk.zin) + '</blockquote>';
    if (c.nabespreking && v.praktijk.zin.indexOf(c.nabespreking) < 0) {
      s += '<p class="eind-nabespreking" data-zin="nabespreking">' + esc(c.nabespreking) + '</p>';
    }
    return s + '</section>';
  }

  // ------------------------------------------------------------------------------------------
  function toon(container, data, opnieuw) {
    var ui = SoS.ui, M = SoS.model;
    data = data || {};
    var races = data.races || [], curves = data.curves || [];
    var cs = races.map(function (v, i) {
      return (data.casussen && data.casussen[i]) || (v ? M.casus(v.casus) : null);
    });
    var totaal = data.totaal != null ? data.totaal : races.reduce(function (s, v) { return s + (v ? v.opbouw.totaal : 0); }, 0);

    var kaarten = '', verslagen = '';
    races.forEach(function (v, i) {
      if (!v || !cs[i]) return;
      kaarten += kaartHtml(i, cs[i], v, curves[i]);
      verslagen += verslagHtml(i, cs[i], v, curves[i]);
    });

    container.innerHTML =
      '<div class="eind-binnen">' +
        '<div class="eind-held">' +
          '<p class="eind-naam' + (String(data.naam || '').length > 9 ? ' lang' : '') + '" data-eind="naam">' + esc(data.naam || '') + '</p>' +
          '<p class="eind-label">QALY-punten totaal</p>' +
          '<p class="eind-totaal" data-eind="totaal">' + getal(totaal) + '</p>' +
          '<p class="eind-spelpunten">Spelpunten, geen echte QALY\'s.</p>' +
          '<div class="eind-kaarten">' + kaarten + '</div>' +
          legendaHtml(cs) +
          '<div class="eind-vraag"><span class="eind-vraag-kop">Nabespreken</span>' +
            '<p data-eind="vraag">' + VRAAG + '</p></div>' +
          '<p class="eind-scorebord">Geef je speelnaam en totaal door aan Bart: hij zet je op het scorebord in de zaal.</p>' +
        '</div>' +
        verslagen +
        '<div class="eind-voet"><button type="button" class="knop-wit groot" data-actie="opnieuw">Nog een keer</button></div>' +
      '</div>';

    var bezig = false;
    var weg = [];
    function luister(el, ev, fn) { el.addEventListener(ev, fn); weg.push(function () { el.removeEventListener(ev, fn); }); }

    luister(container.querySelector('[data-actie="opnieuw"]'), 'click', function () {
      if (bezig) return;
      bezig = true;
      ui.speel('tik');
      opnieuw();
    });
    Array.prototype.forEach.call(container.querySelectorAll('[data-actie="naar-verslag"]'), function (k) {
      luister(k, 'click', function () {
        var doel = container.querySelector('[data-verslag="' + k.getAttribute('data-race') + '"]');
        if (!doel) return;
        ui.speel('tik');
        var glad = !(root.matchMedia && root.matchMedia('(prefers-reduced-motion: reduce)').matches);
        container.scrollTo({ top: doel.offsetTop - 8, behavior: glad ? 'smooth' : 'auto' });
      });
    });
    // figuurtjes reageren op aanraken (EoT)
    Array.prototype.forEach.call(container.querySelectorAll('.eind-v-fig'), function (f) {
      luister(f, 'pointerdown', function () {
        f.classList.remove('wiebel'); void f.offsetWidth; f.classList.add('wiebel');
        ui.speel('tik');
      });
    });

    container.scrollTop = 0;
    ui.speel('klaar');
    return {
      stop: function () {
        bezig = true;
        weg.forEach(function (f) { f(); });
        weg = [];
      }
    };
  }

  SoS.einde = { toon: toon };
})(typeof window !== 'undefined' ? window : null);

</script>
<script data-bron="src/app.js">
/*
 * Slikken of Stikken — src/app.js  (schermen, spelverloop, racescherm)
 * Laadt als laatste (na model, score, sound, tutorial, einde). Zet window.SoS.ui en window.SoS.debug.
 *
 * FLOW: start (naam + "Start") → tutorial (SoS.tutorial.start) → intro race 1 → race 1 paracetamol
 *       → intro race 2 → race 2 lithium → einde (SoS.einde.toon). "Nog een keer" start race 1 meteen.
 *
 * GEDEELD, VOOR ANDERE BOUWERS (SoS.ui; gebruik binnen je start()/toon(), niet bij het laden):
 *   SoS.ui.figuur({wie:'opa'|'vries', stemming:'neutraal'|'blij'|'pijn'|'misselijk', prop:'stok'|'doosje'|null,
 *                 kleur, label}) -> SVG-string in Evolution-of-Trust-stijl: rond wit hoofd, zwarte schetslijn,
 *                 gekleurd hoedje (opa Jan blauw #3d7fe0 met wandelstok, mevrouw De Vries rood #e0405f met
 *                 knotje en bril). Zet hem in een <div class="fig">; .fig.wiebel laat hem even reageren.
 *   SoS.ui.icoon(soort)  soort 'tablet'|'slik'|'zetpil'|'spuit'|'niets'|'doosje' -> SVG-string (40×40).
 *   SoS.ui.el(tag, attrs, kinderen) -> element (attrs: class, text, html, data-*, aria-*, on<event>).
 *   SoS.ui.getal(x, decimalen) -> Nederlandse notatie ("1,5"; "1.250").
 *   SoS.ui.speel(naam)  SoS.sound.play zonder risico (namen: zie src/sound.js). SoS.ui.unlock().
 *   SoS.ui.KLEUR {paars, groen, koraal, geel, blauw, rood, roze, inkt, papier}
 *   Stijl: style.css (kleurvariabelen, .scherm.wit/.zwart, .knop-wit, .knop-paars, .fig).
 *
 * RACE-INTERACTIE: de tijd loopt van boven naar beneden; paarse poortjes schuiven van onder naar de
 * "nu"-lijn. De knoppen onderin kiezen wat er op het EERSTVOLGENDE poortje gebeurt (stand "gekozen",
 * icoontje op het poortje); op het poortje wordt de keuze toegepast (race.geef) en gewist. Niets
 * gekozen = overslaan. Tablet twee keer tikken = 2 tabletten tegelijk ("2×"), derde tik = keuze weg;
 * zelfde knop bij zetpil/spuit nog eens tikken = keuze weg. Slikken tijdens misselijkheid en de
 * lithium-spuit worden geweigerd met de casusbladtekst (geen effect, geen strafpunten).
 *
 * TESTHAAK (gauntlet/contract.md):
 *   ?speed=N  versnelt de spelklok N× (ook de aanloop van 3 s en de duur van meldingen).
 *   window.SoS.debug (alleen-lezen momentopname, elke keer vers): {fase, casus, t, klok, C, score,
 *     dagteller, poortje:{index, t, keuze, aantal, geblokkeerd}, gegeven:[...], uitslag:[...], naam, speed}
 *     fase: 'start'|'tutorial'|'intro1'|'race1'|'intro2'|'race2'|'einde'; t = modeltijd (uur);
 *     klok = spelklok (uur, negatief tijdens de aanloop); score = live QALY-totaal.
 *   Stabiele data-attributen: data-actie="start" (startscherm), "verder" (tutorial-einde en na elke
 *     race), "start-race" (intro-kaartje), "slik" | "zetpil" | "spuit" | "niets" (race; lithium

  function pasPoortjeToe(g) {

        if (res.lever < 0) {
          setTimeout(function () { speel('alarm'); }, 120);
          melding(c.lekentaal.boven, { soort: 'alarm', prio: 2, duur: 3 });
          R.effecten.push({ type: 'lever', t0: nu });
          var lv = $('lever'); lv.classList.remove('vol'); void lv.offsetWidth; lv.classList.add('vol');
        }
      } else if (res.reden === 'geblokkeerd') {
        uit.soort = 'geblokkeerd';
      }
    } else if (k.route === 'niets') {
      uit.soort = 'niets';
      speel('overslaan');
    } else if (!k.poging) {
      speel('poort');
    }
    R.gegeven[g] = uit;
    R.keuze = { route: null, aantal: 0, poging: false };
    werkKnoppenBij();
  }

  // Het volgende poortje is nu het doel: misschien is er een plotwending.
  function bijNieuwDoel() {
    var c = R.casus;
    if (R.g >= R.poorten.length) return;
    var T = R.poorten[R.g];
    c.gebeurtenissen.forEach(function (g, gi) {
      if (R.onthuld[gi] || g.type !== 'blokkade') return;
      if (T >= g.van - 1e-9 && T < g.tot - 1e-9) {
        R.onthuld[gi] = true;
        speel('wending');
        melding(g.tekst, { soort: 'wending', prio: 3, duur: 3.4, fig: figuur({ wie: 'opa', stemming: 'misselijk' }) });
        if (R.knoppen.slik) flits(R.knoppen.slik, 'schud');
      }
    });
    werkKnoppenBij();
  }

  function controleerGebeurtenissen() {
    var c = R.casus;
    c.gebeurtenissen.forEach(function (g, gi) {
      if (R.onthuld[gi] || g.type !== 'klaring') return;
      if (R.klok >= g.t - 1e-9) {
        R.onthuld[gi] = true;
        speel('wending');
        melding(g.tekst, { soort: 'wending', prio: 3, duur: 3.6, fig: figuur({ wie: 'vries', prop: 'doosje', stemming: 'neutraal' }) });
        $('patient').appendChild(el('span', { class: 'chip', html: icoon('doosje').replace('<svg', '<svg width="16" height="16"') + 'ibuprofen' }));
      }
    });
  }

  function controleerZone() {
    if (R.klok < 0) return;
    var c = R.casus, C = R.race.sim.C, t = R.race.t;
    var z = zoneVan(C, t);
    var tox = c.toxisch != null && C > c.toxisch;
    var vorig = R.toestand;
    if (vorig && z !== vorig) {
      if (z === 'onder') {
        speel('au');
        melding(c.lekentaal.onder, { soort: 'au', prio: 1, duur: 2.4 });
        R.effecten.push({ type: 'au', t0: performance.now(), x: xVan(C) });
      } else if (z === 'boven') {
        speel('alarm');
        melding(c.lekentaal.boven, { soort: 'alarm', prio: 1, duur: 2.8 });
      }
    }
    if (tox && !R.toxisch) {
      speel('alarm');
      melding(c.lekentaal.boven, { soort: 'alarm', prio: 2, duur: 2.8 });
    }
    R.toestand = z; R.toxisch = tox;
  }

  function werkKopBij() {
    var c = R.casus;
    var k = klokHtml(c, R.klok);
    if (k !== R.tekstKlok) { $('klok').innerHTML = k; R.tekstKlok = k; }
    var st = R.race.stand();
    var sc = getal(st.totaal, 0);
    if (sc !== R.tekstScore) { $('qaly-getal').textContent = sc; R.tekstScore = sc; }
    var trend = '';
    if (R.klok >= 0) {
      var tp = S.tempo(c, R.race.sim.C, R.race.t);
      var som = tp.zone + tp.laag + tp.hoog + tp.giftig;
      trend = som > 0 ? 'plus' : (som < -1e-9 ? 'min' : '');
    }
    trend += st.totaal < 0 ? ' negatief' : '';
    if (trend !== R.trend) {
      $('qaly').className = 'qaly ' + trend;
      $('qaly-trend').textContent = trend.indexOf('plus') === 0 ? '▲' : (trend.indexOf('min') === 0 ? '▼' : '');
      R.trend = trend;
    }
    if (c.bovengrens && c.bovengrens.type === 'dagteller' && st.dagteller !== R.dagteller) {
      R.dagteller = st.dagteller;
      var max = c.bovengrens.maxPer24u;
      $('lever-tekst').textContent = getalKort(st.dagteller / 1000, 1) + ' g van max. ' + getalKort(max / 1000, 1) + ' g';
      var vol = st.dagteller > max;
      $('lever-vul').style.width = (vol ? 100 : 100 * st.dagteller / (max * 1.25)) + '%';
      $('lever').classList.toggle('vol', vol);
    }
  }

  function eindeRace() {
    R.klaar = true;
    R.duurEcht = (performance.now() - R.startEcht) / 1000;
    root.cancelAnimationFrame(R.rafId);
    var st = R.race.stand();
    teken(performance.now());
    staat.verslagen[R.i] = R.race.verslag();
    staat.curves[R.i] = R.dun.slice();
    staat.duren = staat.duren || [];
    staat.duren[R.i] = R.duurEcht;
    speel('klaar');
    $('melding').classList.remove('zicht');
    $('finish-getal').textContent = getal(st.totaal, 0);
    $('finish').hidden = false;
  }

  function naRace() {
    if (!R || !R.klaar) return;
    var i = R.i;
    if (i === 0) toonIntro(1);
    else toonEinde();
  }

  // ------------------------------------------------------------------------------------------
  // 5. Einde (module)
  // ------------------------------------------------------------------------------------------
  function toonEinde() {
    var c = $('scherm-einde');
    c.innerHTML = '';
    naarScherm('einde');
    var races = staat.verslagen.slice(0, 2);
    var data = {
      naam: staat.naam,
      races: races,
      totaal: races.reduce(function (s, v) { return s + (v ? v.opbouw.totaal : 0); }, 0),
      curves: staat.curves.slice(0, 2),
      casussen: RACES.map(function (id) { return M.casus(id); })
    };
    if (!SoS.einde || typeof SoS.einde.toon !== 'function') return;
    var h = SoS.einde.toon(c, data, opnieuw);
    if (h && typeof h.stop === 'function') staat.moduleStop = h.stop;
  }

  function opnieuw() {
    if (staat.fase !== 'einde') return;
    staat.verslagen = []; staat.curves = []; staat.duren = [];
    startRace(0);
  }

  // ------------------------------------------------------------------------------------------
  // Debug (alleen-lezen) en init
  // ------------------------------------------------------------------------------------------
  Object.defineProperty(SoS, 'debug', {
    enumerable: true, configurable: false,
    get: function () {
      var r = R && (staat.fase === 'race1' || staat.fase === 'race2') ? R : null;
      var snap = {
        fase: staat.fase, naam: staat.naam, speed: SPEED,
        casus: r ? r.casus.id : null,
        t: r ? r.race.t : null,
        klok: r ? r.klok : null,
        C: r ? r.race.sim.C : null,
        score: r ? r.race.stand().totaal : null,
        dagteller: r ? r.race.stand().dagteller : null,
        klaar: r ? r.klaar : null,
        poortje: r && r.g < r.poorten.length ? {
          index: r.g, t: r.poorten[r.g], keuze: r.keuze.route, aantal: r.keuze.aantal,
          geblokkeerd: !!doelGeblokkeerd(), poging: r.keuze.poging
        } : null,
        gegeven: r ? r.gegeven.map(function (x) { return x ? x.soort + (x.aantal > 1 ? '×' + x.aantal : '') : null; }) : [],
        uitslag: staat.verslagen.map(function (v) { return v ? v.opbouw.totaal : null; }),
        duren: (staat.duren || []).slice()
      };
      return Object.freeze(snap);
    }
  });

  function initDemp() {
    var b = $('demp');
    function zet(m) {
      b.innerHTML = m ? DEMP_UIT : DEMP_AAN;
      b.setAttribute('aria-pressed', m ? 'true' : 'false');
      b.setAttribute('aria-label', m ? 'Geluid aan' : 'Geluid uit');
    }
    var snd = SoS.sound;
    zet(snd ? snd.isMuted() : false);
    if (snd && snd.onMuteChange) snd.onMuteChange(zet);
    b.addEventListener('click', function () {
      unlock();
      if (!snd) return;
      var m = snd.toggle();
      zet(m);
      if (!m) speel('tik');
    });
  }

  function init() {
    doc.body.classList.add('licht');
    initStart();
    initDemp();
    doc.addEventListener('pointerdown', unlock, true);
    doc.querySelector('[data-actie="start-race"]').addEventListener('click', function () {
      unlock();
      if (staat.fase !== 'intro1' && staat.fase !== 'intro2') return;
      speel('tik');
      startRace(staat.introIndex);
    });
    doc.querySelector('#finish [data-actie="verder"]').addEventListener('click', function () {
      unlock();
      speel('tik');
      naRace();
    });
    root.addEventListener('resize', function () { if (R && !R.klaar) meetDoek(); else if (R) { meetDoek(); teken(performance.now()); } });
    naarScherm('start');
  }

  if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', init);
  else init();
})(window);

</script>
</body>
</html>
