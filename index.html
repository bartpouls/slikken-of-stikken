<title>Slikken of Stikken</title>

<style data-bron="src/style.css">
/*
 * Slikken of Stikken — src/style.css (gedeelde stijl + start/intro/race)
 *
 * GEDEELD (voor tutorial.css / einde.css hergebruiken, niet opnieuw definiëren):
 *   Kleuren:  --zwart --wit --inkt (zwarte schetslijn) --grijs --paars (tijdmarkering)
 *             --groen (zone) --koraal (te laag/fout) --geel --blauw (hoedje opa Jan)
 *             --rood (hoedje mevrouw De Vries) --roze
 *   Letters:  --font (systeemletter), --font-rond (afgerond, EoT-gevoel)
 *   Schermen: <section class="scherm wit|zwart"> vult het hele scherm, met safe-area-padding;
 *             alleen het scherm met .actief is zichtbaar (app.js regelt dat).
 *   Knoppen:  .knop-wit (EoT: wit, dikke zwarte rand, "drukbaar"), .knop-paars (race-stijl),
 *             .groot = breed en hoog. Alle knoppen ≥ 48×48 px.
 *   Figuren:  .fig met een SVG van SoS.ui.figuur(); .fig.wiebel = korte reactie bij aanraken.
 */
:root {
  --zwart: #000;
  --wit: #fff;
  --inkt: #1b1b1f;
  --grijs: #8a8a93;
  --papier: #fbfaf7;
  --paars: #b07cff;
  --paars-diep: #8a55f0;
  --groen: #3ddc97;
  --koraal: #ff6f61;
  --geel: #ffd166;
  --blauw: #3d7fe0;
  --rood: #e0405f;
  --roze: #ff8fb8;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-rond: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --veilig-boven: env(safe-area-inset-top, 0px);
  --veilig-onder: env(safe-area-inset-bottom, 0px);
  --veilig-links: env(safe-area-inset-left, 0px);
  --veilig-rechts: env(safe-area-inset-right, 0px);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  background: var(--zwart);
  color: var(--wit);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}
body { position: fixed; inset: 0; }
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer; }
input { font: inherit; }
[hidden] { display: none !important; }

#app { position: absolute; inset: 0; overflow: hidden; }

/* ---------- schermen ---------- */
.scherm {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  padding: calc(var(--veilig-boven) + 12px) calc(var(--veilig-rechts) + 16px) calc(var(--veilig-onder) + 12px) calc(var(--veilig-links) + 16px);
  opacity: 0; visibility: hidden;
  transition: opacity .35s ease, visibility 0s linear .35s;
  overflow-x: hidden; overflow-y: auto;
}
.scherm.actief { opacity: 1; visibility: visible; transition: opacity .35s ease, visibility 0s; }
.scherm.wit { background: var(--papier); color: var(--inkt); font-family: var(--font-rond); }
.scherm.zwart { background: var(--zwart); color: var(--wit); }

/* ---------- knoppen ---------- */
.knop-wit {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 56px; min-width: 48px; padding: 10px 26px;
  background: var(--wit); color: var(--inkt);
  border: 3px solid var(--inkt); border-radius: 18px;
  box-shadow: 0 5px 0 var(--inkt);
  font-family: var(--font-rond); font-size: 21px; font-weight: 700; letter-spacing: .01em;
  transition: transform .08s ease, box-shadow .08s ease, background .15s;
}
.knop-wit:active, .knop-wit.ingedrukt { transform: translateY(4px); box-shadow: 0 1px 0 var(--inkt); }
.knop-wit:focus-visible, .knop-paars:focus-visible, .actie:focus-visible { outline: 3px solid var(--paars); outline-offset: 3px; }
.knop-wit.groot { width: 100%; max-width: 340px; min-height: 60px; font-size: 22px; }

.knop-paars {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 56px; min-width: 160px; padding: 10px 28px;
  background: var(--paars-diep); color: var(--wit);
  border: 0; border-radius: 999px;
  font-size: 20px; font-weight: 700;
  box-shadow: 0 0 0 4px rgba(176, 124, 255, .25), 0 8px 30px rgba(138, 85, 240, .45);
  transition: transform .1s ease;
}
.knop-paars:active { transform: scale(.96); }

/* ---------- dempknop (altijd bereikbaar) ---------- */
.demp {
  position: fixed; z-index: 50;
  top: calc(var(--veilig-boven) + 6px); right: calc(var(--veilig-rechts) + 6px);
  width: 48px; height: 48px; padding: 0;
  display: grid; place-items: center;
  border: 0; border-radius: 50%;
  background: transparent; color: var(--grijs);
}
.demp svg { width: 26px; height: 26px; }
body.licht .demp { color: #6b6b73; }
body.donker .demp { color: rgba(255, 255, 255, .7); }
.demp[aria-pressed="true"] { color: var(--koraal) !important; }

/* ---------- figuurtjes ---------- */
.fig { display: inline-block; line-height: 0; transform-origin: 50% 100%; }
.fig svg { display: block; width: 100%; height: auto; overflow: visible; }
.fig.wiebel { animation: wiebel .45s ease; }
@keyframes wiebel { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg) translateY(-4px); } 60% { transform: rotate(5deg); } }

/* ---------- start ---------- */
.start-binnen {
  margin: auto; width: 100%; max-width: 420px;
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: 8px 0;
}
.start-figuren { display: flex; gap: 22px; align-items: flex-end; justify-content: center; margin-bottom: 4px; }
.start-figuren .fig { width: 92px; }
.titel { margin: 6px 0 4px; font-size: clamp(34px, 11vw, 46px); line-height: 1.02; font-weight: 800; letter-spacing: -.01em; }
.titel span { font-weight: 500; font-size: .62em; color: var(--grijs); }
.ondertitel { margin: 6px 0 22px; font-size: 18px; line-height: 1.35; color: #45454c; max-width: 300px; }
.start-form { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.label { font-size: 15px; color: #55555c; }
#naam {
  width: 100%; max-width: 340px; min-height: 56px;
  padding: 12px 16px; text-align: center;
  font-size: 20px; /* ≥ 16px: geen zoom in iOS */
  color: var(--inkt); background: var(--wit);
  border: 3px solid var(--inkt); border-radius: 16px; outline: none;
}
#naam:focus { border-color: var(--paars-diep); box-shadow: 0 0 0 4px rgba(176, 124, 255, .25); }
.kleintje { margin: 22px 0 0; font-size: 13px; color: #85858c; }

/* ---------- intro-kaartje ---------- */
.intro-binnen {
  margin: auto; width: 100%; max-width: 420px;
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: 6px 0;
}
.intro-kop { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--grijs); }
.intro-podium {
  position: relative; width: 100%; max-width: 320px; height: 168px; margin: 10px 0 4px;
  display: flex; align-items: flex-end; justify-content: center;
  border-bottom: 3px solid var(--inkt);
}
.intro-podium .fig { width: 112px; margin-bottom: -3px; cursor: pointer; }
.intro-podium .wolk {
  position: absolute; left: 50%; top: 4px; transform: translateX(10px);
  font-size: 14px; color: #77777e; font-style: italic;
}
.intro-verhaal { margin: 14px 0 8px; font-size: 19px; line-height: 1.4; font-weight: 600; max-width: 360px; }
.intro-regel { margin: 0 0 10px; font-size: 16px; line-height: 1.4; color: #3c3c43; max-width: 340px; }
.intro-qaly { margin: 0 0 18px; font-size: 14.5px; line-height: 1.4; color: #6a6a72; max-width: 340px; }
.intro-qaly:empty { display: none; }

/* ---------- race ---------- */
#scherm-race { padding: 0; overflow: hidden; font-family: var(--font); }
.race-kop {
  flex: none;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(var(--veilig-boven) + 8px) calc(var(--veilig-rechts) + 62px) 2px calc(var(--veilig-links) + 16px);
  min-height: calc(var(--veilig-boven) + 56px);
}
.klok { font-size: 26px; font-weight: 800; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.klok small { font-size: 17px; font-weight: 600; color: rgba(255, 255, 255, .65); margin-left: 4px; }
.qaly { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
.qaly-label { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: rgba(255, 255, 255, .55); }
.qaly-getal { font-size: 26px; font-weight: 800; min-width: 3ch; text-align: right; transition: color .3s; }
.qaly.plus .qaly-getal { color: var(--groen); }
.qaly.min .qaly-getal { color: var(--koraal); }

.race-rij {
  flex: none; min-height: 34px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 0 calc(var(--veilig-rechts) + 16px) 4px calc(var(--veilig-links) + 16px);
  font-size: 14px; color: rgba(255, 255, 255, .78);
}
.lever { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.lever-icoon { width: 22px; height: 17px; color: #c9785b; flex: none; }
.lever-tekst { font-variant-numeric: tabular-nums; }
.lever-meter { position: relative; width: 70px; height: 10px; border-radius: 6px; background: rgba(255, 255, 255, .14); overflow: hidden; flex: none; }
.lever-vul { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--geel); border-radius: 6px; transition: width .3s ease, background .3s; }
.lever-max { position: absolute; top: 0; bottom: 0; left: 80%; width: 2px; background: rgba(255, 255, 255, .7); }
.lever.vol .lever-vul { background: var(--koraal); }
.lever.vol { color: var(--koraal); animation: knipper 1s ease 3; }
.lever.vol .lever-icoon { color: var(--koraal); }
@keyframes knipper { 50% { opacity: .35; } }
.patient { display: flex; align-items: center; gap: 8px; margin-left: auto; white-space: nowrap; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
  font-size: 12.5px; font-weight: 700; background: rgba(255, 159, 67, .18); color: #ffb067;
  animation: inploppen .4s ease;
}
@keyframes inploppen { from { transform: scale(.5); opacity: 0; } }

.podium { position: relative; flex: 1 1 auto; min-height: 0; }
#doek { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.melding {
  position: absolute; left: 50%; bottom: 7%;
  width: min(92%, 380px); transform: translate(-50%, 8px);
  text-align: center; font-size: 19px; line-height: 1.35; font-weight: 600;
  color: var(--wit); text-shadow: 0 1px 12px #000, 0 0 3px #000;
  opacity: 0; transition: opacity .25s ease, transform .25s ease;
  pointer-events: none;
  padding: 10px 12px; border-radius: 16px;
  background: radial-gradient(ellipse at center, rgba(0, 0, 0, .92) 45%, rgba(0, 0, 0, 0) 72%);
}
.melding.zicht { opacity: 1; transform: translate(-50%, 0); }
.melding.wending { font-size: 21px; }
.melding .m-fig { width: 64px; margin: 0 auto 6px; }
.melding .m-fig svg { width: 100%; height: auto; }
.melding.au { color: #ffd2cc; }
.melding.alarm { color: #ffc2b8; }
.melding.grap { color: #e5d4ff; }

.finish {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  background: rgba(0, 0, 0, .62);
  animation: infaden .5s ease;
  text-align: center;
}
@keyframes infaden { from { opacity: 0; } }
.finish-kop { margin: 0 0 8px; font-size: 16px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--paars); }
.finish-label { margin: 0; font-size: 15px; color: rgba(255, 255, 255, .7); }
.finish-getal { margin: 0 0 22px; font-size: 64px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }

/* knoppen onderin */
.knoppen {
  flex: none;
  display: flex; gap: 8px;
  padding: 8px calc(var(--veilig-rechts) + 12px) calc(var(--veilig-onder) + 12px) calc(var(--veilig-links) + 12px);
  background: linear-gradient(to bottom, rgba(0, 0, 0, 0), #000 30%);
}
.actie {
  position: relative; flex: 1 1 0; min-width: 48px; min-height: 76px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  padding: 6px 2px;
  background: #121219; color: var(--wit);
  border: 2px solid rgba(255, 255, 255, .16); border-radius: 18px;
  font-size: 14px; font-weight: 600;
  transition: transform .09s ease, background .15s, border-color .15s, opacity .2s;
}
.actie svg { width: 34px; height: 34px; pointer-events: none; }
.actie span { pointer-events: none; }
.actie:active, .actie.tik { transform: scale(.92); }
.actie.gekozen {
  background: rgba(176, 124, 255, .26); border-color: var(--paars);
  box-shadow: 0 0 0 3px rgba(176, 124, 255, .22), 0 0 22px rgba(176, 124, 255, .45);
}
.actie.gekozen::after {
  content: attr(data-badge);
  position: absolute; top: -9px; right: -4px;
  min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px;
  display: grid; place-items: center;
  background: var(--paars); color: #120a20; font-size: 12.5px; font-weight: 800;
}
.actie.geblokkeerd { opacity: .55; border-style: dashed; border-color: rgba(255, 255, 255, .3); background: #0b0b10; }
.actie.geblokkeerd svg { filter: grayscale(1); opacity: .6; }
.actie.geblokkeerd::before {
  content: ""; position: absolute; left: 14%; right: 14%; top: 50%; height: 3px; margin-top: -14px;
  background: var(--koraal); transform: rotate(-24deg); border-radius: 2px;
}
.actie.schud { animation: schud .35s ease; }
@keyframes schud { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

@media (min-height: 760px) {
  .actie { min-height: 84px; font-size: 15px; }
  .melding { font-size: 20px; }
}
@media (min-width: 700px) {
  #scherm-race .race-kop, #scherm-race .race-rij, #scherm-race .knoppen { padding-left: max(16px, calc(50% - 260px)); padding-right: max(62px, calc(50% - 260px)); }
}
@media (prefers-reduced-motion: reduce) {
  .scherm, .melding, .lever-vul { transition: none; }
  .fig.wiebel, .actie.schud, .lever.vol { animation: none; }
}

</style>
<style data-bron="src/tutorial.css">
/* Slikken of Stikken — src/tutorial.css (PLACEHOLDER). Prefix .tut- ; gedeelde stijl staat in style.css. */
.tut-binnen {
  margin: auto; width: 100%; max-width: 420px;
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px;
}
.tut-podium { width: 100%; max-width: 300px; display: flex; justify-content: center; border-bottom: 3px solid var(--inkt); }
.tut-podium .fig { width: 120px; margin-bottom: -3px; }
.tut-kop { margin: 18px 0 14px; font-size: 34px; font-weight: 800; }

</style>
<style data-bron="src/einde.css">
/* Slikken of Stikken — src/einde.css (PLACEHOLDER). Prefix .eind- ; gedeelde stijl staat in style.css. */
.eind-binnen {
  margin: auto; width: 100%; max-width: 420px;
  display: flex; flex-direction: column; align-items: center; text-align: center;
}
.eind-naam { margin: 0; font-size: 40px; font-weight: 800; line-height: 1.1; word-break: break-word; }
.eind-label { margin: 18px 0 0; font-size: 16px; color: #66666d; }
.eind-totaal { margin: 0 0 14px; font-size: 64px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
.eind-races { list-style: none; margin: 0 0 18px; padding: 0; width: 100%; max-width: 340px; }
.eind-race {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 10px 4px; border-bottom: 2px solid #e4e2dc; font-size: 18px;
}
.eind-race b { font-size: 22px; font-variant-numeric: tabular-nums; }
.eind-vraag { margin: 6px 0 22px; font-size: 18px; font-weight: 600; max-width: 330px; line-height: 1.35; }

</style>
</head>
<body>
<div id="app">

  <!-- 1. Start: speelnaam + Start (EoT-stijl, wit) -->
  <section id="scherm-start" class="scherm wit" data-scherm="start" aria-labelledby="titel">
    <div class="start-binnen">
      <div class="start-figuren" aria-hidden="true">
        <div class="fig" data-fig="opa"></div>
        <div class="fig" data-fig="vries"></div>
      </div>
      <h1 id="titel" class="titel">Slikken <span>of</span> Stikken</h1>
      <p class="ondertitel">Houd de spiegel van een geneesmiddel in de goede zone.</p>
      <form id="start-form" class="start-form" autocomplete="off" novalidate>
        <label for="naam" class="label">Jouw speelnaam</label>
        <input id="naam" name="naam" data-veld="naam" type="text" maxlength="16" placeholder="bv. Pilpiraat" enterkeyhint="go" autocapitalize="words" spellcheck="false">
        <button type="submit" class="knop-wit groot" data-actie="start">Start</button>
      </form>
      <p class="kleintje">Vereenvoudigd model voor onderwijs. Geen doseeradvies.</p>
    </div>
  </section>

  <!-- 2. Tutorial (module src/tutorial.js vult dit) -->
  <section id="scherm-tutorial" class="scherm wit" data-scherm="tutorial"></section>

  <!-- 3. Intro-kaartje per race (EoT-stijl) -->
  <section id="scherm-intro" class="scherm wit" data-scherm="intro">
    <div class="intro-binnen">
      <p class="intro-kop" id="intro-kop">Race 1</p>
      <div class="intro-podium" id="intro-fig" aria-hidden="true"></div>
      <p class="intro-verhaal" id="intro-verhaal"></p>
      <p class="intro-regel" id="intro-regel"></p>
      <p class="intro-qaly" id="intro-qaly"></p>
      <button type="button" class="knop-wit groot" data-actie="start-race">Start race</button>
    </div>
  </section>

  <!-- 4. Race (Universe-Forecast-stijl, zwart) -->
  <section id="scherm-race" class="scherm zwart" data-scherm="race">
    <header class="race-kop">
      <div class="klok" id="klok" aria-live="off">Uur 0</div>
      <div class="qaly" id="qaly"><span class="qaly-label">QALY</span><span class="qaly-getal" id="qaly-getal">0</span></div>
    </header>
    <div class="race-rij" id="race-rij">
      <div class="lever" id="lever" hidden>
        <svg class="lever-icoon" viewBox="0 0 32 24" aria-hidden="true"><path d="M3 9c0-5 6-7 13-7 7 0 13 2 13 5 0 6-8 15-16 15C7 22 3 15 3 9z" fill="currentColor"/></svg>
        <span class="lever-tekst" id="lever-tekst">0 g van max. 4 g</span>
        <span class="lever-meter" aria-hidden="true"><span class="lever-vul" id="lever-vul"></span><span class="lever-max"></span></span>
      </div>
      <div class="patient" id="patient"></div>
    </div>
    <div class="podium" id="podium">
      <canvas id="doek" aria-label="Tijdlijn met de spiegel"></canvas>
      <div class="melding" id="melding" role="status" aria-live="polite"></div>
      <div class="finish" id="finish" hidden>
        <p class="finish-kop">Race klaar</p>
        <p class="finish-label">QALY-punten</p>
        <p class="finish-getal" id="finish-getal">0</p>
        <button type="button" class="knop-paars" data-actie="verder">Verder</button>
      </div>
    </div>
    <nav class="knoppen" id="knoppen" aria-label="Kies vóór het poortje"></nav>
  </section>

  <!-- 5. Einde (module src/einde.js vult dit) -->
  <section id="scherm-einde" class="scherm wit" data-scherm="einde"></section>

</div>

<button type="button" id="demp" class="demp" data-actie="demp" aria-label="Geluid uit" aria-pressed="false"></button>

<script data-bron="src/model.js">
/*
 * Slikken of Stikken — src/model.js  (rekenmodel §4 + casusdata §5 uit docs/bouwopdracht.md)
 * Puur JS, geen DOM. Browser: <script src="model.js"> zet alleen window.SoS.model.
 * Node: const M = require('./src/model.js').
 *
 * PUBLIEKE API (voor UI- en scorebouwers)
 * ---------------------------------------
 * M.CASUSSEN.paracetamol / M.CASUSSEN.lithium   Casusdata, letterlijk uit het casusblad (zie onder).
 * M.casus(id)                       -> casusobject (id 'paracetamol' | 'lithium', of een object zelf).
 * M.venster(casus, t)               -> {laag, hoog}: therapeutisch venster op tijdstip t (uur).
 *                                      Komt uit casus.venster (reeks [{vanaf, laag, hoog}], stapsgewijs);
 *                                      nu constant, later schuivend (opiaten). hoog = Infinity = geen bovengrens.

    var dubbelNa = naRijen.filter(function (r) { return tabl(r) >= 2; }).length;
    var dubbel = dubbelVoor + dubbelNa;

    if (teller.uren.onder > 0 && wegVoor > 0 && (teller.voor.onder > 0 || wegNa > 0)) {

        : 'Jij sloeg vóór de ibuprofen ' + wegVoor + ' van de ' + voorRijen.length + ' doses over';
      return { regel: 'overgeslagenOnder',
        zin: waar + ' en de spiegel zakte onder de 0,6. Kans op terugval: somber of juist ontremd.' };
    }
    if (wegNa > 0 && teller.na.onder > 0) return { regel: 'naIbuTeVeelWeg',
      zin: 'Jij liet na de ibuprofen ' + pct(wegNa / naRijen.length) + ' van de doses weg en de spiegel zakte ' +
        'onder de 0,6. In het echt verlaagt de arts de dosis en laat de spiegel prikken: zelf pillen overslaan ' +
        'is geen goed idee.' };
    if (dubbel && teller.uren.boven > 0) return { regel: 'dubbel',
      zin: dubbelNa
        ? 'Jij gaf na de ibuprofen ' + keer(dubbelNa) + ', terwijl de nieren al minder opruimden: de spiegel ' +
          'kwam boven de 1,0. Bij lithium nooit dubbel innemen: te veel geeft trillen, misselijkheid en diarree.'
        : 'Jij gaf ' + keer(dubbelVoor) + ' en de spiegel kwam boven de 1,0. ' +
          'Bij lithium nooit dubbel innemen: te veel geeft trillen, misselijkheid en diarree.' };
    if (wegNa > 0 && naZone >= 0.9 && naBoven < 0.05) return { regel: 'naIbuMinder',
      zin: 'Jij liet na de ibuprofen ' + pct(wegNa / naRijen.length) + ' van de doses weg. Dat was nodig, want ' +
        'de nieren ruimden minder op. In het echt verlaagt de arts de dosis en laat de spiegel prikken: pillen ' +
        'overslaan wordt makkelijk vergeten.' };
    if (naBoven >= 0.05) {
      if (wegNa > 0) return { regel: 'naIbuNogTeHoog',
        zin: 'Na de ibuprofen zat de spiegel ' + pct(naBoven) + ' van de tijd boven de 1,0, want de nieren ruimden ' +
          'minder op. In het echt verlaagt de arts de dosis en laat de spiegel prikken: zelf pillen overslaan is ' +
          'geen goed idee.' };
      return { regel: 'naIbuTeHoog',
        zin: 'Jij gaf na de ibuprofen gewoon alle doses en de spiegel kroop boven de 1,0, want de nieren ruimden ' +
          'minder op. In het echt: bij lithium liever paracetamol dan ibuprofen, en de spiegel laten prikken.' };
    }

  }

  return {
    versie: '1.0',
    PUNTEN: PUNTEN,
    UITLEG: UITLEG,
    REGELS: REGELS,
    tempo: tempo,
    maakTeller: maakTeller,
    maakRace: maakRace,
    scoreSchema: scoreSchema,
    verslag: verslag
  };
});

  // ---------- canvas ----------
  var doek = null, ctx = null, D = { w: 0, h: 0, dpr: 1 };
  var STERREN = [];

    function rnd() { z = (z * 16807) % 2147483647; return (z - 1) / 2147483646; } // vaste reeks
    for (var i = 0; i < 120; i++) {

    }

  function meetDoek() {
    doek = $('doek');
    if (!doek) return;
    ctx = doek.getContext('2d');
    var r = doek.getBoundingClientRect();
    D.dpr = Math.min(root.devicePixelRatio || 1, 2.5);
    D.w = Math.max(1, r.width); D.h = Math.max(1, r.height);
    doek.width = Math.round(D.w * D.dpr); doek.height = Math.round(D.h * D.dpr);
    ctx.setTransform(D.dpr, 0, 0, D.dpr, 0, 0);

      R.pxPerUur = gat / R.casus.poortjes.interval;
      R.yNu = Math.round(D.h * 0.55);
      R.links = 18; R.rechts = 18;
    }
  }

  function xVan(C) {
    var b = D.w - R.links - R.rechts;
    return R.links + Math.max(0, Math.min(1, C / R.cfg.Cmax)) * b;
  }
  function yVan(t) { return R.yNu + (t - R.klok) * R.pxPerUur; }

    var v = M.venster(R.casus, t);

  }
  var LIJNKLEUR = { zone: '#7ef0c4', onder: '#ff8f80', boven: '#ffb067', tox: '#ff5a5a' };
  function lijnKleur(C, t) {
    if (R.casus.toxisch != null && C > R.casus.toxisch) return LIJNKLEUR.tox;
    return LIJNKLEUR[zoneVan(C, t)];
  }

  function teken(nu) {
    if (!ctx || !R) return;
    var c = R.casus, w = D.w, h = D.h, L = R.links, Rr = w - R.rechts;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);

    // sterretjes (schuiven mee omhoog met de tijd, rustig)
    var schuif = R.klok * R.pxPerUur;
    for (var i = 0; i < STERREN.length; i++) {
      var st = STERREN[i];
      var y = ((st.y * h - schuif * st.p) % h + h) % h;
      ctx.globalAlpha = st.a * (0.75 + 0.25 * Math.sin(nu / 900 + st.f));
      ctx.fillStyle = st.k;
      if (st.vierkant) ctx.fillRect(st.x * w, y, st.r * 1.6, st.r * 2.6);
      else { ctx.beginPath(); ctx.arc(st.x * w, y, st.r, 0, 6.283); ctx.fill(); }
    }

    // therapeutische zone als verticale baan (venster(casus, t): later verschuifbaar)
    var stappen = 24, dy = h / stappen, links = [], rechts = [];
    for (var s = 0; s <= stappen; s++) {
      var yy = s * dy, v = M.venster(c, tVan(yy));
      links.push([xVan(v.laag), yy]);
      rechts.push([v.hoog === Infinity ? Rr : xVan(v.hoog), yy]);
    }
    ctx.fillStyle = 'rgba(61,220,151,0.10)';
    ctx.beginPath();
    links.forEach(function (p, j) { if (j) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]); });
    for (var j2 = rechts.length - 1; j2 >= 0; j2--) ctx.lineTo(rechts[j2][0], rechts[j2][1]);
    ctx.closePath(); ctx.fill();
    // de streep (ondergrens) helder
    ctx.strokeStyle = 'rgba(61,220,151,0.75)'; ctx.lineWidth = 2;
    ctx.beginPath();
    links.forEach(function (p, j) { if (j) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]); });
    ctx.stroke();
    if (rechts[0][0] < Rr) {
      ctx.strokeStyle = 'rgba(61,220,151,0.35)'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      rechts.forEach(function (p, j) { if (j) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]); });
      ctx.stroke();
    }
    if (c.toxisch != null) {
      var xt = xVan(c.toxisch);
      ctx.fillStyle = 'rgba(255,80,80,0.09)';
      ctx.fillRect(xt, 0, Rr - xt, h);

      ctx.setLineDash([4, 5]);

    }

    // onthulde gebeurtenissen in de tijdlijn

      if (!R.onthuld[gi]) return;
      if (g.type === 'blokkade') {
        var y1 = yVan(g.van), y2 = yVan(g.tot);
        if (y2 < 0 || y1 > h) return;
        ctx.fillStyle = 'rgba(190,230,90,0.07)';
        ctx.fillRect(0, y1, w, y2 - y1);
        ctx.fillStyle = 'rgba(200,235,120,0.9)';
        ctx.fillRect(4, y1, 3, y2 - y1);
        ctx.font = '600 12px ' + FONT;
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        var ym = Math.max(y1 + 6, 48);

      } else if (g.type === 'klaring') {
        var yk = yVan(g.t);
        if (yk > h) return;
        ctx.fillStyle = 'rgba(255,159,67,0.06)';
        ctx.fillRect(0, Math.max(0, yk), w, h - Math.max(0, yk));
        if (yk > -20) {
          ctx.strokeStyle = 'rgba(255,159,67,0.8)'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(0, yk); ctx.lineTo(w, yk); ctx.stroke();
        }
        ctx.fillStyle = 'rgba(255,176,103,0.95)';
        ctx.font = '600 12px ' + FONT;
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        var yl = Math.max(yk + 6, 48);
        tekenIcoon(ctx, 'doosje', 20, yl + 7, 18);
        ctx.fillText('ibuprofen', 32, yl);
      }
    });

    // paarse poortjes
    ctx.font = '700 15px ' + FONT;
    ctx.textBaseline = 'middle';
    for (var g = 0; g < R.poorten.length; g++) {
      var T = R.poorten[g], yg = yVan(T);
      if (yg < -30 || yg > h + 30) continue;
      var verleden = g < R.g, doel = g === R.g;
      var label = tijdLabel(c, T, true);
      var tw = ctx.measureText(label).width;
      var icoonSoort = null, aantal = 1;
      if (doel && R.keuze.route) { icoonSoort = R.keuze.route === 'slik' ? 'tablet' : R.keuze.route; aantal = R.keuze.aantal; }
      else if (doel && R.keuze.poging) icoonSoort = 'kruis';
      else if (verleden && R.gegeven[g]) {
        var gg = R.gegeven[g];
        icoonSoort = gg.soort === 'slik' ? 'tablet' : (gg.soort === 'geblokkeerd' ? 'kruis' : (gg.soort === 'leeg' ? null : gg.soort));
        aantal = gg.aantal || 1;
      }
      var extra = icoonSoort ? 30 + (aantal > 1 ? 18 : 0) : 0;
      var cx = w / 2, l1 = cx - tw / 2 - 12, r1 = cx + tw / 2 + 12 + extra;
      var a = verleden ? 0.3 : (doel ? 1 : 0.6);
      // in de verte vervagen
      if (yg > h - 60) a *= Math.max(0, (h - yg) / 60) * 0.8 + 0.2;
      if (yg < 64) a *= Math.max(0, (yg - 20) / 44);
      if (a <= 0.01) continue;
      ctx.globalAlpha = a;
      ctx.strokeStyle = KLEUR.paars; ctx.lineWidth = doel ? 2 : 1.25;
      ctx.beginPath(); ctx.moveTo(L - 6, yg); ctx.lineTo(l1, yg); ctx.moveTo(r1, yg); ctx.lineTo(Rr + 6, yg); ctx.stroke();
      if (doel) { ctx.shadowColor = 'rgba(176,124,255,0.9)'; ctx.shadowBlur = 12; }
      ctx.fillStyle = doel ? '#c9a4ff' : KLEUR.paars;
      ctx.textAlign = 'center';
      ctx.fillText(label, cx, yg + 0.5);
      ctx.shadowBlur = 0;
      if (icoonSoort) {
        var ix = cx + tw / 2 + 12 + 14;
        var pop = 1;
        if (doel && R.kiesT0) { var dtk = (nu - R.kiesT0) / 160; if (dtk < 1) pop = 1 + 0.35 * Math.sin(dtk * Math.PI); }
        tekenIcoon(ctx, icoonSoort, ix, yg, 26 * pop);
        if (aantal > 1) {
          ctx.font = '800 13px ' + FONT; ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
          ctx.fillText(aantal + '×', ix + 14, yg + 1);
          ctx.font = '700 15px ' + FONT;
        }
      }
      ctx.globalAlpha = 1;
    }

    // de spiegel: lijn van boven (verleden) naar de nu-lijn
    var tBoven = tVan(-10);
    var reeks = R.voorgeschiedenis.concat(R.monsters);
    var start = 0;
    while (start < reeks.length - 1 && reeks[start + 1].t < tBoven) start++;
    if (reeks.length - start >= 2) {
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      // gloed
      ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 9;
      ctx.beginPath();
      for (var m = start; m < reeks.length; m++) {
        var px = xVan(reeks[m].C), py = yVan(reeks[m].t);
        if (m === start) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
      // kleur per stuk (in de zone groen, eronder koraal)
      ctx.lineWidth = 3;
      var kleur = null, xv = 0, yv = 0;
      for (var n = start; n < reeks.length; n++) {
        var p = reeks[n], k2 = lijnKleur(p.C, Math.max(0, p.t));
        var x2 = xVan(p.C), y2b = yVan(p.t);
        if (k2 !== kleur) {
          // het stuk naar een nieuwe toestand krijgt de kleur van die toestand (spuit-sprong = nieuwe kleur)
          if (kleur) ctx.stroke();
          ctx.strokeStyle = k2; ctx.beginPath();
          if (kleur) { ctx.moveTo(xv, yv); ctx.lineTo(x2, y2b); } else ctx.moveTo(x2, y2b);
          kleur = k2;
        } else ctx.lineTo(x2, y2b);
        xv = x2; yv = y2b;
      }
      if (kleur) ctx.stroke();
    }

    // nu-lijn
    var yN = R.yNu;
    ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 1;
    ctx.setLineDash([3, 6]);
    ctx.beginPath(); ctx.moveTo(0, yN); ctx.lineTo(w, yN); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.font = '600 11px ' + FONT;
    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    ctx.fillText('nu', Rr + 4, yN - 4);

    var C = R.race.sim.C, tm = Math.max(0, R.race.t);
    var xD = xVan(C);

    // opnamedepot ("onderweg"): vertraging van slikken/zetpil zichtbaar
    var ref = c.routes.slik.dosis * c.routes.slik.F;
    var dep = R.race.sim.depot / ref;
    if (dep > 0.03) {
      var rB = 5 + 13 * Math.sqrt(Math.min(1.6, dep));
      var xB = L + 20;
      if (Math.abs(xB - xD) < rB + 14) xB = Math.min(Rr - 20, xD + rB + 26);
      ctx.strokeStyle = 'rgba(255,225,161,0.55)'; ctx.lineWidth = 2;
      ctx.setLineDash([2, 5]); ctx.lineDashOffset = -(nu / 40) % 7 * (xD > xB ? 1 : -1);
      ctx.beginPath(); ctx.moveTo(xB, yN); ctx.lineTo(xD, yN); ctx.stroke();
      ctx.setLineDash([]); ctx.lineDashOffset = 0;
      ctx.fillStyle = 'rgba(255,225,161,0.22)';
      ctx.beginPath(); ctx.arc(xB, yN, rB, 0, 6.283); ctx.fill();
      ctx.strokeStyle = 'rgba(255,225,161,0.8)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = 'rgba(255,225,161,0.85)'; ctx.font = '600 11px ' + FONT;
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText('onderweg', xB, yN + rB + 4);
    }

    // effecten
    R.effecten = R.effecten.filter(function (e) {
      var dt = (nu - e.t0) / 1000;
      if (e.type === 'spuit') {
        if (dt > 0.9) return false;
        var f = Math.min(1, dt / 0.12);
        ctx.strokeStyle = 'rgba(160,215,255,' + (0.9 * (1 - dt / 0.9)) + ')';
        ctx.lineWidth = 6 * (1 - dt / 0.9) + 1;
        ctx.beginPath(); ctx.moveTo(e.xVan, yN); ctx.lineTo(e.xVan + (e.xNaar - e.xVan) * f, yN); ctx.stroke();
        ctx.strokeStyle = 'rgba(200,235,255,' + (1 - dt / 0.9) + ')'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(e.xNaar, yN, 8 + dt * 70, 0, 6.283); ctx.stroke();
        return true;
      }
      if (e.type === 'slik') {
        if (dt > 0.7) return false;
        var q = dt / 0.7, ex = w / 2 + 40 + (e.xNaar - (w / 2 + 40)) * q;
        tekenIcoon(ctx, e.soort, ex, yN - 6 * Math.sin(q * Math.PI), 26 * (1 - 0.6 * q), 1 - q * 0.7);

      }
      if (e.type === 'lever') {
        if (dt > 1.2) return false;
        ctx.fillStyle = 'rgba(255,80,80,' + (0.22 * (1 - dt / 1.2)) + ')';
        ctx.fillRect(0, 0, w, h);
        return true;
      }
      if (e.type === 'au') {
        if (dt > 0.6) return false;
        ctx.strokeStyle = 'rgba(255,111,97,' + (1 - dt / 0.6) + ')'; ctx.lineWidth = 3;

      }

    // de stip (nu)
    var kl = lijnKleur(C, tm);
    var gr = ctx.createRadialGradient(xD, yN, 0, xD, yN, 20);
    gr.addColorStop(0, kl); gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.55; ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(xD, yN, 20, 0, 6.283); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = kl; ctx.beginPath(); ctx.arc(xD, yN, 6.5, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    if (C > R.cfg.Cmax) { // buiten beeld: pijltje
      ctx.fillStyle = kl;
      ctx.beginPath(); ctx.moveTo(xD + 9, yN - 6); ctx.lineTo(xD + 16, yN); ctx.lineTo(xD + 9, yN + 6); ctx.fill();
    }
    // waarde bij de stip
    var waarde = c.id === 'lithium' ? getal(C, 2) + ' mmol/L' : getal(C, 1) + ' mg/L';
    ctx.font = '600 12.5px ' + FONT; ctx.textBaseline = 'top';
    var wv = ctx.measureText(waarde).width;
    var xl = xD + 12;
    ctx.textAlign = 'left';
    if (xl + wv > Rr) { xl = xD - 12; ctx.textAlign = 'right'; }
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText(waarde, xl, yN + 9);

    // rand boven: as-labels; rand onder: vervagen naar de knoppen
    var gb = ctx.createLinearGradient(0, 0, 0, 44);
    gb.addColorStop(0, 'rgba(0,0,0,0.95)'); gb.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gb; ctx.fillRect(0, 0, w, 44);

    ctx.font = '600 12px ' + FONT; ctx.textBaseline = 'top';
    R.cfg.ticks.forEach(function (tk) {
      var xt = xVan(tk.C);
      ctx.fillStyle = tk.streep ? 'rgba(126,240,196,0.95)' : 'rgba(255,255,255,0.5)';
      ctx.textAlign = tk.C === 0 ? 'left' : (tk.rechts ? 'right' : 'center');

    ctx.font = '700 11px ' + FONT;
    ctx.fillText(R.cfg.zoneLabel.toUpperCase(), (zl + zr) / 2 + (v0.hoog === Infinity ? 12 : 0), 23);
    if (R.cfg.toxLabel) {
      ctx.fillStyle = 'rgba(255,120,110,0.9)';
      ctx.fillText(R.cfg.toxLabel.toUpperCase(), (xVan(c.toxisch) + Rr) / 2, 23);

  }

  // ---------- spelklok ----------
  function lus(ts) {
    if (!R || R.klaar) return;
    R.rafId = root.requestAnimationFrame(lus);
    if (doc.hidden) { R.laatsteTs = null; return; }
    if (R.laatsteTs == null) R.laatsteTs = ts;
    var dtEcht = Math.min(0.25, Math.max(0, (ts - R.laatsteTs) / 1000));
    R.laatsteTs = ts;
    R.klok += dtEcht * SPEED / R.cfg.secPerUur;
    var c = R.casus, race = R.race, duur = c.raceDuur;

    // poortjes die we passeren: precies op de poortjestijd toepassen
    while (R.g < R.poorten.length && R.poorten[R.g] <= R.klok + 1e-9) {
      var T = R.poorten[R.g];
      race.naar(T);
      neemMonster(true);
      pasPoortjeToe(R.g);
      R.g++;
      bijNieuwDoel();
    }
    if (R.klok >= 0) race.naar(Math.min(R.klok, duur));
    neemMonster(false);
    controleerZone();
    controleerGebeurtenissen();
    werkKopBij();
    teken(performance.now());

    if (R.klok >= duur && race.klaar) eindeRace();
  }

  function neemMonster(forceer) {
    var t = R.race.t, C = R.race.sim.C;
    if (R.klok < 0) return;
    var laatste = R.monsters[R.monsters.length - 1];
    if (forceer || !laatste || t - laatste.t >= R.cfg.monster) R.monsters.push({ t: t, C: C });
    while (t >= R.volgendDun - 1e-9) {
      R.dun.push({ t: Math.round(t * 1000) / 1000, C: C });
      R.volgendDun += R.cfg.dun;
    }
    // alleen bewaren wat nog in beeld kan komen
    var grens = R.klok - (R.yNu + 40) / R.pxPerUur;
    var weg = 0;
    while (weg < R.monsters.length - 2 && R.monsters[weg + 1].t < grens) weg++;
    if (weg > 200) R.monsters.splice(0, weg);
  }

  function pasPoortjeToe(g) {
    var c = R.casus, race = R.race, k = R.keuze, T = R.poorten[g];
    var uit = { soort: 'leeg', aantal: 0 };
    var nu = performance.now();
    if (k.poging) { race.geef('slik', { index: g }); uit.soort = 'geblokkeerd'; }
    if (k.route && k.route !== 'niets') {
      var Cvoor = race.sim.C;
      var res = race.geef(k.route, { aantal: k.aantal || 1, index: g });
      if (res.ok) {
        uit.soort = k.route; uit.aantal = res.aantal;
        R.monsters.push({ t: T, C: race.sim.C });
        if (k.route === 'spuit') {
          speel('spuit');
          R.effecten.push({ type: 'spuit', t0: nu, xVan: xVan(Cvoor), xNaar: xVan(race.sim.C) });
        } else {
          speel(k.route === 'zetpil' ? 'zetpil' : 'slik');
          var ref = c.routes.slik.dosis * c.routes.slik.F;
          var xB = R.links + 20;
          R.effecten.push({ type: 'slik', t0: nu, soort: k.route === 'slik' ? 'tablet' : 'zetpil', xNaar: xB, ref: ref });
        }
        if (res.lever < 0) {
          setTimeout(function () { speel('alarm'); }, 120);
          melding(c.lekentaal.boven, { soort: 'alarm', prio: 2, duur: 3 });
          R.effecten.push({ type: 'lever', t0: nu });
          var lv = $('lever'); lv.classList.remove('vol'); void lv.offsetWidth; lv.classList.add('vol');
        }
      } else if (res.reden === 'geblokkeerd') {
        uit.soort = 'geblokkeerd';
      }
    } else if (k.route === 'niets') {
      uit.soort = 'niets';
      speel('overslaan');
    } else if (!k.poging) {
      speel('poort');
    }
    R.gegeven[g] = uit;
    R.keuze = { route: null, aantal: 0, poging: false };
    werkKnoppenBij();
  }

  // Het volgende poortje is nu het doel: misschien is er een plotwending.
  function bijNieuwDoel() {
    var c = R.casus;
    if (R.g >= R.poorten.length) return;
    var T = R.poorten[R.g];
    c.gebeurtenissen.forEach(function (g, gi) {
      if (R.onthuld[gi] || g.type !== 'blokkade') return;
      if (T >= g.van - 1e-9 && T < g.tot - 1e-9) {
        R.onthuld[gi] = true;
        speel('wending');
        melding(g.tekst, { soort: 'wending', prio: 3, duur: 3.4, fig: figuur({ wie: 'opa', stemming: 'misselijk' }) });
        if (R.knoppen.slik) flits(R.knoppen.slik, 'schud');
      }
    });
    werkKnoppenBij();
  }

  function controleerGebeurtenissen() {
    var c = R.casus;
    c.gebeurtenissen.forEach(function (g, gi) {
      if (R.onthuld[gi] || g.type !== 'klaring') return;
      if (R.klok >= g.t - 1e-9) {
        R.onthuld[gi] = true;
        speel('wending');
        melding(g.tekst, { soort: 'wending', prio: 3, duur: 3.6, fig: figuur({ wie: 'vries', prop: 'doosje', stemming: 'neutraal' }) });
        $('patient').appendChild(el('span', { class: 'chip', html: icoon('doosje').replace('<svg', '<svg width="16" height="16"') + 'ibuprofen' }));
      }
    });
  }

  function controleerZone() {
    if (R.klok < 0) return;
    var c = R.casus, C = R.race.sim.C, t = R.race.t;
    var z = zoneVan(C, t);
    var tox = c.toxisch != null && C > c.toxisch;
    var vorig = R.toestand;
    if (vorig && z !== vorig) {
      if (z === 'onder') {
        speel('au');
        melding(c.lekentaal.onder, { soort: 'au', prio: 1, duur: 2.4 });
        R.effecten.push({ type: 'au', t0: performance.now(), x: xVan(C) });
      } else if (z === 'boven') {
        speel('alarm');
        melding(c.lekentaal.boven, { soort: 'alarm', prio: 1, duur: 2.8 });
      }
    }
    if (tox && !R.toxisch) {
      speel('alarm');
      melding(c.lekentaal.boven, { soort: 'alarm', prio: 2, duur: 2.8 });
    }
    R.toestand = z; R.toxisch = tox;
  }

  function werkKopBij() {
    var c = R.casus;
    var k = klokHtml(c, R.klok);
    if (k !== R.tekstKlok) { $('klok').innerHTML = k; R.tekstKlok = k; }
    var st = R.race.stand();
    var sc = getal(st.totaal, 0);
    if (sc !== R.tekstScore) { $('qaly-getal').textContent = sc; R.tekstScore = sc; }
    var trend = '';
    if (R.klok >= 0) {
      var tp = S.tempo(c, R.race.sim.C, R.race.t);
      var som = tp.zone + tp.laag + tp.hoog + tp.giftig;
      trend = som > 0 ? 'plus' : (som < -1e-9 ? 'min' : '');
    }
    if (trend !== R.trend) { $('qaly').className = 'qaly' + (trend ? ' ' + trend : ''); R.trend = trend; }
    if (c.bovengrens && c.bovengrens.type === 'dagteller' && st.dagteller !== R.dagteller) {
      R.dagteller = st.dagteller;
      var max = c.bovengrens.maxPer24u;
      $('lever-tekst').textContent = getalKort(st.dagteller / 1000, 1) + ' g van max. ' + getalKort(max / 1000, 1) + ' g';
      var vol = st.dagteller > max;
      $('lever-vul').style.width = (vol ? 100 : 100 * st.dagteller / (max * 1.25)) + '%';
      $('lever').classList.toggle('vol', vol);
    }
  }

  function eindeRace() {
    R.klaar = true;
    R.duurEcht = (performance.now() - R.startEcht) / 1000;
    root.cancelAnimationFrame(R.rafId);
    var st = R.race.stand();
    teken(performance.now());
    staat.verslagen[R.i] = R.race.verslag();
    staat.curves[R.i] = R.dun.slice();
    staat.duren = staat.duren || [];
    staat.duren[R.i] = R.duurEcht;
    speel('klaar');
    $('melding').classList.remove('zicht');
    $('finish-getal').textContent = getal(st.totaal, 0);
    $('finish').hidden = false;
  }

  function naRace() {
    if (!R || !R.klaar) return;
    var i = R.i;
    if (i === 0) toonIntro(1);
    else toonEinde();
  }

  // ------------------------------------------------------------------------------------------
  // 5. Einde (module)
  // ------------------------------------------------------------------------------------------
  function toonEinde() {
    var c = $('scherm-einde');
    c.innerHTML = '';
    naarScherm('einde');
    var races = staat.verslagen.slice(0, 2);
    var data = {
      naam: staat.naam,
      races: races,
      totaal: races.reduce(function (s, v) { return s + (v ? v.opbouw.totaal : 0); }, 0),
      curves: staat.curves.slice(0, 2),
      casussen: RACES.map(function (id) { return M.casus(id); })
    };
    if (!SoS.einde || typeof SoS.einde.toon !== 'function') return;
    var h = SoS.einde.toon(c, data, opnieuw);
    if (h && typeof h.stop === 'function') staat.moduleStop = h.stop;
  }

  function opnieuw() {
    if (staat.fase !== 'einde') return;
    staat.verslagen = []; staat.curves = []; staat.duren = [];
    startRace(0);
  }

  // ------------------------------------------------------------------------------------------
  // Debug (alleen-lezen) en init
  // ------------------------------------------------------------------------------------------
  Object.defineProperty(SoS, 'debug', {
    enumerable: true, configurable: false,
    get: function () {
      var r = R && (staat.fase === 'race1' || staat.fase === 'race2') ? R : null;
      var snap = {
        fase: staat.fase, naam: staat.naam, speed: SPEED,
        casus: r ? r.casus.id : null,
        t: r ? r.race.t : null,
        klok: r ? r.klok : null,
        C: r ? r.race.sim.C : null,
        score: r ? r.race.stand().totaal : null,
        dagteller: r ? r.race.stand().dagteller : null,
        klaar: r ? r.klaar : null,
        poortje: r && r.g < r.poorten.length ? {
          index: r.g, t: r.poorten[r.g], keuze: r.keuze.route, aantal: r.keuze.aantal,
          geblokkeerd: !!doelGeblokkeerd(), poging: r.keuze.poging
        } : null,
        gegeven: r ? r.gegeven.map(function (x) { return x ? x.soort + (x.aantal > 1 ? '×' + x.aantal : '') : null; }) : [],
        uitslag: staat.verslagen.map(function (v) { return v ? v.opbouw.totaal : null; }),
        duren: (staat.duren || []).slice()
      };
      return Object.freeze(snap);
    }
  });

  function initDemp() {
    var b = $('demp');
    function zet(m) {
      b.innerHTML = m ? DEMP_UIT : DEMP_AAN;
      b.setAttribute('aria-pressed', m ? 'true' : 'false');
      b.setAttribute('aria-label', m ? 'Geluid aan' : 'Geluid uit');
    }
    var snd = SoS.sound;
    zet(snd ? snd.isMuted() : false);
    if (snd && snd.onMuteChange) snd.onMuteChange(zet);
    b.addEventListener('click', function () {
      unlock();
      if (!snd) return;
      var m = snd.toggle();
      zet(m);
      if (!m) speel('tik');
    });
  }

  function init() {
    doc.body.classList.add('licht');
    initStart();
    initDemp();
    doc.addEventListener('pointerdown', unlock, true);
    doc.querySelector('[data-actie="start-race"]').addEventListener('click', function () {
      unlock();
      if (staat.fase !== 'intro1' && staat.fase !== 'intro2') return;
      speel('tik');
      startRace(staat.introIndex);
    });
    doc.querySelector('#finish [data-actie="verder"]').addEventListener('click', function () {
      unlock();
      speel('tik');
      naRace();
    });
    root.addEventListener('resize', function () { if (R && !R.klaar) meetDoek(); else if (R) { meetDoek(); teken(performance.now()); } });
    naarScherm('start');
  }

  if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', init);
  else init();
})(window);

</script>
</body>
