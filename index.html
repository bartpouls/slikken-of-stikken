      var now = ctx.currentTime;
      var gap = MIN_GAP[name] || 0.035;
      if (lastPlayed[name] !== undefined && now - lastPlayed[name] < gap) return false;
      lastPlayed[name] = now;

      prune(now);
      // dezelfde naam klinkt nog: oude stem afkappen (geen stapeling)
      for (var i = 0; i < voices.length; i++) {
        if (voices[i].name === name && !voices[i].stolen) { voices[i].stolen = true; steal(voices[i], now); }
      }
      var live = voices.filter(function (v) { return !v.stolen; });
      while (live.length >= MAX_VOICES) {
        var old = live.shift();
        old.stolen = true;
        steal(old, now);
      }

      voices.push(voice(ctx, master, noiseBuf, name, now + START));
      return true;
    } catch (e) {
      return false;
    }
  }

  // ---------- demp ----------
  function applyMute() {
    if (!ctx || !master) return;
    try {
      var now = ctx.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(master.gain.value, now);
      master.gain.linearRampToValueAtTime(muted ? 0 : MASTER, now + 0.02);
    } catch (e) { /* stil */ }
  }
  function setMuted(v) {
    muted = !!v;
    writeStore(muted);
    applyMute();
    for (var i = 0; i < listeners.length; i++) {
      try { listeners[i](muted); } catch (e) { /* luisteraar mag niet breken */ }
    }
    return muted;
  }

  function render(name) {
    try {
      var build = Object.prototype.hasOwnProperty.call(SOUNDS, name) && SOUNDS[name];
      if (!build || !OfflineCtor) return Promise.resolve(null);
      // Zelfde keten als play(). De compressor eerst 0,5 s laten inslingeren
      // (zoals live, waar de context al loopt), daarna het stuk vanaf het
      // aanroepmoment teruggeven, inclusief de START-vertraging.
      var sr = 44100, PRE = 0.5, LEN = 0.6;
      var oc = new OfflineCtor(1, Math.ceil(sr * (PRE + LEN)), sr);
      voice(oc, makeMaster(oc, MASTER), makeNoise(oc), name, PRE + START);
      var p = oc.startRendering();
      if (!p || !p.then) return Promise.resolve(null);
      return p.then(function (full) {
        var off = Math.round(PRE * sr), n = Math.ceil(LEN * sr);
        var out = oc.createBuffer(1, n, sr);
        out.getChannelData(0).set(full.getChannelData(0).subarray(off, off + n));
        return out;
      }, function () { return null; });
    } catch (e) {
      return Promise.resolve(null);
    }
  }

  var api = {
    names: NAMES.slice(),
    available: !!Ctor,
    unlock: unlock,
    play: play,
    isMuted: function () { return muted; },
    setMuted: setMuted,
    toggle: function () { return setMuted(!muted); },
    onMuteChange: function (fn) { if (typeof fn === 'function') listeners.push(fn); },
    voices: function () {
      if (!ctx) return 0;
      prune(ctx.currentTime);
      var n = 0, now = ctx.currentTime;
      for (var i = 0; i < voices.length; i++) if (!voices[i].stolen && voices[i].end > now) n++;
      return n;
    },
    _render: render
  };
  Object.defineProperty(api, 'muted', { get: function () { return muted; }, enumerable: true });
  NAMES.forEach(function (n) { api[n] = function () { return play(n); }; });

  SoS.sound = api;
})(typeof window !== 'undefined' ? window : null);

</script>
<script data-bron="src/tutorial.js">
/*
 * Slikken of Stikken — src/tutorial.js  (de oefenronde: alleen het draaiboek, geen tekencode)
 *
 * De tutorial IS het racescherm (§3 Flow stap 2, §6C): app.js start dezelfde race-motor als race 1
 * (zelfde tijdlijn, poortjes, knoppen, zone, streep, klok, QALY-stand, dagteller en levermeter) en legt
 * dit draaiboek ernaast. Dit bestand tekent niets en rekent niets: het zegt alleen wanneer de klok stilstaat,
 * welke knop gemarkeerd wordt en welke zin in beeld staat.
 *
 * SoS.tutorial = {
 *   casus     'paracetamol' (casusblad §5, casus 1)
 *   eind      spelklok (uur) waarop de oefenronde stopt en "Klaar?" verschijnt
 *   stappen   [{ op, zin, knop, poortje, daarna }]
 *       op       spelklok (uur) waarop de klok stilstaat (−Infinity = meteen bij het begin)
 *       zin      de ene zin die dan in beeld staat
 *       knop     de raceknop die gemarkeerd wordt ('slik' | 'zetpil' | 'spuit' | 'niets'); de klok loopt
 *                weer zodra de speler die knop tikt. De keuze geldt, net als in de race, voor het
 *                eerstvolgende poortje.
 *       poortje  index van dat poortje (controle: de motor weigert een draaiboek dat niet klopt)
 *       daarna   de ene zin die verschijnt op het moment dat het poortje de keuze uitvoert
 *   klaar     { kop, label, knop }: tekst op het eindkaartje (zelfde kaartje als "Race klaar" na een race)
 * }
 * De plotwendingen (misselijkheid, ibuprofen, geweigerde lithiumprik) zitten er bewust niet in: de
 * motor zet de blokkade van casus 1 in de oefenronde uit.
 *
 * Doses in de oefenronde: tablet (uur 0), spuit (uur 5), tablet (uur 9), zetpil (uur 13) = 4 × 1 g,
 * dus precies het dagmaximum uit het casusblad en nooit erboven. De zetpil op poortje 13 is
 * M.zetpil(13) uit de vaste reeks (F 0,35; ka 0,3 /u): een zwakke, zodat "nauwelijks" te zien is.
 * Zinnen bij "daarna" zijn de zinnen uit §3 Flow stap 2 van de bouwopdracht; "Au. De pijn komt terug."
 * komt uit het casusblad (de motor leest hem uit de casusdata).
 */
(function (root) {
  'use strict';
  if (!root) return;
  var SoS = root.SoS = root.SoS || {};
  SoS.tutorial = {
    casus: 'paracetamol',
    eind: 16,
    stappen: [
      { op: -Infinity, zin: 'Opa Jan heeft pijn: kies een tablet voor het eerste poortje.', knop: 'slik', poortje: 0,
        daarna: 'Een pil moet eerst door je maag.' },
      { op: 1.5, zin: 'De pijn is weg: kies Niets om een poortje over te slaan.', knop: 'niets', poortje: 2,
        daarna: 'Je lichaam ruimt het op: elke 2,5 uur is de helft weg.' },
      { op: 4.4, zin: 'lekentaal.onder', knop: 'spuit', poortje: 5,
        daarna: 'Een prik werkt meteen, maar zakt net zo hard.' },
      { op: 8.5, zin: 'Elke gram telt mee in de dagteller linksboven: kies weer een tablet.', knop: 'slik', poortje: 9,
        daarna: 'Meer is niet beter: boven 4 gram per dag raakt de lever beschadigd.' },
      { op: 12.5, zin: 'Slikken lukt niet altijd: kies nu een zetpil.', knop: 'zetpil', poortje: 13,
        daarna: 'Een zetpil: soms goed, soms nauwelijks. Daar kun je niet van op aan.' }
    ],
    klaar: { kop: 'Klaar?', label: 'QALY-punten in de oefenronde', knop: 'Race!' }
  };
})(typeof window !== 'undefined' ? window : null);

</script>
<script data-bron="src/einde.js">
/*
 * Slikken of Stikken — src/einde.js  (eindscherm + toedienverslag per race; §2, §3, §6B5, §6C)
 *
 * INTERFACE (houd deze vast; app.js roept alleen dit aan)
 * ----------------------------------------------------------
 *   SoS.einde.toon(container, data, opnieuw) -> {stop()}
 *     container  <section id="scherm-einde" class="scherm">: leeg en zichtbaar. Vul hem zelf.
 *     data = {
 *       naam:    speelnaam (string),
 *       races:   [verslag1, verslag2]  — precies race.verslag() uit src/score.js (zie de API daar:
 *                casus, opbouw.regels/totaal, tijdlijn, echtSchema, telling, uren, praktijk.zin),
 *                volgorde paracetamol, lithium,
 *       totaal:  som van races[i].opbouw.totaal (QALY-punten),
 *       curves:  [[{t, C}, ...], [{t, C}, ...]] — de gespeelde spiegel per race, uitgedund
 *                (paracetamol elke 0,1 u, lithium elke 1 u; t in uur), voor een mini-grafiekje,
 *       casussen: [SoS.model.casus('paracetamol'), SoS.model.casus('lithium')]
 *     }
 *     opnieuw()  Roep aan bij "Nog een keer" (één tik; knop data-actie="opnieuw"). app.js start dan
 *                meteen race 1 opnieuw, met dezelfde naam (tutorial en intro worden overgeslagen).
 *     stop()     Opruimen als het scherm weggaat.
 *   Eisen (§6B): naam en totaalscore ≥ 32 px; nabespreekvraag "Wat deed je toen je onder de streep zakte?".
 *
 * OPBOUW (één scrollend scherm in dezelfde stijl als de rest: zwart met sterren, witte tekst, paarse
 * markering; de mini-curves zien er net zo uit als de spiegel tijdens de race):
 *   1. Eindscherm (boven de vouw): speelnaam (36 px), totaal QALY-punten (72 px), per race een kaart met
 *      de QALY-punten en een tegelrij (één tegel per poortje, kleur = waar de spiegel tot het volgende
 *      poortje het meest zat: in de zone / te laag / te hoog / giftig; uit data.curves), de
 *      nabespreekvraag, een regel over het scorebord, "spelpunten, geen echte QALY's".
 *   2. Toedienverslag per race (data-verslag="0|1"): mini-curve, QALY-opbouw in vier regels + totaal,
 *      rooster met je toedieningen per poortje naast het echte schema, telling (toedienmomenten,
 *      totale dosis, dagteller), de praktijkzin en (lithium) de nabesprekingszin uit het casusblad.
 *   3. "Nog een keer" (data-actie="opnieuw") direct onder de nabespreekvraag; één tik.
 *   Dempknop (van app.js): rechtsboven zoals op de andere schermen, maar hij scrolt mee (nooit over tekst).
 *   Tegels = lijnkleuren van de race; ibuprofen oranje (zoals in de race);
 *   labels "Uur 0" / "Dag 5" zoals in de race; "≠" = neutraal grijs "anders dan schema" (geen oordeel).
 *   Alle getallen komen uit data (verslag/score) of het casusblad; dit bestand rekent niets nieuws uit,
 *   behalve de tegelkleur (welke toestand de meeste meetpunten van de eigen curve had).
 * Stabiele haken voor tests: [data-eind="naam"|"totaal"|"race-0"|"race-1"], [data-verslag="i"] met
 *   [data-regel="zone|laag|hoog|giftig|totaal"], [data-poortje="index"][data-soort], [data-tel="..."],
 *   [data-zin="praktijk"|"nabespreking"], knoppen data-actie="opnieuw" en "naar-verslag" (data-race).
 */
(function (root) {
  'use strict';
  if (!root) return;
  var SoS = root.SoS = root.SoS || {};

  var VRAAG = 'Wat deed je toen je onder de streep zakte?';
  var TOESTAND_LABEL = { zone: 'in de zone', onder: 'te laag', boven: 'te hoog', giftig: 'giftig' };
  var SOORT_LABEL = { tablet: 'Tablet', zetpil: 'Zetpil', spuit: 'Spuit', overgeslagen: 'overgeslagen', geblokkeerd: 'geblokkeerd' }; // knopnamen uit de race
  var IBU = '#ff9f43'; // ibuprofen: oranje, zoals in de race (paars is voor de poortjes)
  var LIJN = { zone: '#7ef0c4', onder: '#7cc4ff', boven: '#ffe14d', giftig: '#ff4d5e' }; // = LIJNKLEUR in de race

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function getal(x, dec) { return SoS.ui.getal(x, dec || 0); }
  function metTeken(x) { return x > 0 ? '+' + getal(x) : getal(x); } // getal() zet zelf "−"
  function lijst(xs) { // "0, 6, 12 en 18"
    return xs.length < 2 ? xs.join('') : xs.slice(0, -1).join(', ') + ' en ' + xs[xs.length - 1];
  }

  function toestand(c, C, t) {
    var M = SoS.model, v = M.venster(c, t);
    if (c.toxisch != null && C > c.toxisch) return 'giftig';
    return C < v.laag ? 'onder' : (C > v.hoog ? 'boven' : 'zone');
  }

  // Per poortje: de toestand waarin de eigen spiegel tot het volgende poortje het vaakst zat.
  function tegelStaten(c, curve) {
    var tijden = SoS.model.poortjes(c), uit = [];
    var ernst = { zone: 0, onder: 1, boven: 2, giftig: 3 };
    for (var i = 0; i < tijden.length; i++) {
      var a = tijden[i], b = i + 1 < tijden.length ? tijden[i + 1] : c.raceDuur, n = {}, best = null;
      for (var j = 0; j < curve.length; j++) {
        var p = curve[j];
        if (p.t >= a - 1e-6 && p.t < b - 1e-6) { var s = toestand(c, p.C, p.t); n[s] = (n[s] || 0) + 1; }
      }
      Object.keys(n).forEach(function (s) {
        if (best == null || n[s] > n[best] || (n[s] === n[best] && ernst[s] > ernst[best])) best = s;
      });
      uit.push(best);
    }
    return uit;
  }

  // Paracetamol: leverschade zoals in de race: rood zolang de dagteller (doses in (t − 24 u, t]) boven het
  // maximum zit. Geeft een functie t -> bool (altijd false zonder dagteller).
  function leverOp(c, v) {
    var bg = c.bovengrens;
    if (!bg || bg.type !== 'dagteller') return function () { return false; };
    var doses = [];
    v.tijdlijn.forEach(function (r) { r.jij.toedieningen.forEach(function (d) { doses.push({ t: r.t, dosis: d.dosis }); }); });
    return function (t) {
      var som = 0;
      doses.forEach(function (d) { if (d.t <= t + 1e-6 && d.t > t - bg.venster + 1e-6) som += d.dosis; });
      return som > bg.maxPer24u + 1e-9;
    };
  }

  function stemming(c, v) {
    if (c.toxisch != null && v.uren && v.uren.toxisch > 0) return 'misselijk';
    if (v.lever && v.lever.beschadigd) return 'misselijk';
    return v.opbouw.totaal >= 500 ? 'blij' : (v.opbouw.totaal >= 0 ? 'neutraal' : 'pijn');
  }
  function figuurHtml(c, v, klasse) {
    return '<div class="fig ' + (klasse || '') + '" aria-hidden="true">' +
      SoS.ui.figuur({ wie: c.id === 'lithium' ? 'vries' : 'opa', stemming: stemming(c, v),
        prop: c.id === 'lithium' ? null : 'stok' }) + '</div>';
  }

  // ------------------------------------------------------------------------------------------
  // 1. Eindscherm
  // ------------------------------------------------------------------------------------------
  function gebeurtenis(c, type) {
    var g = null;
    c.gebeurtenissen.forEach(function (x) { if (x.type === type) g = x; });
    return g;
  }
  function tijdLabel(c, t) { return c.id === 'lithium' ? 'Dag ' + getal(t / 24) : 'Uur ' + t; } // als label, zoals in de race

  function kaartHtml(i, c, v, curve) {
    var staten = curve && curve.length ? tegelStaten(c, curve) : null;
    var tijden = SoS.model.poortjes(c), lever = leverOp(c, v);
    var blok = gebeurtenis(c, 'blokkade'), ibu = gebeurtenis(c, 'klaring');
    var tegels = '';
    if (staten) {
      tijden.forEach(function (t, k) { if (lever(t)) staten[k] = 'giftig'; });
      // twee rijen: paracetamol uur 0–11 | 12–23; lithium dag 0–4 | dag 5–9 (vanaf de ibuprofen)
      var helft = Math.ceil(staten.length / 2);
      var rij = function (van, tot) {
        var s = '<span class="eind-tegelrij"><span class="eind-rijlabel">' + tijdLabel(c, tijden[van]) + '</span>' +
          '<span class="eind-tegelvak" style="--n:' + (tot - van) + '">';
        for (var k = van; k < tot; k++) {
          var t = tijden[k], extra = '';
          if (blok && t >= blok.van - 1e-9 && t < blok.tot - 1e-9) extra += ' m';
          if (ibu && Math.abs(t - ibu.t) < 1e-9) extra += ' ibu';
          s += '<span class="eind-tegel t-' + (staten[k] || 'leeg') + extra + '" style="--i:' + k + '"></span>';
        }
        return s + '</span></span>';
      };
      tegels = '<span class="eind-tegels" role="img" aria-label="Per poortje: waar de spiegel zat">' +
        rij(0, helft) + rij(helft, staten.length) + '</span>';
    }
    return '<button type="button" class="eind-kaart" data-actie="naar-verslag" data-race="' + i + '">' +
      '<span class="eind-kaart-kop">' + figuurHtml(c, v, 'eind-kaart-fig') +
        '<span class="eind-kaart-titel"><small>Race ' + (i + 1) + '</small>' + esc(c.naam) + '</span>' +
        '<span class="eind-kaart-rechts"><span class="eind-kaart-score" data-eind="race-' + i + '">' + getal(v.opbouw.totaal) + '</span>' +
        '<span class="eind-kaart-meer">verslag <span aria-hidden="true">↓</span></span></span>' +
      '</span>' + tegels +
    '</button>';
  }

  function legendaHtml(cs) {
    var heeft = { zone: true, onder: true, boven: false, giftig: false }, blok = false, ibu = false;
    cs.forEach(function (c) {
      if (!c) return;
      if (c.venster.some(function (v) { return v.hoog !== Infinity; })) heeft.boven = true;
      if (c.toxisch != null || (c.bovengrens && c.bovengrens.type === 'dagteller')) heeft.giftig = true;
      if (gebeurtenis(c, 'blokkade')) blok = true;
      if (gebeurtenis(c, 'klaring')) ibu = true;
    });
    var li = ['zone', 'onder', 'boven', 'giftig'].filter(function (s) { return heeft[s]; }).map(function (s) {
      return '<li><span class="eind-tegel t-' + s + '"></span>' + (s === 'giftig' ? 'lever / giftig' : TOESTAND_LABEL[s]) + '</li>';
    });
    if (blok) li.push('<li><span class="eind-leg-m"></span>misselijk</li>');
    if (ibu) li.push('<li><span class="eind-leg-ibu"></span>ibuprofen</li>');
    return '<ul class="eind-legenda" aria-label="Uitleg van de tegels">' + li.join('') + '</ul>';
  }

  // ------------------------------------------------------------------------------------------
  // 2. Toedienverslag
  // ------------------------------------------------------------------------------------------
  function curveSvg(c, curve, lever) {
    if (!curve || curve.length < 2) return '';
    var W = 340, H = 132, L = 8, R = 30, T = 18, B = 22, pw = W - L - R, ph = H - T - B;
    var maxC = 0;
    curve.forEach(function (p) { if (p.C > maxC) maxC = p.C; });
    var vast = c.id === 'lithium' ? 2 : 20;
    var ymax = Math.max(vast, maxC * 1.08);
    var x = function (t) { return L + pw * t / c.raceDuur; };
    var y = function (C) { return T + ph * (1 - Math.min(C, ymax) / ymax); };
    var f = function (n) { return Math.round(n * 10) / 10; };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" ' +
      'aria-label="Jouw spiegel tijdens de race, met de zone">';
    s += '<rect x="0" y="0" width="' + W + '" height="' + H + '" rx="14" fill="#000"/>';
    // gebeurtenissen
    c.gebeurtenissen.forEach(function (g) {
      if (g.type === 'blokkade') {
        s += '<rect x="' + f(x(g.van)) + '" y="' + T + '" width="' + f(x(g.tot) - x(g.van)) + '" height="' + ph +
          '" fill="rgba(190,230,90,0.13)"/>';
        s += '<text x="' + f((x(g.van) + x(g.tot)) / 2) + '" y="' + (T - 5) + '" text-anchor="middle" class="eind-svg-gebeurtenis">misselijk</text>';
      } else if (g.type === 'klaring') {
        s += '<line x1="' + f(x(g.t)) + '" y1="' + T + '" x2="' + f(x(g.t)) + '" y2="' + (T + ph) +
          '" stroke="' + IBU + '" stroke-width="2"/>';
        s += '<text x="' + f(x(g.t) + 4) + '" y="' + (T - 5) + '" class="eind-svg-ibu">ibuprofen</text>';
      }
    });
    // het groene vlak: uit M.venster(casus, t), dus het schuift mee als het venster in de tijd verschuift
    var M = SoS.model, n = 48, boven = [], onder = [], heeftHoog = false;
    for (var k = 0; k <= n; k++) {
      var tk = c.raceDuur * k / n, vk = M.venster(c, tk);
      if (vk.hoog !== Infinity) heeftHoog = true;
      boven.push(f(x(tk)) + ' ' + f(vk.hoog === Infinity ? T : y(vk.hoog)));
      onder.push(f(x(tk)) + ' ' + f(y(vk.laag)));
    }
    s += '<path d="M' + boven.join(' L') + ' L' + onder.slice().reverse().join(' L') + ' Z" fill="rgba(61,220,151,0.16)"/>';
    s += '<path d="M' + onder.join(' L') + '" fill="none" stroke="rgba(61,220,151,0.85)" stroke-width="1.5"/>';
    if (heeftHoog) s += '<path d="M' + boven.join(' L') + '" fill="none" stroke="rgba(61,220,151,0.5)" stroke-width="1"/>';
    var v0 = M.venster(c, c.raceDuur); // labels rechts: het venster aan het eind van de race
    if (c.toxisch != null && c.toxisch < ymax) {
      s += '<line x1="' + L + '" y1="' + f(y(c.toxisch)) + '" x2="' + (L + pw) + '" y2="' + f(y(c.toxisch)) +
        '" stroke="rgba(255,90,90,0.7)" stroke-width="1.2" stroke-dasharray="4 4"/>';
    }
    // curve, gekleurd per toestand
    var stuk = null, paden = [];
    for (var i = 0; i < curve.length; i++) {
      var p = curve[i], st = lever(p.t) ? 'giftig' : toestand(c, p.C, p.t), pt = f(x(p.t)) + ' ' + f(y(p.C));
      if (!stuk || stuk.st !== st) {
        if (stuk) stuk.d += ' L' + pt;
        stuk = { st: st, d: 'M' + pt };
        paden.push(stuk);
      } else stuk.d += ' L' + pt;
    }
    paden.forEach(function (pd) {
      s += '<path d="' + pd.d + '" fill="none" stroke="' + LIJN[pd.st] + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
    });
    // labels: drempels (casusblad) en tijdas
    var labels = c.id === 'lithium'
      ? [[v0.laag, getal(v0.laag, 1), 5], [v0.hoog, getal(v0.hoog, 1), -1], [c.toxisch, getal(c.toxisch, 1), 4]]
      : [[v0.laag, getal(v0.laag), 4]];
    var gezet = [];
    labels.forEach(function (lb) {
      if (lb[0] == null || lb[0] >= ymax) return;
      var yl = y(lb[0]) + lb[2];
      if (gezet.some(function (g) { return Math.abs(g - yl) < 12; })) return; // geen labels over elkaar
      gezet.push(yl);
      s += '<text x="' + (W - 3) + '" y="' + f(y(lb[0]) + lb[2]) + '" text-anchor="end" class="eind-svg-label' +
        (lb[0] === c.toxisch ? ' tox' : '') + '">' + esc(lb[1]) + '</text>';
    });
    var asTekst = c.id === 'lithium'
      ? [[0, 'Dag 0'], [c.raceDuur / 2, 'Dag ' + c.raceDuur / 48], [c.raceDuur, 'Dag ' + c.raceDuur / 24]]
      : [[0, 'Uur 0'], [c.raceDuur / 2, 'Uur ' + c.raceDuur / 2], [c.raceDuur, 'Uur ' + c.raceDuur]];
    asTekst.forEach(function (a, k) {
      var anker = k === 0 ? 'start' : (k === 2 ? 'end' : 'middle');
      s += '<text x="' + f(x(a[0])) + '" y="' + (H - 6) + '" text-anchor="' + anker + '" class="eind-svg-as">' + a[1] + '</text>';
    });
    return s + '</svg>';
  }

  function opbouwHtml(v) {
    var rijen = v.opbouw.regels.map(function (r) {
      var kl = r.punten > 0 ? 'plus' : (r.punten < 0 ? 'min' : 'nul');
      return '<tr data-regel="' + r.id + '"><th scope="row">' + esc(r.label) + '</th>' +
        '<td class="' + kl + '">' + metTeken(r.punten) + '</td></tr>';
    }).join('');
    return '<table class="eind-opbouw"><caption>QALY-opbouw</caption><tbody>' + rijen +
      '<tr class="eind-opbouw-totaal" data-regel="totaal"><th scope="row">totaal</th><td>' + getal(v.opbouw.totaal) +
      '</td></tr></tbody></table>';
  }

  function celInhoud(rij) {
    var j = rij.jij, ic = SoS.ui.icoon;
    if (j.soorten.length) {
      return j.soorten.map(function (so) {
        return '<span class="eind-cel-ic">' + ic(so.soort) + (so.aantal > 1 ? '<b>' + so.aantal + '×</b>' : '') + '</span>';
      }).join('');
    }
    if (j.soort === 'geblokkeerd') return '<span class="eind-cel-ic">' + ic('kruis') + '</span>';
    return '<span class="eind-cel-leeg" aria-hidden="true">–</span>';
  }

  function roosterHtml(c, v) {
    var M = SoS.model, rijen = v.tijdlijn;
    var blok = null;
    c.gebeurtenissen.forEach(function (g) { if (g.type === 'blokkade') blok = g; });
    var klaring = null;
    c.gebeurtenissen.forEach(function (g) { if (g.type === 'klaring') klaring = g; });
    var cel = function (r, metTijd) {
      var j = r.jij, misselijk = blok && r.t >= blok.van - 1e-9 && r.t < blok.tot - 1e-9;
      var echt = !!r.echt, n = 0;
      j.toedieningen.forEach(function (d) { n += d.aantal; });
      var anders = echt ? n !== 1 : n > 0; // afwijking van het echte schema (aantal doses op dit poortje)
      var label = r.tijdTekst + ': ' + j.tekst + (r.echt ? '; echt schema ' + r.echt : '; echt schema niets') +
        (anders ? '; anders dan schema' : '');
      return '<li class="eind-cel' + (echt ? ' echt' : '') + (misselijk ? ' misselijk' : '') + (anders ? ' anders' : '') + ' s-' + j.soort + '"' +
        ' data-anders="' + (anders ? 1 : 0) + '"' +
        ' data-poortje="' + r.index + '" data-soort="' + j.soort + '" data-tekst="' + esc(j.tekst) + '"' +
        ' aria-label="' + esc(label) + '">' +
        (metTijd ? '<span class="eind-cel-uur" aria-hidden="true">' + r.t + '</span>' : '') +
        celInhoud(r) +
        (echt ? '<span class="eind-cel-echt" aria-hidden="true">' + esc(r.echt) + '</span>' : '') +
        (anders ? '<span class="eind-cel-anders" aria-hidden="true">≠</span>' : '') + '</li>';
    };
    var s = '';
    if (c.id === 'lithium') {
      // rijen = dagen, kolommen = de poortjes van die dag
      var perDag = Math.round(24 / c.poortjes.interval), dagen = Math.ceil(rijen.length / perDag);
      var kop = rijen.slice(0, perDag).map(function (r) { return '<span>' + r.t + ' u</span>'; }).join('');
      s += '<div class="eind-rooster eind-rooster-dag" style="--k:' + perDag + '">';
      s += '<div class="eind-dagrij eind-dagkop" aria-hidden="true"><span></span>' + kop + '</div>';
      for (var d = 0; d < dagen; d++) {
        var r0 = rijen[d * perDag];
        if (klaring && Math.abs(r0.t - klaring.t) < 1e-9) {
          s += '<div class="eind-markering"><span>Dag ' + (klaring.t / 24) + ': ibuprofen</span></div>';
        }
        s += '<div class="eind-dagrij"><span class="eind-dag">Dag ' + d + '</span><ul>' +
          rijen.slice(d * perDag, (d + 1) * perDag).map(function (r) { return cel(r, false); }).join('') + '</ul></div>';
      }
      s += '</div>';
    } else {
      // rijen van 6 uur: het echte schema (om de 6 uur) valt steeds in de eerste kolom
      var stap = c.echtSchema.schema.length > 1 ? Math.round((c.echtSchema.schema[1].t - c.echtSchema.schema[0].t) / c.poortjes.interval) : 6;
      s += '<ul class="eind-rooster eind-rooster-uur" style="--k:' + stap + '">' + rijen.map(function (r) { return cel(r, true); }).join('') + '</ul>';
    }
    // legenda: alleen wat voorkomt (+ altijd overgeslagen), en het echte schema
    var komtVoor = {};
    rijen.forEach(function (r) {
      r.jij.soorten.forEach(function (so) { komtVoor[so.soort] = true; });
      if (r.jij.soort === 'geblokkeerd') komtVoor.geblokkeerd = true;
    });
    var ic = SoS.ui.icoon;
    var leg = ['tablet', 'zetpil', 'spuit'].filter(function (k) { return komtVoor[k]; }).map(function (k) {
      return '<li><span class="eind-leg-ic">' + ic(k) + '</span>' + SOORT_LABEL[k] + '</li>';
    });
    if (komtVoor.geblokkeerd) leg.push('<li><span class="eind-leg-ic">' + ic('kruis') + '</span>geblokkeerd (wilde slikken, maar misselijk)</li>');
    leg.push('<li><span class="eind-leg-ic eind-leg-leeg">–</span>overgeslagen</li>');
    leg.push('<li><span class="eind-leg-echt">' + esc(rijen.filter(function (r) { return r.echt; })[0].echt) + '</span>echt schema</li>');
    if (rijen.some(function (r) { var n = 0; r.jij.toedieningen.forEach(function (d) { n += d.aantal; }); return r.echt ? n !== 1 : n > 0; })) {
      leg.push('<li><span class="eind-leg-anders">≠</span>anders dan schema</li>');
    }
    if (blok) leg.push('<li><span class="eind-leg-misselijk"></span>misselijk (' + esc(blok.tijdTekst.toLowerCase()) + ')</li>');
    return s + '<ul class="eind-leg">' + leg.join('') + '</ul>';
  }

  function echtTekstHtml(c, v) {
    var sch = c.echtSchema.schema, perDag = sch.filter(function (e) { return e.t < 24; });
    var dosis = (v.tijdlijn.filter(function (r) { return r.echt; })[0] || {}).echt || '';
    var tijden = perDag.map(function (e) { return e.t; });
    var lek;
    if (c.id === 'lithium') {
      lek = perDag.length + '× per dag ' + dosis + ' (om ' + lijst(tijden) + ' uur): elk poortje 1 tablet van ' + dosis + '. Na een pijnstiller als ibuprofen (een NSAID): de spiegel laten prikken.';
    } else {
      lek = perDag.length + '× per dag ' + dosis + ' (om ' + lijst(tijden) + ' uur).';
      // Een dosis van het echte schema tijdens de misselijkheid: dan kan opa Jan niet slikken.
      var blok = gebeurtenis(c, 'blokkade');
      var inBlok = blok ? tijden.filter(function (t) { return t >= blok.van - 1e-9 && t < blok.tot - 1e-9; }) : [];
      if (inBlok.length) {
        lek += ' Om ' + lijst(inBlok) + ' uur is opa Jan misselijk en kan hij niet slikken: dan krijgt hij die ' + dosis +
          ' als zetpil of prik.';
      }
    }
    return '<p class="eind-echt"><span class="eind-echt-kop">Echt schema</span> <b>' + esc(v.echtSchema.tekst) + '</b><br>' +
      'Dat is: ' + esc(lek) + '</p>';
  }

  function tellingHtml(v) {
    var t = v.telling, s = '<div class="eind-telling">';
    s += '<div data-tel="momenten"><span>Toedien&shy;momenten</span><b>' + getal(t.toedienmomenten) + '</b>' +
      '<small>echt schema: ' + getal(v.echtSchema.aantal) + '</small></div>';
    s += '<div data-tel="dosis"><span>Totale dosis</span><b>' + esc(t.totaleDosis.tekst) + '</b></div>';
    if (t.dagteller) {
      s += '<div data-tel="dagteller" class="' + (t.dagteller.over ? 'over' : '') + '"><span>Dagteller</span>' +
        '<b>' + getal(t.dagteller.hoogste, t.dagteller.hoogste % 1 ? 1 : 0) + ' g</b>' +
        '<small>max. ' + getal(t.dagteller.max) + ' g per 24 uur' + (t.dagteller.over ? '. Lever beschadigd.' : '') + '</small></div>';
    }
    return s + '</div>';
  }

  function verslagHtml(i, c, v, curve) {
    var s = '<section class="eind-verslag" data-verslag="' + i + '" id="eind-verslag-' + i + '" aria-labelledby="eind-v-kop-' + i + '">';
    s += '<p class="markering">Race ' + (i + 1) + ' · verslag</p>';
    s += '<header class="eind-v-kop">' + figuurHtml(c, v, 'eind-v-fig') +
      '<div><h2 id="eind-v-kop-' + i + '">' + esc(c.naam) + ' <span class="eind-v-wie">' + esc(c.patient) + '</span></h2>' +
      '<p class="eind-v-score"><b>' + getal(v.opbouw.totaal) + '</b> QALY-punten</p></div></header>';
    var lever = leverOp(c, v), leverOoit = curve && curve.some(function (p) { return lever(p.t); });
    if (curve && curve.length > 1) {
      s += '<figure class="eind-curve">' + curveSvg(c, curve, lever) +
        '<figcaption>Jouw spiegel. Het groene vlak: in de zone (' + esc(c.zone.tekst.split(' = ')[0]) + '); de onderkant is de streep.' +
        (c.toxisch != null ? ' Rode stippellijn: giftig (' + esc(c.toxischTekst || getal(c.toxisch, 1)) + ').' : '') +
        (leverOoit ? ' Rode lijn: meer dan ' + getal(c.bovengrens.maxPer24u / 1000) + ' g in 24 uur. ' + esc(c.lekentaal.boven) : '') +
        '</figcaption></figure>';
    }
    s += opbouwHtml(v);
    s += '<h3 class="eind-h3">Jouw toedieningen per poortje</h3>';
    s += echtTekstHtml(c, v);
    s += roosterHtml(c, v);
    s += tellingHtml(v);
    s += '<blockquote class="eind-praktijk" data-zin="praktijk">' + esc(v.praktijk.zin) + '</blockquote>';
    if (c.nabespreking && v.praktijk.zin.indexOf(c.nabespreking) < 0) {
      s += '<p class="eind-nabespreking" data-zin="nabespreking">' + esc(c.nabespreking) + '</p>';
    }
    return s + '</section>';
  }

  // ------------------------------------------------------------------------------------------
  function toon(container, data, opnieuw) {
    var ui = SoS.ui, M = SoS.model;
    data = data || {};
    var races = data.races || [], curves = data.curves || [];
    var cs = races.map(function (v, i) {
      return (data.casussen && data.casussen[i]) || (v ? M.casus(v.casus) : null);
    });
    var totaal = data.totaal != null ? data.totaal : races.reduce(function (s, v) { return s + (v ? v.opbouw.totaal : 0); }, 0);

    var kaarten = '', verslagen = '';
    races.forEach(function (v, i) {
      if (!v || !cs[i]) return;
      kaarten += kaartHtml(i, cs[i], v, curves[i]);
      verslagen += verslagHtml(i, cs[i], v, curves[i]);
    });

    container.innerHTML =
      '<div class="eind-binnen">' +
        '<div class="eind-held">' +
          // twee lege zwevers houden alleen de eerste regel vrij van de dempknop (rechtsboven), symmetrisch
          '<p class="eind-naam" data-eind="naam"><span class="eind-naam-vrij" aria-hidden="true"></span>' +
            '<span class="eind-naam-vrij r" aria-hidden="true"></span>' + esc(data.naam || '') + '</p>' +
          '<p class="eind-label">QALY-punten totaal</p>' +
          '<p class="eind-totaal" data-eind="totaal">' + getal(totaal) + '</p>' +
          '<div class="eind-kaarten">' + kaarten + '</div>' +
          legendaHtml(cs) +
          '<div class="eind-vraag"><span class="markering">Nabespreken</span>' +
            '<p data-eind="vraag">' + VRAAG + '</p></div>' +
          '<div class="eind-acties"><button type="button" class="knop-paars groot" data-actie="opnieuw">Nog een keer</button></div>' +
          '<p class="eind-scorebord">Laat je naam en totaal op het scorebord zetten.</p>' +
          '<p class="eind-spelpunten">QALY-punten zijn spelpunten, geen echte QALY\'s.</p>' +
        '</div>' +
        verslagen +
        '<div class="eind-voet"><button type="button" class="knop-lijn" data-actie="naar-boven">' +
          '<span aria-hidden="true">↑</span>&nbsp;Terug naar je score</button></div>' +
      '</div>';

    var bezig = false;
    var weg = [];
    function luister(el, ev, fn) { el.addEventListener(ev, fn); weg.push(function () { el.removeEventListener(ev, fn); }); }

    luister(container.querySelector('[data-actie="opnieuw"]'), 'click', function () {
      if (bezig) return;
      bezig = true;
      ui.speel('tik');
      opnieuw();
    });
    Array.prototype.forEach.call(container.querySelectorAll('[data-actie="naar-verslag"]'), function (k) {
      luister(k, 'click', function () {
        var doel = container.querySelector('[data-verslag="' + k.getAttribute('data-race') + '"]');
        if (!doel) return;
        ui.speel('tik');
        var glad = !(root.matchMedia && root.matchMedia('(prefers-reduced-motion: reduce)').matches);
        container.scrollTo({ top: doel.offsetTop - 8, behavior: glad ? 'smooth' : 'auto' });
      });
    });
    // figuurtjes reageren op aanraken
    Array.prototype.forEach.call(container.querySelectorAll('.eind-v-fig'), function (f) {
      luister(f, 'pointerdown', function () {
        f.classList.remove('wiebel'); void f.offsetWidth; f.classList.add('wiebel');
        ui.speel('tik');
      });
    });

    luister(container.querySelector('[data-actie="naar-boven"]'), 'click', function () {
      ui.speel('tik');
      var glad = !(root.matchMedia && root.matchMedia('(prefers-reduced-motion: reduce)').matches);
      container.scrollTo({ top: 0, behavior: glad ? 'smooth' : 'auto' });
    });

    // De dempknop van app.js staat vast rechtsboven en zou bij scrollen over tekst liggen: zolang het
    // eindscherm open is, staat hij op dezelfde plek (rechtsboven) maar scrolt hij mee met de pagina; de
    // speelnaam laat daar ruimte voor. stop() zet hem terug.
    var demp = root.document.getElementById('demp'), dempTerug = null;
    if (demp && demp.parentNode) {
      dempTerug = { ouder: demp.parentNode, na: demp.nextSibling };
      container.appendChild(demp);
    }

    // Speelnaam: 1–2 regels, alleen breken op spaties; zo nodig kleiner, maar nooit onder 32 px.
    var naamEl = container.querySelector('[data-eind="naam"]');
    function pasNaam() {
      var max = root.innerHeight >= 800 ? 40 : (root.innerHeight >= 700 ? 36 : 34);
      naamEl.style.overflowWrap = 'normal';
      for (var px = max; px >= 32; px--) {
        naamEl.style.fontSize = px + 'px';
        var regels = Math.round(naamEl.offsetHeight / (px * 1.08));
        if (naamEl.scrollWidth <= naamEl.clientWidth + 1 && regels <= 2) return;
      }
      naamEl.style.fontSize = '32px';
      naamEl.style.overflowWrap = 'anywhere'; // één woord dat zelfs op 32 px niet past
    }
    pasNaam();
    luister(root, 'resize', pasNaam);

    container.scrollTop = 0;
    ui.speel('klaar');
    return {
      stop: function () {
        bezig = true;
        weg.forEach(function (f) { f(); });
        weg = [];
        if (dempTerug && demp) {
          try { dempTerug.ouder.insertBefore(demp, dempTerug.na && dempTerug.na.parentNode === dempTerug.ouder ? dempTerug.na : null); }
          catch (e) { /* negeer */ }
          dempTerug = null;
        }
      }
    };
  }

  SoS.einde = { toon: toon };
})(typeof window !== 'undefined' ? window : null);

</script>
<script data-bron="src/app.js">
/*
 * Slikken of Stikken — src/app.js  (schermen, spelverloop, race-motor)
 * Laadt als laatste (na model, score, sound, tutorial, einde). Zet window.SoS.ui en window.SoS.debug.
 *
 * FLOW: start (naam + "Start") → oefenronde → intro race 1 → race 1 paracetamol → intro race 2 → race 2
 *       lithium → einde (SoS.einde.toon). "Oefenronde overslaan" (startscherm) gaat meteen naar intro race 1.
 *       "Nog een keer" start race 1 meteen.
 *
 * EÉN RACE-MOTOR, OOK VOOR DE OEFENRONDE (§6C1): startRace(i, gids). De oefenronde is startRace(0, SoS.tutorial):
 *   hetzelfde scherm (#scherm-race), dezelfde tekencode (teken, tekenPoortjes), dezelfde knoppen, klok,
 *   QALY-stand, dagteller en levermeter. Er bestaat geen tutorialversie van die onderdelen. Het draaiboek
 *   (src/tutorial.js) voegt alleen toe: de klok staat stil tot de speler de gemarkeerde knop tikt (R.gids.bevroren),
 *   één zin in beeld (zelfde .melding als de race, maar hij blijft staan), en de markering van die knop
 *   (class "wijs" + data-wijs="1"). De plotwending (misselijkheid) staat uit; de ronde stopt op gids.eind.
 *
 * GEDEELD, VOOR einde.js (SoS.ui; gebruik binnen toon(), niet bij het laden):
 *   SoS.ui.figuur({wie:'opa'|'vries', stemming:'neutraal'|'blij'|'pijn'|'misselijk', prop:'stok'|'doosje'|null,
 *                 kleur, label, kop}) -> SVG-string: plat figuurtje zonder schetslijn (past op zwart met sterren),
 *                 herkenbaar aan het hoedje (opa Jan blauwe pet + wandelstok, mevrouw De Vries rode hoed met
 *                 rand, knotje en bril). kop:true = alleen hoofd en hoed. Zet hem in een .fig; .fig.wiebel = reactie.
 *   SoS.ui.icoon(soort)  soort 'tablet'|'slik'|'zetpil'|'spuit'|'niets'|'doosje' -> SVG-string (40×40).
 *   SoS.ui.el(tag, attrs, kinderen) -> element (attrs: class, text, html, data-*, aria-*, on<event>).
 *   SoS.ui.getal(x, decimalen) -> Nederlandse notatie ("1,5"; "1.250").
 *   SoS.ui.speel(naam)  SoS.sound.play zonder risico (namen: zie src/sound.js). SoS.ui.unlock().
 *   SoS.ui.KLEUR {paars, groen, koraal, geel, blauw, rood, roze}
 *   Stijl: style.css (één stijl: zwart met sterren; .kaart, .markering, .tekst, .knop-paars, .knop-lijn, .fig).
 *
 * RACE-INTERACTIE: de tijd loopt van boven naar beneden (pijltje "tijd" in de linkermarge); paarse poortjes
 * schuiven van onder naar de "nu"-lijn. De knoppen onderin kiezen wat er op het EERSTVOLGENDE poortje gebeurt
 * (stand "gekozen", icoontje op het poortje, regel "Tablet voor uur 18" boven de knoppen); op het poortje wordt
 * de keuze toegepast (race.naar(poortjetijd), dan race.geef) en gewist. Niets gekozen = overslaan.
 * Paracetamol: 1 toediening (1 g) per poortje; dezelfde knop nog eens = keuze weg.
 * Lithium: tablet tot 2× per poortje ("2× Tablet voor ..."), derde tik = keuze weg.
 * Te laat: een tik binnen 0,3 s (echte tijd, /speed) ná een poortje telt NIET voor het volgende poortje
 * ("Te laat voor uur 16"); tik opnieuw. SoS.debug.poortje.open = false in dat venster.
 * INDELING CANVAS (geen tekst over tekst): poortlabels staan aan de kant weg van de stip (R.kant, strook
 * R.labelMax breed), met een stukje lijn ervoor en erachter; waardelabel boven de nu-lijn, "onderweg"-bolletje
 * ernaast of eronder, buiten die strook. Meldingen staan boven in het podium (verleden), één tegelijk; labels
 * onder een melding worden niet getekend.
 * Termen: "het groene vlak" (de zone); de ondergrens ervan heet "de streep" (label bovenaan, intro race 1).
 * Slikken tijdens misselijkheid en de lithium-spuit worden geweigerd met de casusbladtekst (geen effect,
 * geen strafpunten). Leverschade (dagteller > 4 g): lijn en stip rood, QALY-pijl omlaag, levermeter vol.
 * Het portretje in de racekop (#patient-kop) laat zien hoe het met de patiënt gaat (blij / pijn / misselijk).
 * Terug-knop: eerst een melding; nog een keer terug binnen 3 s verlaat het spel.
 *
 * TESTHAAK (gauntlet/contract.md):
 *   ?speed=N  versnelt de spelklok N× (ook de aanloop van 3 s en de duur van meldingen).
 *   window.SoS.debug (alleen-lezen momentopname, elke keer vers): {fase, casus, t, klok, C, score,
 *     dagteller, poortje:{index, t, keuze, aantal, geblokkeerd}, gegeven:[...], uitslag:[...], naam, speed,
 *     gids:{stap, bevroren, wijs, zin} (alleen in de oefenronde), tutorialDuur (s, na afloop)}
 *     fase: 'start'|'tutorial'|'intro1'|'race1'|'intro2'|'race2'|'einde'; t = modeltijd (uur);
 *     klok = spelklok (uur, negatief tijdens de aanloop); score = live QALY-totaal.
 *   Stabiele data-attributen: data-actie="start" en "start-over" (startscherm), "verder" (na de oefenronde en
 *     na elke race), "start-race" (intro-kaartje), "slik" | "zetpil" | "spuit" | "niets" (raceknoppen; lithium
 *     "Overslaan" = niets), "demp", "opnieuw" (einde). Naamveld: data-veld="naam". Oefenronde: de knop die de
 *     uitleg aanwijst heeft data-wijs="1".
 *   Raceknoppen reageren op pointerdown (snel) én click (toetsenbord); één tik telt één keer.
 */
(function (root) {
  'use strict';
  var SoS = root.SoS = root.SoS || {};
  var M = SoS.model, S = SoS.score;
  var doc = root.document;

  // ------------------------------------------------------------------------------------------
  // Testhaak: ?speed=N
  // ------------------------------------------------------------------------------------------
  var SPEED = 1;
  try {
    var sp = parseFloat(new URLSearchParams(root.location.search).get('speed'));
    if (isFinite(sp) && sp > 0) SPEED = Math.min(100, Math.max(0.1, sp));
  } catch (e) { /* geen URL-parameters */ }

  // ------------------------------------------------------------------------------------------
  // Gedeelde helpers (SoS.ui)
  // ------------------------------------------------------------------------------------------
  var KLEUR = { paars: '#b07cff', groen: '#3ddc97', koraal: '#ff6f61', geel: '#ffd166', blauw: '#4f8dff',
    rood: '#ff4d6d', roze: '#ff8fb8' };
  var FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

  function speel(naam) {
    try { if (SoS.sound) SoS.sound.play(naam); } catch (e) { /* geluid is bijzaak */ }
  }
  function unlock() {
    try { if (SoS.sound) SoS.sound.unlock(); } catch (e) { /* idem */ }
  }

  function getal(x, dec) {
    dec = dec == null ? 0 : dec;
    var neg = x < 0;
    var s = Math.abs(x).toFixed(dec).split('.');
    s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    var r = s.join(',');
    if (neg && /[1-9]/.test(r)) r = '−' + r;
    return r;
  }
  // Compact: hele getallen zonder ",0".
  function getalKort(x, dec) {
    var r = getal(x, dec);
    return r.indexOf(',') >= 0 ? r.replace(/,?0+$/, '') : r;
  }

  function el(tag, attrs, kinderen) {
    var e = doc.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    });
    (kinderen || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === 'string' ? doc.createTextNode(c) : c); });
    return e;
  }

  // Platte figuurtjes voor de zwarte sterrenwereld (geen schetslijnen): herkenbaar aan het gekleurde hoedje.
  // o.kop = true: alleen hoofd en hoed (klein portret in de racekop).
  function figuur(o) {
    o = o || {};
    var wie = o.wie === 'vries' ? 'vries' : 'opa';
    var st = o.stemming || 'neutraal';
    var hoed = o.kleur || (wie === 'opa' ? KLEUR.blauw : KLEUR.rood);
    var prop = o.prop === undefined ? (wie === 'opa' ? 'stok' : null) : o.prop;
    var label = o.label || (wie === 'opa' ? 'Opa Jan' : 'Mevrouw De Vries');
    var huid = st === 'misselijk' ? '#cfe3a4' : '#f6d9b4';
    var lijf = wie === 'opa' ? '#6b7fc4' : '#b06fc9';
    var d = '#2b2233'; // ogen en mond
    var A = 'stroke="' + lijf + '" stroke-width="7" stroke-linecap="round" fill="none"';
    var F = 'stroke="' + d + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"';
    var s = '<svg viewBox="' + (o.kop ? '16 6 80 82' : '0 0 100 132') + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' + label + '">';
    if (!o.kop) {
      s += '<path d="M44 104 L42 126 M56 104 L58 126" stroke="' + (wie === 'opa' ? '#4a5a96' : '#8a4fa3') + '" stroke-width="7" stroke-linecap="round" fill="none"/>';
      if (prop === 'stok') {
        s += '<path d="M73 127 L71 97 C71 90 63 90 63 95" stroke="#d9a566" stroke-width="4.5" stroke-linecap="round" fill="none"/>';
        s += '<path d="M39 95 L31 103 M61 95 L70 100" ' + A + '/>';
      } else if (prop === 'doosje') {
        s += '<path d="M39 95 L31 103 M61 95 L70 98" ' + A + '/>';
        s += '<rect x="67" y="88" width="21" height="15" rx="3" fill="#fff"/><path d="M67 95.5 H88" stroke="#ff9f43" stroke-width="5"/>';
      } else {
        s += '<path d="M39 95 L31 103 M61 95 L69 103" ' + A + '/>';
      }
      s += '<path d="M35 110 C35 93 41 84 50 84 C59 84 65 93 65 110 Z" fill="' + lijf + '"/>';
    }
    if (wie === 'vries') s += '<circle cx="74" cy="50" r="9" fill="#e9e4dc"/>';
    s += '<circle cx="50" cy="58" r="25" fill="' + huid + '"/>';
    if (st === 'blij') s += '<circle cx="34.5" cy="67" r="4.5" fill="#ff8fb8" opacity=".55"/><circle cx="65.5" cy="67" r="4.5" fill="#ff8fb8" opacity=".55"/>';
    if (st === 'pijn') {
      s += '<path d="M37 55 l6 3.5 l-6 3.5 M63 55 l-6 3.5 l6 3.5" ' + F + '/>';
    } else if (st === 'misselijk') {
      s += '<path d="M37 58 q4 -3 8 0 M55 58 q4 -3 8 0" ' + F + '/>';
    } else {
      s += '<circle cx="41" cy="58" r="3.4" fill="' + d + '"/><circle cx="59" cy="58" r="3.4" fill="' + d + '"/>';
    }
    if (wie === 'vries') {
      s += '<circle cx="41" cy="58" r="7.5" fill="none" stroke="' + d + '" stroke-width="2.2"/>' +
           '<circle cx="59" cy="58" r="7.5" fill="none" stroke="' + d + '" stroke-width="2.2"/>' +
           '<path d="M48.5 58 h3" stroke="' + d + '" stroke-width="2.2"/>';
    } else {
      s += '<path d="M41 68.5 q4.5 -4 9 -0.5 q4.5 -3.5 9 0.5" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>';
    }
    var mond = { blij: 'M43 73 q7 7 14 0', pijn: 'M43 77 q7 -6 14 0', misselijk: 'M41 76 q2.5 -3 5 0 t5 0 t5 0 t5 0', neutraal: 'M45 75 h10' }[st] || 'M45 75 h10';
    s += '<path d="' + mond + '" ' + F + '/>';
    if (st === 'pijn') s += '<path d="M78 40 q5 7 0 10 q-5 -3 0 -10 z" fill="#7cc4ff"/>';
    if (st === 'misselijk') s += '<path d="M79 70 q3 -4 6 0 M81 78 q3 -4 6 0" stroke="#a6d96a" stroke-width="2.5" stroke-linecap="round" fill="none"/>';
    // eigen hoedjes: opa Jan een pet met klep, mevrouw De Vries een hoed met rand en lint
    if (wie === 'opa') {
      s += '<path d="M25 47 Q23 29 48 27 Q72 26 77 41 L77 45 Q52 39 25 47 Z" fill="' + hoed + '"/>';
      s += '<path d="M62 43 Q81 38 91 46 Q80 52 63 48 Z" fill="' + hoed + '"/>';
      s += '<circle cx="49" cy="27.5" r="3" fill="#ffffff" opacity=".85"/>';
    } else {
      s += '<path d="M35 37 L37.5 15 Q50 10 62.5 15 L65 37 Z" fill="' + hoed + '"/>';
      s += '<path d="M36.6 29 L63.4 29" stroke="#ffd166" stroke-width="5"/>';
      s += '<ellipse cx="50" cy="37" rx="31" ry="6" fill="' + hoed + '"/>';
    }
    s += '</svg>';
    return s;
  }

  var ICONEN = {
    tablet: '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g transform="rotate(-35 20 20)">' +
      '<rect x="4" y="13" width="32" height="14" rx="7" fill="#ffffff"/><path d="M20 13h9a7 7 0 0 1 0 14h-9z" fill="#ff8fb8"/>' +
      '<rect x="4.5" y="13.5" width="31" height="13" rx="6.5" fill="none" stroke="#000" stroke-opacity=".18"/></g></svg>',
    zetpil: '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g transform="rotate(-35 20 20)">' +
      '<path d="M7 13.5h14c8.5 0 14 3 14 6.5s-5.5 6.5-14 6.5H7a2.5 2.5 0 0 1-2.5-2.5v-8A2.5 2.5 0 0 1 7 13.5z" fill="#ffe1a1"/>' +
      '<path d="M10 17h9" stroke="#fff" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/></g></svg>',
    spuit: '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g transform="rotate(-35 20 20)" stroke-linecap="round">' +
      '<path d="M2.5 14v12M2.5 20h6" stroke="#d6ecff" stroke-width="3" fill="none"/>' +
      '<rect x="8.5" y="14" width="18" height="12" rx="2" fill="#16314f" stroke="#d6ecff" stroke-width="2"/>' +
      '<rect x="15.5" y="16.5" width="10" height="7" fill="#7cc4ff"/>' +
      '<rect x="26.5" y="17" width="4" height="6" fill="#d6ecff"/><path d="M30.5 20h8" stroke="#ffffff" stroke-width="1.8"/></g></svg>',
    niets: '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
      '<circle cx="20" cy="20" r="12" fill="none" stroke="#a3a3ad" stroke-width="3"/><path d="M11.5 28.5L28.5 11.5" stroke="#a3a3ad" stroke-width="3" stroke-linecap="round"/></svg>',
    doosje: '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
      '<rect x="6" y="11" width="28" height="19" rx="3" fill="#fff"/><path d="M6 19h28" stroke="#ff9f43" stroke-width="5"/></svg>',
    kruis: '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
      '<path d="M12 12L28 28M28 12L12 28" stroke="#ff6f61" stroke-width="4" stroke-linecap="round"/></svg>'
  };
  ICONEN.slik = ICONEN.tablet;
  function icoon(soort) { return ICONEN[soort] || ''; }

  var DEMP_AAN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" fill-opacity=".15"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
  var DEMP_UIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" fill-opacity=".15"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>';

  SoS.ui = { el: el, figuur: figuur, icoon: icoon, getal: getal, speel: speel, unlock: unlock, KLEUR: KLEUR, FONT: FONT };

  // Afbeeldingen van de iconen voor het canvas (data-URI, geen netwerk).
  var IMG = {};
  ['tablet', 'zetpil', 'spuit', 'niets', 'doosje', 'kruis'].forEach(function (k) {
    var im = new Image();
    im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(ICONEN[k]);
    IMG[k] = im;
  });
  function tekenIcoon(ctx, soort, x, y, maat, alpha) {
    var im = IMG[soort];
    if (!im || !im.complete || !im.naturalWidth) return;
    ctx.save();
    if (alpha != null) ctx.globalAlpha *= alpha;
    ctx.drawImage(im, x - maat / 2, y - maat / 2, maat, maat);
    ctx.restore();
  }

  // ------------------------------------------------------------------------------------------
  // Staat en schermen
  // ------------------------------------------------------------------------------------------
  var $ = function (id) { return doc.getElementById(id); };
  var staat = { fase: 'start', naam: '', verslagen: [], curves: [], moduleStop: null };
  var R = null; // lopende race

  function naarScherm(id, fase) {
    if (staat.moduleStop) { try { staat.moduleStop(); } catch (e) { /* negeer */ } staat.moduleStop = null; }
    var schermen = doc.querySelectorAll('.scherm');
    for (var i = 0; i < schermen.length; i++) schermen[i].classList.toggle('actief', schermen[i].id === 'scherm-' + id);
    staat.fase = fase || id;
    var s = $('scherm-' + id);
    if (s) s.scrollTop = 0;
  }

  // Figuurtjes reageren op aanraken.
  function maakFigLevend(div) {
    div.addEventListener('pointerdown', function () {
      unlock();
      div.classList.remove('wiebel');
      void div.offsetWidth;
      div.classList.add('wiebel');
      speel('tik');
    });
  }

  // ------------------------------------------------------------------------------------------
  // 1. Start
  // ------------------------------------------------------------------------------------------
  function initStart() {
    var figs = doc.querySelectorAll('#scherm-start [data-fig]');
    for (var i = 0; i < figs.length; i++) {
      var wie = figs[i].getAttribute('data-fig');
      figs[i].innerHTML = figuur({ wie: wie, stemming: 'blij', prop: wie === 'opa' ? 'stok' : null });
      maakFigLevend(figs[i]);
    }
    var inp = $('naam');
    try { var oud = root.localStorage.getItem('sos.naam'); if (oud) inp.value = oud; } catch (e) { /* geen opslag */ }
    function begin(metOefenronde) {
      if (staat.fase !== 'start') return;
      unlock();
      speel('tik');
      var naam = (inp.value || '').replace(/\s+/g, ' ').trim().slice(0, 16);
      if (!naam) naam = 'Speler ' + (10 + Math.floor(Math.random() * 90));
      staat.naam = naam;
      try { root.localStorage.setItem('sos.naam', naam); } catch (e) { /* geen opslag */ }
      inp.blur();
      zetHistorie();
      if (metOefenronde && SoS.tutorial) startRace(0, SoS.tutorial);
      else toonIntro(0);
    }
    $('start-form').addEventListener('submit', function (ev) { ev.preventDefault(); begin(true); });
    doc.querySelector('[data-actie="start-over"]').addEventListener('click', function () { begin(false); });
  }

  // ------------------------------------------------------------------------------------------
  // 2. Oefenronde (tutorial): geen eigen scherm. startRace(0, SoS.tutorial) start de race-motor van
  //    race 1 met een draaiboek ernaast (zie "gids" hieronder en src/tutorial.js).
  // ------------------------------------------------------------------------------------------

  // Venster als tekst, uit de casusdata (M.venster: kan in de tijd verschuiven), bv. "0,6–1,0 mmol/L".
  function vensterTekst(c, t) {
    var v = M.venster(c, t), e = '\u00a0' + CFG[c.id].eenheid, dec = c.id === 'lithium' ? 1 : 0;
    return v.hoog === Infinity ? '≥\u00a0' + getal(v.laag, dec) + e : getal(v.laag, dec) + '–' + getal(v.hoog, dec) + e;
  }

  // ------------------------------------------------------------------------------------------
  // 3. Intro-kaartje per race
  // ------------------------------------------------------------------------------------------
  var RACES = ['paracetamol', 'lithium'];
  function toonIntro(i) {
    var c = M.casus(RACES[i]);
    $('intro-kop').textContent = 'Race ' + (i + 1) + ' · ' + c.naam;
    var fig = $('intro-fig');
    fig.innerHTML = '';
    var f = el('div', { class: 'fig', html: figuur({ wie: i === 0 ? 'opa' : 'vries', stemming: i === 0 ? 'pijn' : 'neutraal' }) });
    maakFigLevend(f);
    fig.appendChild(f);
    $('intro-verhaal').textContent = c.verhaal;
    var regels;
    if (i === 0) {
      regels = ['Houd de spiegel in het groene vlak, boven de streep.',
        'Kies vóór elk paars poortje: Tablet, Zetpil, Spuit of Niets.',
        'Maximaal ' + getalKort(c.bovengrens.maxPer24u / 1000, 1) + ' gram per dag: daarboven raakt de lever beschadigd.'];
    } else {
      // §6C5: wat in race 2 anders is dan in race 1, één zin per verschil (getallen uit de casusdata).
      var uren = M.poortjes(c).filter(function (t) { return t < 24; });
      regels = ['Het groene vlak heeft nu ook een bovenkant: ' + vensterTekst(c, 0) + '.',
        'Poortjes komen ' + uren.length + '× per dag: om ' + uren.slice(0, -1).join(', ') + ' en ' + uren[uren.length - 1] + ' uur.',
        'Niets heet hier Overslaan.',
        'Tik twee keer op Tablet voor 2 tabletten op één poortje.',
        'Geen zetpil en geen dagteller; wel een giftige grens: boven ' + getal(c.toxisch, 1) + '\u00a0' + CFG[c.id].eenheid + '.'];
    }
    var ul = $('intro-regel');
    ul.innerHTML = '';
    regels.forEach(function (r) { ul.appendChild(el('li', { text: r })); });
    $('intro-qaly').textContent = i === 0 ? S.UITLEG : '';
    staat.introIndex = i;
    naarScherm('intro', 'intro' + (i + 1));
  }

  // ------------------------------------------------------------------------------------------
  // 4. Race
  // ------------------------------------------------------------------------------------------
  var CFG = {
    paracetamol: {
      secPerUur: 90 / 24, Cmax: 20, monster: 0.02, dun: 0.1,
      as: [10, 15], eenheid: 'mg/L', // hulplijnen; de venstergrenzen komen uit M.venster(casus, t)
      zoneLabel: null, toxLabel: null
    },
    lithium: {
      secPerUur: 90 / 240, Cmax: 2, monster: 0.1, dun: 1,
      as: [], eenheid: 'mmol/L', // + casus.toxisch; de venstergrenzen komen uit M.venster(casus, t)
      zoneLabel: ['in de zone'], toxLabel: 'giftig'
    }
  };
  // Zonelabel letterlijk uit het casusblad: "pijnstilling (vereenvoudigd)" -> twee regels.
  CFG.paracetamol.zoneLabel = (function (l) { var i = l.indexOf(' ('); return i > 0 ? [l.slice(0, i), l.slice(i + 1)] : [l]; })(M.casus('paracetamol').zone.label);
  var AANLOOP_S = 3; // seconden echte tijd vóór t = 0 (bij speed 1)

  function tijdLabel(c, t, metUur) {
    if (c.id === 'lithium') {
      var d = Math.floor(t / 24 + 1e-9), h = Math.round(t - d * 24);
      if (h === 24) { d++; h = 0; }
      return h === 0 ? 'Dag ' + d : 'Dag ' + d + (metUur ? ' · ' + h + ' u' : '');
    }
    return 'Uur ' + Math.floor(t + 1e-9);
  }
  // Midden in een zin: "uur 18", "dag 3 · 8 u" (als label los: "Uur 18", "Dag 3 · 8 u").
  function inZin(label) { return label.charAt(0).toLowerCase() + label.slice(1); }
  function klokHtml(c, t) {
    t = Math.max(0, t);
    if (c.id === 'lithium') {
      var d = Math.floor(t / 24), h = Math.floor(t - d * 24);
      return 'Dag ' + d + '<small>· ' + h + ' u</small>';
    }
    return 'Uur ' + Math.floor(t);
  }

  // gids = draaiboek van de oefenronde (SoS.tutorial) of niets. Met gids is dit precies dezelfde race, met
  // drie verschillen: de klok staat stil tot de speler de gemarkeerde knop tikt, er staat één uitlegzin in
  // beeld, en de plotwending (misselijkheid) doet niet mee. De ronde stopt op gids.eind en telt niet mee.
  function startRace(i, gids) {
    var c = M.casus(gids ? gids.casus : RACES[i]);
    var cfg = CFG[c.id];
    var race = S.maakRace(c, gids ? { blokkades: false } : undefined);
    R = {
      i: i, casus: c, cfg: cfg, race: race,
      gids: gids ? { stappen: gids.stappen, eind: gids.eind, klaar: gids.klaar, i: 0, bevroren: false, t0: performance.now(), duur: null } : null,
      stemming: null,
      poorten: M.poortjes(c), g: 0,
      keuze: { route: null, aantal: 0, poging: false },
      gegeven: [],
      klok: -AANLOOP_S / cfg.secPerUur,
      monsters: [], dun: [], volgendDun: 0,
      voorgeschiedenis: [],
      toestand: null, toxisch: false,
      onthuld: {}, effecten: [], ibuprofen: false, leverOver: false, laatstePoort: null, kiesT0: 0,
      laatsteTs: null, klaar: false, rafId: 0,
      startEcht: performance.now(), duurEcht: null,
      tekstKlok: '', tekstScore: '', trend: '', dagteller: -1,
      melding: { prio: -1, tot: 0 }
    };
    // Lithium: ze slikt al jaren; teken de laatste dag ervoor (zelfde steady state als de race-start).
    if (c.start && c.start.type === 'steadyState') {
      var vs = M.maakSim(c, { t0: -24 });
      for (var k = 0; k < 3; k++) {
        var tg = -24 + k * c.start.interval;
        vs.naar(tg);
        R.voorgeschiedenis.push({ t: tg, C: vs.C });
        vs.geef('slik');
        for (var s = 0; s < 40; s++) { vs.stap(c.start.interval / 40); R.voorgeschiedenis.push({ t: vs.t, C: vs.C }); }
      }
    }
    bouwRaceUi();
    naarScherm('race', gids ? 'tutorial' : 'race' + (i + 1));
    werkPatientBij();
    meetDoek();
    $('melding').className = 'melding';
    if (gids) gidsStap(); // stap 1: de klok staat meteen stil
    else melding('Tik een knop vóór het paarse poortje: wat je kiest, gebeurt als het poortje bij ‘nu’ is.', { prio: 0, duur: AANLOOP_S + 3 });
    R.rafId = root.requestAnimationFrame(lus);
  }

  function bouwRaceUi() {
    var c = R.casus;
    $('finish').hidden = true;
    $('klok').innerHTML = klokHtml(c, 0);
    $('qaly-getal').textContent = '0';
    $('qaly').className = 'qaly';
    $('qaly-trend').textContent = '';
    var lever = $('lever');
    lever.hidden = !(c.bovengrens && c.bovengrens.type === 'dagteller');
    lever.classList.remove('vol');
    $('finish-kop').textContent = R.gids ? R.gids.klaar.kop : 'Race klaar';
    $('finish-label').textContent = R.gids ? R.gids.klaar.label : 'QALY-punten';
    doc.querySelector('#finish [data-actie="verder"]').textContent = R.gids ? R.gids.klaar.knop : 'Verder';
    var chips = $('patient').querySelectorAll('.chip');
    for (var ci = 0; ci < chips.length; ci++) chips[ci].remove();
    $('patient-naam').textContent = c.patient;
    // knoppen
    var nav = $('knoppen');
    nav.innerHTML = '';
    var lijst = c.id === 'lithium'
      ? [['slik', 'Tablet', 'tablet'], ['niets', 'Overslaan', 'niets'], ['spuit', 'Spuit', 'spuit']]
      : [['slik', 'Tablet', 'tablet'], ['zetpil', 'Zetpil', 'zetpil'], ['spuit', 'Spuit', 'spuit'], ['niets', 'Niets', 'niets']];
    R.knoppen = {};
    lijst.forEach(function (d) {
      var b = el('button', { type: 'button', class: 'actie', 'data-actie': d[0], 'aria-pressed': 'false', 'aria-label': d[1] });
      b.innerHTML = icoon(d[2]) + '<span>' + d[1] + '</span>';
      var viaPointer = 0;
      b.addEventListener('pointerdown', function (ev) {
        if (ev.button != null && ev.button > 0) return;
        viaPointer = performance.now();
        tikActie(d[0], b);
      });
      b.addEventListener('click', function () {
        if (performance.now() - viaPointer < 1000) return; // al afgehandeld via pointerdown
        tikActie(d[0], b);
      });
      nav.appendChild(b);
      R.knoppen[d[0]] = b;
    });
    werkKnoppenBij();
  }

  function doelGeblokkeerd() {
    if (!R || R.gids || R.g >= R.poorten.length) return null;
    return M.geblokkeerd(R.casus, 'slik', R.poorten[R.g]);
  }

  function werkKnoppenBij() {
    if (!R) return;
    var blok = doelGeblokkeerd();
    Object.keys(R.knoppen).forEach(function (r) {
      var b = R.knoppen[r];
      var gek = R.keuze.route === r;
      b.classList.toggle('gekozen', gek);
      b.setAttribute('aria-pressed', gek ? 'true' : 'false');
      b.setAttribute('data-badge', gek ? (R.keuze.aantal > 1 ? R.keuze.aantal + '×' : '✓') : '');
      if (r === 'slik') {
        b.classList.toggle('geblokkeerd', !!blok);
        b.querySelector('span').textContent = blok ? 'Misselijk' : 'Tablet';
      }
    });
  }

  function flits(b, klasse) {
    b.classList.remove(klasse);
    void b.offsetWidth;
    b.classList.add(klasse);
    setTimeout(function () { b.classList.remove(klasse); }, 380);
  }

  function tikActie(route, b) {
    unlock();
    if (!R || R.klaar) return;
    var c = R.casus;
    flits(b, 'tik');
    // Oefenronde: alleen de gemarkeerde knop doet iets, en alleen terwijl de klok stilstaat.
    var G = R.gids;
    if (G && !(G.bevroren && G.stappen[G.i].knop === route)) {
      flits(b, 'schud');
      keuzeInfo(G.bevroren ? 'Kies nu ' + KEUZENAAM[G.stappen[G.i].knop] + '.' : 'Even kijken wat er gebeurt.', 'laat');
      return;
    }
    // Lithium-spuitknop: zichtbaar, doet niets, geen strafpunten.
    if (route === 'spuit' && c.routes.spuit && c.routes.spuit.doetNiets) {
      R.race.geef('spuit');
      speel('bonk');
      flits(b, 'schud');
      melding(c.routes.spuit.tekst, { soort: 'grap', prio: 2, duur: 2.6 });
      R.effecten.push({ type: 'bonk', t0: performance.now() });
      return;
    }
    // Slikken tijdens misselijkheid: geweigerd (wordt op het poortje gelogd als poging).
    var blok = route === 'slik' && doelGeblokkeerd();
    if (blok) {
      R.keuze.poging = true;
      speel('bonk');
      flits(b, 'schud');
      melding(blok.tekst, { soort: 'wending', prio: 2, duur: 2.4, fig: figuur({ wie: 'opa', stemming: 'misselijk' }) });
      return;
    }
    if (R.g >= R.poorten.length) { keuzeInfo('Geen poortjes meer in deze race.'); return; }
    var doelLabel = inZin(tijdLabel(c, R.poorten[R.g], true));
    // Te laat: een tik vlak ná een poortje telt niet stilletjes mee voor het volgende poortje.
    if (!G && R.laatstePoort && performance.now() - R.laatstePoort.echt < TE_LAAT_MS / SPEED) {
      flits(b, 'schud');
      speel('overslaan');
      keuzeInfo('Te laat voor ' + inZin(R.laatstePoort.label) + '. Kies opnieuw voor ' + doelLabel + '.', 'laat');
      return;
    }
    var k = R.keuze;
    var max = maxAantal(route);
    var tekst;
    if (k.route === route && k.aantal < max) {
      k.aantal++;
      tekst = k.aantal + '× Tablet voor ' + doelLabel;
    } else if (k.route === route) {
      k.route = null; k.aantal = 0;
      tekst = 'Keuze gewist voor ' + doelLabel + ': niets kiezen is overslaan.';
    } else {
      k.route = route; k.aantal = 1;
      tekst = KEUZENAAM[c.id === 'lithium' && route === 'niets' ? 'overslaan' : route] + ' voor ' + doelLabel;
    }
    R.kiesT0 = performance.now();
    speel('tik');
    keuzeInfo(tekst, k.route ? 'gekozen' : 'gewist');
    werkKnoppenBij();
    if (G) gidsVerder();
  }

  // ---------- gids (oefenronde) ----------
  // Zet de klok stil op de huidige stap: de zin in beeld en de knop gemarkeerd (class "wijs", data-wijs).
  function gidsStap() {
    var G = R.gids, st = G.stappen[G.i];
    G.bevroren = true;
    var zin = st.zin === 'lekentaal.onder' ? R.casus.lekentaal.onder : st.zin;
    melding(zin, { soort: st.zin === 'lekentaal.onder' ? 'au' : null });
    var b = R.knoppen[st.knop];
    if (b) { b.classList.add('wijs'); b.setAttribute('data-wijs', '1'); }
  }
  // De speler heeft de gemarkeerde knop getikt: markering weg, de klok loopt weer.
  function gidsVerder() {
    var G = R.gids;
    G.bevroren = false;
    G.gevraagd = true; // deze stap is gevraagd; de volgende komt pas na het poortje
    Object.keys(R.knoppen).forEach(function (r) { R.knoppen[r].classList.remove('wijs'); R.knoppen[r].removeAttribute('data-wijs'); });
  }

  // Lithium: tablet tot 2× per poortje (casusblad: "elk poortje dubbel"); paracetamol 1 g per keer.
  function maxAantal(route) { return route === 'slik' && R.casus.id === 'lithium' ? 2 : 1; }
  var KEUZENAAM = { slik: 'Tablet', zetpil: 'Zetpil', spuit: 'Spuit', niets: 'Niets', overslaan: 'Overslaan' };
  var TE_LAAT_MS = 300; // echte tijd bij speed 1 (gedeeld door ?speed=N)

  var infoTimer = 0;
  function keuzeInfo(tekst, soort) {
    var e = $('keuze-info');
    if (!e) return;
    e.textContent = tekst;
    e.className = 'keuze-info zicht' + (soort ? ' ' + soort : '');
    clearTimeout(infoTimer);
    infoTimer = setTimeout(function () { e.classList.remove('zicht'); }, Math.max(500, 1800 / Math.min(SPEED, 4)));
  }

  // ---------- meldingen (korte witte tekst, boven in het podium, in het verleden-deel) ----------
  // Er is er altijd hooguit één in beeld: een nieuwe melding wacht tot de vorige is uitgefaded.
  // Zolang hij zichtbaar is, tekent het canvas geen poort- of gebeurtenislabels onder hem (R.meldVlak).
  var meldTimer = 0, meldWissel = 0, MELD_FADE = 260;
  function melding(tekst, o) {
    o = o || {};
    if (!R) return;
    var nu = performance.now();
    var prio = o.prio || 0;
    if (nu < R.melding.tot && prio < R.melding.prio) return;
    var duur = (o.duur || 2.4) * 1000 / Math.min(SPEED, 4);
    var blijft = !!R.gids; // oefenronde: de zin blijft staan tot de volgende (altijd precies één zin in beeld)
    R.melding = { prio: prio, tot: blijft ? 0 : nu + duur };
    var m = $('melding');
    if (blijft && m.classList.contains('zicht') && m.getAttribute('data-zin') === tekst) return;
    var r = R;
    clearTimeout(meldTimer); clearTimeout(meldWissel);
    function toon() {
      if (R !== r || R.klaar) return;
      m.className = 'melding' + (o.soort ? ' ' + o.soort : '') + (o.fig ? ' met-fig' : '');
      m.innerHTML = '';
      if (o.fig) m.appendChild(el('div', { class: 'm-fig', html: o.fig }));
      m.appendChild(el('div', { text: tekst }));
      m.setAttribute('data-zin', tekst);
      void m.offsetWidth;
      var t0 = performance.now();
      R.meldVlak = { top: m.offsetTop, bottom: m.offsetTop + m.offsetHeight, tot: blijft ? Infinity : t0 + duur + MELD_FADE + 60 };
      m.classList.add('zicht');
      if (!blijft) meldTimer = setTimeout(function () { m.classList.remove('zicht'); }, duur);
    }
    if (m.classList.contains('zicht')) {
      m.classList.remove('zicht');
      if (R.meldVlak && !blijft) R.meldVlak.tot = nu + MELD_FADE + 60 + 400;
      meldWissel = setTimeout(toon, MELD_FADE);
    } else toon();
  }

  // ---------- canvas ----------
  var doek = null, ctx = null, D = { w: 0, h: 0, dpr: 1 };
  var STERREN = [];
  (function () {
    var kleuren = ['#ff8fb8', '#ffd166', '#7cc4ff', '#b07cff', '#ffffff', '#7ef0c4', '#ffffff'];
    var z = 7;
    function rnd() { z = (z * 16807) % 2147483647; return (z - 1) / 2147483646; } // vaste reeks
    for (var i = 0; i < 170; i++) {
      STERREN.push({ x: rnd(), y: rnd(), r: 0.7 + rnd() * 1.6, k: kleuren[Math.floor(rnd() * kleuren.length)],
        a: 0.25 + rnd() * 0.6, p: 0.15 + rnd() * 0.5, f: rnd() * 6.28, vierkant: rnd() < 0.18 });
    }
  })();

  // Dezelfde sterren als in de race, als vaste achtergrond voor start, introkaartjes en eindscherm.
  function zetSterren() {
    try {
      var W = 420, H = 900, cv = doc.createElement('canvas');
      cv.width = W * 2; cv.height = H * 2;
      var x = cv.getContext('2d');
      x.scale(2, 2);
      STERREN.forEach(function (st) {
        x.globalAlpha = st.a; x.fillStyle = st.k;
        if (st.vierkant) x.fillRect(st.x * W, st.y * H, st.r * 1.6, st.r * 2.6);
        else { x.beginPath(); x.arc(st.x * W, st.y * H, st.r, 0, 6.283); x.fill(); }
      });
      doc.documentElement.style.setProperty('--sterren', 'url(' + cv.toDataURL('image/png') + ')');
    } catch (e) { /* zonder sterren is het scherm gewoon zwart */ }
  }

  function meetDoek() {
    doek = $('doek');
    if (!doek) return;
    ctx = doek.getContext('2d');
    var r = doek.getBoundingClientRect();
    D.dpr = Math.min(root.devicePixelRatio || 1, 2.5);
    D.w = Math.max(1, r.width); D.h = Math.max(1, r.height);
    doek.width = Math.round(D.w * D.dpr); doek.height = Math.round(D.h * D.dpr);
    ctx.setTransform(D.dpr, 0, 0, D.dpr, 0, 0);
    if (R) {
      var gat = Math.max(84, Math.min(130, D.h * 0.22));
      R.pxPerUur = gat / R.casus.poortjes.interval;
      R.yNu = Math.round(D.h * 0.52);
      R.links = 18; R.rechts = 18;
      // breedste poortlabel (+ icoontje, lithium ook "2×"): zo breed is de gereserveerde labelstrook
      ctx.font = '700 15px ' + FONT;
      var mx = 0;
      R.poorten.forEach(function (T) { mx = Math.max(mx, ctx.measureText(tijdLabel(R.casus, T, true)).width); });
      R.labelMax = mx + 34 + (R.casus.id === 'lithium' ? 18 : 0);
    }
  }

  function xVan(C) {
    var b = D.w - R.links - R.rechts;
    return R.links + Math.max(0, Math.min(1, C / R.cfg.Cmax)) * b;
  }
  function yVan(t) { return R.yNu + (t - R.klok) * R.pxPerUur; }
  function tVan(y) { return R.klok + (y - R.yNu) / R.pxPerUur; }

  function zoneVan(C, t) {
    var v = M.venster(R.casus, t);
    return C < v.laag ? 'onder' : (C > v.hoog ? 'boven' : 'zone');
  }
  // Eén kleur per betekenis (ook op het eindscherm): groen = in de zone, blauw = te laag, geel = te hoog,
  // rood = giftig/lever; oranje = ibuprofen, limoen = misselijk, paars = poortjes.
  var LIJNKLEUR = { zone: '#7ef0c4', onder: '#7cc4ff', boven: '#ffe14d', tox: '#ff4d5e' };
  // lv = leverschade (dagteller boven het maximum): dan is de lijn rood, ook al is de spiegel "in de zone".
  function lijnKleur(C, t, lv) {
    if (lv) return LIJNKLEUR.tox;
    if (R.casus.toxisch != null && C > R.casus.toxisch) return LIJNKLEUR.tox;
    return LIJNKLEUR[zoneVan(C, t)];
  }

  // Bovenrand (as-labels) en onderrand (knoppen): hier worden poortjes en spiegel weggevaagd.
  var BOVENRAND = 58;
  // Poortlabels staan aan de kant WEG van de stip (R.kant: 'links' | 'rechts', met speling zodat ze niet
  // heen en weer springen). Die strook (R.strook) is gereserveerd: de stip, het waardelabel en het
  // "onderweg"-bolletje blijven erbuiten. Poortjes vlak bij de nu-lijn (PROX) volgen de kant altijd; verder
  // in het verleden houden ze de kant die ze hadden. Zo ligt er nooit tekst over tekst, ook niet op het poortje.
  var INSPRING = 30, PROX = 40; // inspringen: het paarse label heeft een lijn ervoor en erachter

  function poortjeAlpha(yg, h, basis) {
    var a = basis;
    // onderin: weg vóór de keuzeregel boven de knoppen
    if (yg > h - 76) a *= Math.max(0, (h - 40 - yg) / 36);
    // bovenin: weg vóór de as-labels en de vastgezette gebeurtenis-labels
    if (yg < BOVENRAND + 50) a *= Math.max(0, (yg - BOVENRAND - 26) / 24);
    return a;
  }

  // Bedekt de melding (boven in het podium) deze rij? Dan geen poort- of gebeurtenislabel daar.
  function onderMelding(y0, y1, nu) {
    var m = R && R.meldVlak;
    return !!(m && nu < m.tot && y1 > m.top - 10 && y0 < m.bottom + 12);
  }

  // stap 1: lijnen; stap 2: label (met zwarte halo) en icoontje van de keuze/toediening.
  function tekenPoortjes(nu, stap) {
    var c = R.casus, w = D.w, h = D.h, L = R.links, Rr = w - R.rechts;
    ctx.font = '700 15px ' + FONT;
    ctx.textBaseline = 'middle';
    R.zijde = R.zijde || [];
    R.zijdeT = R.zijdeT || [];
    for (var g = 0; g < R.poorten.length; g++) {
      var T = R.poorten[g], yg = yVan(T);
      if (yg < -30 || yg > h + 30) continue;
      var verleden = g < R.g, doel = g === R.g;
      if (stap === 1) {
        var zi = R.zijde[g];
        if (zi == null) { R.zijde[g] = R.kant; R.zijdeT[g] = -1e9; }
        else if (zi !== R.kant && (!verleden || Math.abs(yg - R.yNu) < PROX)) { R.zijde[g] = R.kant; R.zijdeT[g] = nu; }
      }
      var zijde = R.zijde[g] || R.kant;
      var label = tijdLabel(c, T, true);
      var tw = ctx.measureText(label).width;
      var icoonSoort = null, aantal = 1;
      if (doel && R.keuze.route) { icoonSoort = R.keuze.route === 'slik' ? 'tablet' : R.keuze.route; aantal = R.keuze.aantal; }
      else if (doel && R.keuze.poging) icoonSoort = 'kruis';
      else if (verleden && R.gegeven[g]) {
        var gg = R.gegeven[g];
        icoonSoort = gg.soort === 'slik' ? 'tablet' : (gg.soort === 'geblokkeerd' ? 'kruis' : (gg.soort === 'leeg' ? null : gg.soort));
        aantal = gg.aantal || 1;
      }
      var extra = icoonSoort ? 34 + (aantal > 1 ? 18 : 0) : 0;
      var wb = tw + extra;
      var xs = zijde === 'links' ? L + INSPRING : Rr - INSPRING - wb; // begin van label (+ icoon)
      var l1 = xs - 8, r1 = xs + wb + 8;
      // komend: ≥ 90% dekking (contrast), doel: vol en helder, verleden: gedimd (geschiedenis)
      // verleden: lijn gedimd, label in een dof paars dat toch ≥ 4,5:1 haalt (#8a72c0 op zwart = 5,25)
      var a = poortjeAlpha(yg, h, verleden ? (stap === 1 ? 0.4 : 1) : (doel ? 1 : 0.92));
      if (stap === 1) {
        if (a <= 0.01) continue;
        ctx.globalAlpha = a;
        ctx.strokeStyle = doel ? '#d9c2ff' : (verleden ? KLEUR.paars : '#c9a4ff');
        ctx.lineWidth = doel ? 2.5 : (verleden ? 1 : 1.25);
        ctx.beginPath();
        if (l1 > L - 6) { ctx.moveTo(L - 6, yg); ctx.lineTo(l1, yg); }
        ctx.moveTo(r1, yg); ctx.lineTo(Rr + 6, yg); ctx.stroke();

  function neemMonster(forceer) {
